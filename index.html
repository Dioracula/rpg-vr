<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG MMO - Inventário Seguro e Combate VR</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none;}
        #ui-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 15, 20, 0.95); z-index: 9999999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: sans-serif; pointer-events: all !important; } 
        .menu-box { background: #2c3e50; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 320px; pointer-events: auto; } 
        .menu-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; font-size: 1rem;} 
        .btn { padding: 12px 20px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; margin: 5px 0; width: 100%; color: white; transition: 0.2s;} 
        .btn:hover { transform: scale(1.02); }
        .btn:active { transform: scale(0.98); opacity: 0.8; }
        .btn-green { background: #27ae60; } .btn-blue { background: #2980b9; } .btn-orange { background: #d35400; } 
        .btn-purple { background: #8e44ad; } .btn-purple:hover { background: #9b59b6; }
        #start-menu { display: none; }
        #login-error { color: #e74c3c; font-size: 0.9rem; margin-top: 10px; display: none; font-weight: bold; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px;}
        body.menu-aberto .a-canvas { pointer-events: none !important; }
        #crosshair { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; background: rgba(255,255,255,0.8); border-radius: 50%; z-index: 1000; pointer-events: none;}

        /* INTERFACE MOBILE */
        #mobile-ui { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1000; pointer-events: none; display: none;}
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px; background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; border: 2px solid rgba(255,255,255,0.3); touch-action: none;}
        #joystick-stick { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(241, 196, 15, 0.8); border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; transition: transform 0.05s ease-out;}
        #action-buttons { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; align-items: flex-end;}
        .hud-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(44, 62, 80, 0.8); border: 2px solid #bdc3c7; color: white; font-size: 1.5rem; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-weight: bold; touch-action: none; user-select: none; pointer-events: auto;}
        .hud-btn:active { background: #f1c40f; color: #111; transform: scale(0.95); }
        #btn-atacar { width: 80px; height: 80px; background: rgba(192, 57, 43, 0.8); border-color: #e74c3c; font-size: 2rem; margin-top: 10px;}
        .menu-top-right { position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; pointer-events: auto;}
    </style>

    <script>
        const firebaseConfig = {
             apiKey: "AIzaSyCdsfW1ALz-8ktkYl_rACiY6tu0M2wqkH0",
             authDomain: "rpg-vr-online.firebaseapp.com",
             databaseURL: "https://rpg-vr-online-default-rtdb.firebaseio.com",
             projectId: "rpg-vr-online",
             storageBucket: "rpg-vr-online.firebasestorage.app",
             messagingSenderId: "676174796336",
             appId: "1:676174796336:web:7a91d19a758d29ef247ff5",
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth(); 
        const firestoreDB = firebase.firestore(); 
        const realtimeDB = firebase.database();

        window.GAME_MODE = 'NONE'; 
        window.GAME_STARTED = false; 
        window.currentUser = null; 
        window.lastActionTime = Date.now(); 
        window.joystickVector = { x: 0, y: 0 };
        window.invAberto = false; 
        window.atribAberto = false;
        
        window.playerState = {
            nivel: 1, xp: 0, xpProxNivel: 50, pontos: 0, ouro: 0, forca: 10, velocidade: 5, defesa: 5, hpAtual: 100, hpMax: 100, mpAtual: 100, mpMax: 100, vivo: true,
            armaEquipada: 'Desarmado', escudoEquipado: false, nomeEscudo: '', flechas: 10, shurikens: 5, chaves: {}, invulneravel: false, ultimoRespawn: { id: 'base_inicial', x: 0, y: 0, z: 0 }
        };

        window.ANIM_PARADO = 'chr784_armature|chr784_bn01'; 
        window.ANIM_ANDANDO = 'chr784_armature|chr784_br01'; 
        window.ANIM_ATIRANDO = 'chr784_armature|chr784_ba01'; 
        window.ANIM_DANO = 'chr784_armature|chr784_bd01'; 
        window.ANIM_MORTE = 'chr784_armature|chr784_bd02'; 

        window.bancoDeArmas = {
            'Desarmado': { categoria: 'Luva', danoBonus: 0, defesaBonus: 0, distancia: 2.0, modeloGlb: '', visualDir: '', visualEsq: '' },
            'Espada Inicial': { categoria: 'Espada', danoBonus: 5, defesaBonus: 0, distancia: 3.0, modeloGlb: '', visualDir: '<a-cylinder color="#8B4513" radius="0.02" height="0.15" position="0 0 0"></a-cylinder><a-box color="#DAA520" width="0.15" height="0.05" depth="0.05" position="0 0.075 0"></a-box><a-cylinder color="#aaa" radius="0.02" height="0.8" position="0 0.5 0"></a-cylinder>', visualEsq: '' }
        };

        // ==========================================
        // FUNÇÕES HOISTED GERAIS
        // ==========================================
        window.salvarJogoNuvem = function() { 
            if (!window.currentUser) return; 
            firestoreDB.collection("jogadores").doc(window.currentUser.uid).set(window.playerState).catch(e => console.error(e)); 
        };

        window.atualizarArmaVisual = function() { 
            let containerDir = document.querySelector('#arma-visual-dir'); let containerEsq = document.querySelector('#arma-visual-esq'); let containerPC = document.querySelector('#arma-visual-pc'); let escudoPC = document.querySelector('#escudo-visual-pc'); 
            if(!containerDir || !containerEsq || !containerPC || !escudoPC) return; 
            
            containerDir.innerHTML = ''; containerEsq.innerHTML = ''; containerPC.innerHTML = ''; escudoPC.innerHTML = ''; 
            
            let armaStats = window.bancoDeArmas[window.playerState.armaEquipada]; 
            if (armaStats) {
                let htmlArma = '';
                if (armaStats.modeloGlb && armaStats.modeloGlb !== '') { htmlArma = `<a-entity gltf-model="${armaStats.modeloGlb}" scale="${armaStats.escalaMao || '1 1 1'}" rotation="${armaStats.rotMao || '0 0 0'}" position="${armaStats.posMao || '0 0 0'}" anti-piscar></a-entity>`; } 
                else if (armaStats.visualDir) { htmlArma = armaStats.visualDir; }
                containerDir.innerHTML = htmlArma; containerPC.innerHTML = htmlArma;
            }

            let escudoStats = window.bancoDeArmas[window.playerState.nomeEscudo];
            if (window.playerState.escudoEquipado && escudoStats && (!armaStats || armaStats.categoria !== 'Arco')) { 
                let htmlEscudo = '';
                if(escudoStats.modeloGlb && escudoStats.modeloGlb !== '') { htmlEscudo = `<a-entity gltf-model="${escudoStats.modeloGlb}" scale="${escudoStats.escalaMao || '1 1 1'}" rotation="${escudoStats.rotMao || '0 0 0'}" position="${escudoStats.posMao || '0 0 0'}" anti-piscar></a-entity>`; } 
                else { htmlEscudo = `<a-box color="#4169E1" width="0.4" height="0.5" depth="0.05" position="0 0.1 0" rotation="-90 0 0"><a-box color="#C0C0C0" width="0.42" height="0.52" depth="0.02" position="0 0 -0.01"></a-box></a-box>`; }
                containerEsq.innerHTML = htmlEscudo; escudoPC.innerHTML = htmlEscudo;
            } else if (armaStats && armaStats.categoria === 'Arco') {
                let rot = { rotX: 180, rotY: 90, rotZ: 90 }; 
                let htmlArco = `<a-entity rotation="${rot.rotX} ${rot.rotY} ${rot.rotZ}"><a-torus color="#8B4513" radius="0.3" radius-tubular="0.015" arc="180" rotation="0 0 90"></a-torus><a-cylinder color="#DDDDDD" radius="0.002" height="0.6" rotation="0 0 0"></a-cylinder></a-entity>`;
                containerEsq.innerHTML = htmlArco; escudoPC.innerHTML = htmlArco;
            }
        };

        window.atualizarUI = function() { 
            let elsHtml = ['#txt-nivel-hud', '#txt-status-hud', '#hp-wrapper', '#mp-wrapper', '#txt-arma-hud', '#attr-nivel-classe', '#attr-hp-txt', '#attr-mp-txt', '#attr-hpmax', '#attr-mpmax', '#attr-atk', '#attr-def', '#attr-agi', '#attr-exp', '#attr-nextexp', '#attr-pts', '#inv-total-forca', '#inv-total-defesa', '#inv-total-ouro', '#tt-flechas', '#tt-shurikens', '#attr-slot-1', '#attr-slot-2']; 
            for(let i=0; i<elsHtml.length; i++) { if(!document.querySelector(elsHtml[i])) return; } 
            
            document.querySelector('#txt-nivel-hud').setAttribute('value', `Nivel: ${window.playerState.nivel} | XP: ${window.playerState.xp}/${window.playerState.xpProxNivel}`); 
            document.querySelector('#txt-status-hud').setAttribute('value', `HP: ${window.playerState.hpAtual}/${window.playerState.hpMax}   |   MP: ${window.playerState.mpAtual}/${window.playerState.mpMax}`); 
            let hpScale = Math.max(0, window.playerState.hpAtual / window.playerState.hpMax); document.querySelector('#hp-wrapper').setAttribute('scale', `${hpScale} 1 1`); 
            let mpScale = Math.max(0, window.playerState.mpAtual / window.playerState.mpMax); document.querySelector('#mp-wrapper').setAttribute('scale', `${mpScale} 1 1`); 
            
            let armaStats = window.bancoDeArmas[window.playerState.armaEquipada]; 
            let escudoStats = window.bancoDeArmas[window.playerState.nomeEscudo];
            
            let strEquip = window.playerState.armaEquipada;
            if(window.playerState.escudoEquipado && window.playerState.nomeEscudo) strEquip += ' + ' + window.playerState.nomeEscudo;
            document.querySelector('#txt-arma-hud').setAttribute('value', `Equipado: ${strEquip}`); 
            
            if (window.GAME_MODE === 'PC') { let r = document.querySelector('#rig'); if(r && r.hasAttribute('movement-controls')) r.setAttribute('movement-controls', 'speed', 0.1 + (window.playerState.velocidade * 0.01)); }
            
            let forcaTotal = window.playerState.forca + (armaStats ? armaStats.danoBonus : 0); 
            let defesaTotal = window.playerState.defesa + (armaStats ? armaStats.defesaBonus : 0) + (window.playerState.escudoEquipado && escudoStats ? escudoStats.defesaBonus : 0); 
            
            let els = { 
                '#attr-nivel-classe': `Lv ${window.playerState.nivel} Aventureiro`, '#attr-hp-txt': `HP: ${window.playerState.hpAtual}/${window.playerState.hpMax}`, '#attr-mp-txt': `MP: ${window.playerState.mpAtual}/${window.playerState.mpMax}`, '#attr-hpmax': window.playerState.hpMax, '#attr-mpmax': window.playerState.mpMax, '#attr-atk': forcaTotal, '#attr-def': defesaTotal, '#attr-agi': window.playerState.velocidade, '#attr-exp': window.playerState.xp, '#attr-nextexp': window.playerState.xpProxNivel, '#attr-pts': window.playerState.pontos, '#inv-total-forca': forcaTotal, '#inv-total-defesa': defesaTotal, '#inv-total-ouro': window.playerState.ouro, '#tt-flechas': window.playerState.flechas, '#tt-shurikens': window.playerState.shurikens, '#attr-slot-1': window.playerState.armaEquipada 
            }; 
            for(let id in els) { let e = document.querySelector(id); if(e) e.setAttribute('value', els[id]); } 
            
            let elSlot2 = document.querySelector('#attr-slot-2'); 
            if(elSlot2) { 
                if(window.playerState.escudoEquipado && window.playerState.nomeEscudo) elSlot2.setAttribute('value', window.playerState.nomeEscudo); 
                else if(armaStats && armaStats.categoria === 'Arco') elSlot2.setAttribute('value', '2 Maos (Arco)'); 
                else elSlot2.setAttribute('value', 'Vazio'); 
            } 
            window.atualizarArmaVisual(); 
            window.salvarJogoNuvem(); 
        };

        // ==========================================
        // RENDERIZADOR DE INVENTÁRIO CORRIGIDO PARA A-FRAME
        // ==========================================
        window.renderizarInventario = function() {
            let listaArmas = Object.keys(window.bancoDeArmas).filter(k => k !== 'Desarmado'); 
            let gridContainer = document.querySelector('#inv-grid-container'); 
            if(!gridContainer) return;
            
            // Limpa o inventário de forma segura para os componentes 3D não bugarem
            while (gridContainer.firstChild) {
                gridContainer.removeChild(gridContainer.firstChild);
            }
            
            let cols = 6; let startX = -0.75; let startY = 0.35; let gap = 0.3; 
            
            for (let i = 0; i < 18; i++) { 
                let col = i % cols; let row = Math.floor(i / cols); 
                
                let slot = document.createElement('a-box'); 
                slot.setAttribute('position', `${startX + (col * gap)} ${startY - (row * gap)} 0.02`); 
                slot.setAttribute('width', '0.25'); 
                slot.setAttribute('height', '0.25'); 
                slot.setAttribute('depth', '0.02'); 
                slot.setAttribute('color', '#2b1b12'); 
                
                let borda = document.createElement('a-plane'); 
                borda.setAttribute('width', '0.23'); borda.setAttribute('height', '0.23'); borda.setAttribute('color', '#f19e20'); borda.setAttribute('position', '0 0 0.011'); 
                
                let fundoCentro = document.createElement('a-plane'); 
                fundoCentro.setAttribute('width', '0.21'); fundoCentro.setAttribute('height', '0.21'); fundoCentro.setAttribute('color', '#1e110b'); fundoCentro.setAttribute('position', '0 0 0.012'); 
                
                slot.appendChild(borda); 
                slot.appendChild(fundoCentro); 
                
                if (i < listaArmas.length) { 
                    let nomeArma = listaArmas[i]; 
                    let armaStats = window.bancoDeArmas[nomeArma]; 
                    slot.classList.add('interativo'); 
                    slot.setAttribute('slot-interativo', `item: ${nomeArma}`); 
                    
                    if(armaStats && armaStats.modeloGlb && armaStats.modeloGlb !== '') { 
                        let miniatura = document.createElement('a-entity'); 
                        miniatura.setAttribute('gltf-model', armaStats.modeloGlb); 
                        miniatura.setAttribute('scale', armaStats.escalaInv || '0.15 0.15 0.15'); 
                        miniatura.setAttribute('rotation', armaStats.rotInv || '0 0 0'); 
                        miniatura.setAttribute('position', armaStats.posInv || '0 0 0.05'); 
                        slot.appendChild(miniatura);
                    } else { 
                        let txtNome = document.createElement('a-text'); 
                        txtNome.setAttribute('value', nomeArma); 
                        txtNome.setAttribute('align', 'center'); 
                        txtNome.setAttribute('width', '1'); 
                        txtNome.setAttribute('position', '0 0 0.02'); 
                        txtNome.setAttribute('color', '#FFF'); 
                        slot.appendChild(txtNome); 
                    } 
                } 
                gridContainer.appendChild(slot); 
            } 
        };

        realtimeDB.ref('banco_armas').on('value', snap => {
            let dados = snap.val();
            if(dados) { window.bancoDeArmas = Object.assign(window.bancoDeArmas, dados); }
            if(window.renderizarInventario) window.renderizarInventario();
            if(window.GAME_STARTED) window.atualizarUI();
        });

        const URL_DO_SERVIDOR_IA = "https://SEU_PROJETO_AQUI.onrender.com"; 
        function acordarServidorRender() { if (URL_DO_SERVIDOR_IA.startsWith("http")) { fetch(URL_DO_SERVIDOR_IA, { mode: 'no-cors' }).catch(() => {}); } }
        acordarServidorRender(); setInterval(acordarServidorRender, 10 * 60 * 1000);

        // ==========================================
        // CÓDIGO DO MOUSE PC (HÍBRIDO)
        // ==========================================
        window.travarMousePC = function() {
            if (window.GAME_MODE !== 'PC') return;
            let canvas = document.querySelector('.a-canvas');
            if (canvas) canvas.requestPointerLock();
            let reticle = document.querySelector('#cursor-centro');
            if (reticle) { reticle.setAttribute('raycaster', 'objects: .interativo; far: 20'); reticle.setAttribute('visible', 'true'); }
            let mouseCursor = document.querySelector('#mouse-cursor');
            if (mouseCursor) mouseCursor.setAttribute('raycaster', 'objects: none');
        };

        window.destravarMousePC = function() {
            if (window.GAME_MODE !== 'PC') return;
            document.exitPointerLock();
            let reticle = document.querySelector('#cursor-centro');
            if (reticle) { reticle.setAttribute('raycaster', 'objects: none'); reticle.setAttribute('visible', 'false'); }
            let mouseCursor = document.querySelector('#mouse-cursor');
            if (mouseCursor) mouseCursor.setAttribute('raycaster', 'objects: .interativo; far: 20');
        };

        // ==========================================
        // MENUS FLUTUANTES GERAIS
        // ==========================================
        window.posicionarMenuDeFrente = function(menuId) {
            let menu = document.querySelector(menuId); let camera = document.querySelector('[camera]'); let cena = document.querySelector('a-scene');
            if(!menu || !camera || !cena) return;

            if(menu.parentNode !== cena) { cena.appendChild(menu); }
            let camPos = new THREE.Vector3(); camera.object3D.getWorldPosition(camPos); 
            let camQuat = new THREE.Quaternion(); camera.object3D.getWorldQuaternion(camQuat);
            let camRotY = new THREE.Euler().setFromQuaternion(camQuat, 'YXZ').y;
            
            let distancia = 1.5; 
            let spawnX = camPos.x - Math.sin(camRotY) * distancia;
            let spawnZ = camPos.z - Math.cos(camRotY) * distancia;

            menu.object3D.position.set(spawnX, camPos.y - 0.2, spawnZ);
            menu.object3D.rotation.set(0, camRotY, 0);
            
            if(menuId === '#caixa-dialogo') menu.setAttribute('scale', '1 1 1'); else menu.setAttribute('scale', '0.65 0.65 0.65');
        };

        window.toggleMenu = function(tipo) {
            let menuInv = document.querySelector('#menu-inventario-novo'); let menuAtrib = document.querySelector('#menu-atributos');
            if (tipo === 'inv') {
                window.invAberto = !window.invAberto;
                if (window.invAberto) {
                    window.atribAberto = false; if(menuAtrib) menuAtrib.setAttribute('scale', '0 0 0');
                    window.posicionarMenuDeFrente('#menu-inventario-novo'); window.destravarMousePC();
                } else { if(menuInv) menuInv.setAttribute('scale', '0 0 0'); if(!window.npcAtivo) window.travarMousePC(); }
            } else if (tipo === 'atrib') {
                window.atribAberto = !window.atribAberto;
                if (window.atribAberto) {
                    window.invAberto = false; if(menuInv) menuInv.setAttribute('scale', '0 0 0');
                    window.posicionarMenuDeFrente('#menu-atributos'); window.destravarMousePC();
                } else { if(menuAtrib) menuAtrib.setAttribute('scale', '0 0 0'); if(!window.npcAtivo) window.travarMousePC(); }
            }
            window.atualizarUI();
        };

        window.abrirDialogoNPC = function(data) {
            window.npcAtivo = data;
            let cx = document.querySelector('#caixa-dialogo'); let tNome = document.querySelector('#npc-nome-ui'); let tTexto = document.querySelector('#npc-texto-ui'); let entRec = document.querySelector('#npc-recompensa-ui'); let tRec = document.querySelector('#npc-rec-texto'); let btnAceitar = document.querySelector('#btn-npc-aceitar');
            if(!cx || !tNome || !tTexto) return;

            tNome.setAttribute('value', data.nome || "NPC");
            let jaConcluiu = data.chaveConclusao && window.playerState.chaves[data.chaveConclusao]; let podeFazer = !data.requisito || window.playerState.chaves[data.requisito];

            if (data.tipo === 'dialogo' || jaConcluiu) {
                tTexto.setAttribute('value', data.dialogoPadrao || "Olá aventureiro.");
                entRec.setAttribute('visible', 'false'); btnAceitar.setAttribute('visible', 'false');
            } else if ((data.tipo === 'secundaria' || data.tipo === 'primaria') && podeFazer) {
                tTexto.setAttribute('value', data.dialogoMissao || "Preciso de ajuda com esta missão!");
                let recStr = ""; if (data.recXP && data.recXP > 0) recStr += `+${data.recXP} XP   `; if (data.recOuro && data.recOuro > 0) recStr += `+${data.recOuro} Ouro   `; if (data.recItem && data.recItem !== "") recStr += `Item: ${data.recItem}`;
                if (recStr.trim() !== "") { tRec.setAttribute('value', recStr); entRec.setAttribute('visible', 'true'); } else { entRec.setAttribute('visible', 'false'); }
                btnAceitar.setAttribute('visible', 'true'); 
            } else {
                tTexto.setAttribute('value', "Você ainda não tem os requisitos para falar comigo.");
                entRec.setAttribute('visible', 'false'); btnAceitar.setAttribute('visible', 'false'); 
            }
            
            window.posicionarMenuDeFrente('#caixa-dialogo'); window.destravarMousePC(); 
        };

        window.fecharDialogoNPC = function() {
            let cx = document.querySelector('#caixa-dialogo'); if(cx) cx.setAttribute('scale', '0 0 0'); window.npcAtivo = null;
            if (!window.invAberto && !window.atribAberto) { window.travarMousePC(); }
        };

        window.aceitarMissaoNPC = function() {
            let data = window.npcAtivo; if (!data) return;
            if (data.chaveConclusao) { window.playerState.chaves[data.chaveConclusao] = true; }
            if (data.recXP) window.playerState.xp += Number(data.recXP);
            if (data.recOuro) window.playerState.ouro += Number(data.recOuro);
            if (data.recItem && window.bancoDeArmas[data.recItem]) { window.playerState.armaEquipada = data.recItem; }
            if (window.playerState.xp >= window.playerState.xpProxNivel) { window.playerState.nivel++; window.playerState.pontos += 3; window.playerState.xp -= window.playerState.xpProxNivel; window.playerState.xpProxNivel = Math.floor(window.playerState.xpProxNivel * 1.5); }
            window.atualizarUI(); window.salvarJogoNuvem(); window.tocarSom('snd-magic');
            let aviso = document.querySelector('#texto-central'); 
            if(aviso) { aviso.setAttribute('value', 'MISSÃO CONCLUÍDA!'); aviso.setAttribute('color', '#f1c40f'); aviso.setAttribute('visible', 'true'); setTimeout(() => aviso.setAttribute('visible', 'false'), 3000); }
            window.fecharDialogoNPC();
        };

        // ==========================================
        // ATAQUE E DANO (PC e Mobile)
        // ==========================================
        window.realizarAtaque = function() {
            if(!window.GAME_STARTED || window.GAME_MODE === 'VR' || !window.playerState.vivo || window.npcAtivo || window.invAberto || window.atribAberto) return;

        AFRAME.registerComponent('sistema-bau', { init: function() { let aberto = false; this.el.addEventListener('click', () => { if(!aberto) { aberto = true; this.el.setAttribute('color', '#8B4513'); this.el.setAttribute('rotation', '-45 45 0'); window.playerState.flechas += 15; window.playerState.shurikens += 15; window.playerState.ouro += 500; window.playerState.pontos += 3; window.atualizarUI(); let aviso = document.querySelector('#texto-central'); if(aviso) { aviso.setAttribute('value', '+15 Flechas\n+15 Shurikens\n+500 Ouro\n+3 Pontos!'); aviso.setAttribute('color', '#FFD700'); aviso.setAttribute('visible', 'true'); setTimeout(() => { if(aviso) aviso.setAttribute('visible', 'false'); }, 3000); } } }); } });
    </script>
</head>
<body>

    <div id="ui-layer">
        <div id="login-menu" class="menu-box">
            <form onsubmit="event.preventDefault();">
                <h2 style="color: #f1c40f;">MMO Login</h2>
                <input type="email" id="login-email" placeholder="Email" autocomplete="username">
                <input type="password" id="login-senha" placeholder="Senha" autocomplete="current-password">
                <button id="btn-login" class="btn btn-blue">Entrar</button>
                <button id="btn-registrar" class="btn btn-green">Criar Conta</button>
                <p id="login-error"></p>
            </form>
        </div>
        <div id="start-menu" class="menu-box">
            <h2 style="color: #2ecc71;">Logado!</h2>
            <button id="btn-pc" class="btn btn-orange">Jogar no PC (Mouse)</button>
            <button id="btn-vr" class="btn btn-blue">Jogar em VR</button>
            <button id="btn-android" class="btn btn-purple">📱 Jogar no Android (Touch)</button>
        </div>
    </div>

    <div id="mobile-ui">
        <div class="menu-top-right">
            <div class="hud-btn" id="btn-inv">🎒</div>
            <div class="hud-btn" id="btn-status">📈</div>
        </div>
        <div id="joystick-zone"><div id="joystick-stick"></div></div>
        <div id="action-buttons">
            <div class="hud-btn" id="btn-escudo">🛡️</div>
            <div class="hud-btn" id="btn-atacar">⚔️</div>
        </div>
    </div>

    <a-scene pc-controles vr-combat-system sistema-jogo gerenciador-inimigos gerenciador-npcs gerenciador-respawns renderer="colorManagement: true;">
        
        <a-entity id="mouse-cursor" cursor="rayOrigin: mouse" raycaster="objects: none"></a-entity>

        <a-assets timeout="3000">
            <a-asset-item id="modelo-espada-reta" src="Armas/Espadas/espada_reta.glb"></a-asset-item>
            <a-asset-item id="modelo-espada-grande" src="Armas/Espadas/espada_grande.glb"></a-asset-item>
            <a-asset-item id="modelo-arco" src="Armas/Arcos/arco.glb"></a-asset-item>
            <a-asset-item id="modelo-escudo" src="Armas/Escudos/escudo.glb"></a-asset-item>
            <a-asset-item id="modelo-inimigo" src="Inimigos/atiradora.glb"></a-asset-item>
            <a-asset-item id="modelo-inimigo2" src="Inimigos/atiradora.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.5" position="-1 2 1"></a-light>
        <a-entity environment="preset: forest; groundColor: #445; grid: none"></a-entity>

        <a-box class="interativo" sistema-bau position="-3 0.5 -3" rotation="0 45 0" color="#4CC3D9" shadow><a-text value="Loot" position="-0.3 0.6 0" color="#FFF" scale="0.8 0.8 0.8"></a-text></a-box>

        <a-entity id="rig" firebase-multiplayer movement-controls="speed: 0.15" mobile-movement position="0 0 0">
            
            <a-entity camera mobile-look position="0 1.6 0" look-controls="pointerLockEnabled: true;">
                
                <a-entity id="cursor-centro" cursor="fuse: false" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025" material="color: white; shader: flat; opacity: 0.8" raycaster="objects: .interativo; far: 20"></a-entity>
                
                <a-entity id="arma-visual-pc" position="0.3 -0.3 -0.6" rotation="-90 0 0" scale="0.7 0.7 0.7"></a-entity>
                <a-entity id="escudo-visual-pc" position="-0.4 -0.2 -0.5" rotation="180 0 0" scale="0.7 0.7 0.7"></a-entity>

                <a-plane id="dano-tela" position="0 0 -0.5" width="2" height="2" color="#ff0000" opacity="0.3" visible="false"></a-plane>
                <a-text id="texto-central" value="" position="0 -0.3 -1.5" color="#00FF00" visible="false" scale="0.5 0.5 0.5" align="center"></a-text>
                
                <a-entity id="hud-status" position="-0.4 0.8 -1.4" rotation="25 0 0">
                    <a-plane position="0.05 0 -0.01" width="1.1" height="0.25" color="#1a1a1a" opacity="0.85"></a-plane>
                    <a-text id="txt-nivel-hud" value="Nivel: 1 | XP: 0/50" position="-0.45 -0.05 0" color="#AAAAAA" scale="0.25 0.25 0.25" align="left"></a-text>
                    <a-entity position="-0.05 0 0">
                        <a-plane position="0.3 0.05 0" width="0.6" height="0.04" color="#333"></a-plane>
                        <a-entity id="hp-wrapper" position="0 0.05 0.01"><a-plane position="0.3 0 0" width="0.6" height="0.04" color="#c0392b"></a-plane></a-entity>
                        <a-plane position="0.3 -0.01 0" width="0.6" height="0.04" color="#333"></a-plane>
                        <a-entity id="mp-wrapper" position="0 -0.01 0.01"><a-plane position="0.3 0 0" width="0.6" height="0.04" color="#2980b9"></a-plane></a-entity>
                        <a-text id="txt-status-hud" value="HP: 100/100   |   MP: 100/100" position="0.3 -0.07 0" color="#FFF" scale="0.2 0.2 0.2" align="center"></a-text>
                        <a-text id="txt-arma-hud" value="Equipado: Nenhuma" position="-0.45 -0.15 0" color="#FFD700" scale="0.25 0.25 0.25" align="left"></a-text>
                    </a-entity>
                </a-entity>
                
                <a-text id="contador-online" value="Conectando Servidor..." position="0.6 0.8 -1.2" color="#00FF00" scale="0.4 0.4 0.4" align="right"></a-text>
            </a-entity> 
            
            <a-entity id="mao-esquerda" vr-hand-tracker laser-controls="hand: left" raycaster="objects: .interativo; far: 15" vr-controles-hud>
                <a-entity id="arma-visual-esq" position="0 0 0" rotation="180 0 0"></a-entity>
            </a-entity>
            
            <a-entity id="mao-direita" vr-hand-tracker laser-controls="hand: right" raycaster="objects: .interativo; far: 15" vr-controles-gatilho>
                <a-entity id="arma-visual-dir" position="0 0 0" rotation="-90 0 0"></a-entity>
            </a-entity>

        </a-entity>

        <a-entity id="caixa-dialogo" scale="0 0 0" position="0 1.5 -1.6" rotation="0 0 0">
            <a-plane color="#ecf0f1" width="2.2" height="1.6" position="0 0 0"></a-plane>
            <a-plane color="#bdc3c7" width="2.25" height="1.65" position="0 0 -0.01"></a-plane>
            
            <a-plane color="#2c3e50" width="2.2" height="0.25" position="0 0.675 0.01"></a-plane>
            <a-text id="npc-nome-ui" value="Nome do NPC" position="-1.0 0.675 0.02" color="#f1c40f" scale="0.5 0.5 0.5" baseline="center"></a-text>
            
            <a-box id="btn-npc-x" btn-dialogo-fechar class="interativo" color="#e74c3c" width="0.15" height="0.15" depth="0.02" position="1.0 0.675 0.02">
                <a-text value="X" align="center" position="0 0 0.02" color="#FFF" scale="0.4 0.4 0.4"></a-text>
            </a-box>

            <a-text id="npc-texto-ui" value="Texto..." position="-1.0 0.4 0.01" color="#2c3e50" scale="0.4 0.4 0.4" wrap-count="45" baseline="top"></a-text>
            <a-plane color="#bdc3c7" width="2.0" height="0.02" position="0 -0.1 0.01"></a-plane>

            <a-entity id="npc-recompensa-ui" visible="false" position="0 -0.2 0.01">
                <a-text value="Recompensas da Missao:" position="-1.0 0 0" color="#8e44ad" scale="0.35 0.35 0.35"></a-text>
                <a-text id="npc-rec-texto" value="" position="-1.0 -0.15 0" color="#27ae60" scale="0.4 0.4 0.4"></a-text>
            </a-entity>

            <a-box id="btn-npc-aceitar" btn-dialogo-aceitar class="interativo" color="#27ae60" width="0.8" height="0.2" depth="0.02" position="0 -0.55 0.02" visible="false">
                <a-text value="ACEITAR MISSAO" align="center" position="0 0 0.02" scale="0.4 0.4 0.4" color="#FFF"></a-text>
            </a-box>
        </a-entity>

        <a-entity id="menu-inventario-novo" scale="0 0 0" position="0 1.5 -1.6" rotation="0 0 0">
            <a-plane width="3.2" height="1.9" color="#e67e22" opacity="1.0" position="0 0 0"></a-plane>
            <a-plane width="3.1" height="1.8" color="#362319" opacity="1.0" position="0 0 0.01"></a-plane>
            <a-entity position="-1.2 0.2 0.02">
                <a-cylinder radius="0.2" height="0.02" rotation="90 0 0" position="0 0.45 0" color="#d35400" segments-radial="6"><a-text value="INV" position="-0.12 0 0.02" color="#FFF" scale="0.8 0.8 0.8" rotation="-90 0 0"></a-text></a-cylinder>
                <a-box class="interativo" width="0.8" height="0.2" depth="0.02" position="0 0.1 0" color="#f39c12"><a-text value="WEAPON" position="-0.3 -0.03 0.02" color="#5a2e0a" scale="0.6 0.6 0.6"></a-text></a-box>
                <a-box class="interativo" btn-escudo width="0.8" height="0.2" depth="0.02" position="0 -0.15 0" color="#a05e10"><a-text value="TOGGLE SHIELD (Q)" position="-0.42 -0.03 0.02" color="#dbbc9c" scale="0.45 0.45 0.45"></a-text></a-box>
                <a-box width="0.8" height="0.2" depth="0.02" position="0 -0.4 0" color="#a05e10"><a-text value="ARROWS:" position="-0.35 -0.03 0.02" color="#dbbc9c" scale="0.5 0.5 0.5"></a-text><a-text id="tt-flechas" value="10" position="0.15 -0.03 0.02" color="#FFF" scale="0.5 0.5 0.5"></a-text></a-box>
                <a-box width="0.8" height="0.2" depth="0.02" position="0 -0.65 0" color="#a05e10"><a-text value="SHURIKEN:" position="-0.35 -0.03 0.02" color="#dbbc9c" scale="0.5 0.5 0.5"></a-text><a-text id="tt-shurikens" value="5" position="0.15 -0.03 0.02" color="#FFF" scale="0.5 0.5 0.5"></a-text></a-box>
            </a-entity>
            <a-plane width="2.0" height="1.2" color="#f1c40f" position="0.35 0.15 0.02"></a-plane>
            <a-plane width="1.95" height="1.15" color="#5a371c" position="0.35 0.15 0.021"></a-plane>
            <a-entity id="inv-grid-container" position="0.35 0.15 0.022"></a-entity>
            <a-entity id="inv-tooltip" position="0.35 -0.6 0.03" visible="false">
                <a-plane width="1.8" height="0.25" color="#111" opacity="0.9"></a-plane>
                <a-text id="tt-nome" value="Nome do Item" position="-0.85 0.06 0.01" color="#FFD700" scale="0.4 0.4 0.4"></a-text>
                <a-text id="tt-forca" value="Forca: 0 (+0)" position="-0.85 -0.05 0.01" color="#FFF" scale="0.35 0.35 0.35"></a-text>
                <a-text id="tt-defesa" value="Defesa: 0 (+0)" position="-0.2 -0.05 0.01" color="#FFF" scale="0.35 0.35 0.35"></a-text>
                <a-text id="tt-acao" value="[C] Equipar Arma" position="0.35 -0.05 0.01" color="#00FF00" scale="0.3 0.3 0.3"></a-text>
            </a-entity>
            <a-entity position="0 -0.75 0.02">
                <a-text value="< 1/4 >" position="-1.3 -0.02 0" color="#FFF" scale="0.7 0.7 0.7"></a-text>
                <a-text value="ATK:" position="-0.5 -0.02 0" color="#e74c3c" scale="0.6 0.6 0.6"></a-text>
                <a-text id="inv-total-forca" value="10" position="-0.2 -0.02 0" color="#FFF" scale="0.6 0.6 0.6"></a-text>
                <a-text value="DEF:" position="0.1 -0.02 0" color="#3498db" scale="0.6 0.6 0.6"></a-text>
                <a-text id="inv-total-defesa" value="5" position="0.4 -0.02 0" color="#FFF" scale="0.6 0.6 0.6"></a-text>
                <a-circle radius="0.06" position="1.1 0 0" color="#f1c40f"></a-circle>
                <a-text id="inv-total-ouro" value="0" position="1.2 -0.02 0" color="#FFF" scale="0.6 0.6 0.6"></a-text>
            </a-entity>
        </a-entity>

        <a-entity id="menu-atributos" scale="0 0 0" position="0 1.5 -1.6" rotation="0 0 0">
            <a-plane width="2.6" height="1.8" color="#7f8c8d" opacity="1"></a-plane>
            <a-plane width="2.55" height="1.75" color="#2c3e50" position="0 0 0.01"></a-plane>
            <a-entity position="-0.85 0.1 0.02">
                <a-plane width="0.7" height="0.9" color="#34495e" position="0 0.3 0"></a-plane>
                <a-text value="Protagonista" position="-0.35 -0.2 0" scale="0.6 0.6 0.6"></a-text>
                <a-text id="attr-nivel-classe" value="Lv 1 Espadachim" position="-0.35 -0.35 0" scale="0.5 0.5 0.5" color="#bdc3c7"></a-text>
                <a-text id="attr-hp-txt" value="HP: 100/100" position="-0.35 -0.55 0" scale="0.4 0.4 0.4"></a-text>
                <a-plane width="0.7" height="0.04" color="#c0392b" position="0 -0.65 0" align="left"></a-plane>
                <a-text id="attr-mp-txt" value="MP: 100/100" position="-0.35 -0.75 0" scale="0.4 0.4 0.4"></a-text>
                <a-plane width="0.7" height="0.04" color="#2980b9" position="0 -0.85 0" align="left"></a-plane>
            </a-entity>
            <a-plane width="0.01" height="1.6" color="#7f8c8d" position="-0.4 0 0.02"></a-plane>
            <a-entity position="0.6 0.6 0.02">
                <a-text value="Arma Primaria" position="-0.6 0.25 0" align="center" scale="0.4 0.4 0.4" color="#e74c3c"></a-text>
                <a-box width="0.5" height="0.25" depth="0.01" position="-0.6 0 0" color="#34495e"><a-text id="attr-slot-1" value="Desarmado" position="0 0 0.02" align="center" scale="0.4 0.4 0.4"></a-text></a-box>
                <a-text value="Escudo / Sec." position="0.2 0.25 0" align="center" scale="0.4 0.4 0.4" color="#f1c40f"></a-text>
                <a-box width="0.5" height="0.25" depth="0.01" position="0.2 0 0" color="#34495e"><a-text id="attr-slot-2" value="Vazio" position="0 0 0.02" align="center" scale="0.4 0.4 0.4"></a-text></a-box>
            </a-entity>
            <a-plane width="1.8" height="0.01" color="#7f8c8d" position="0.6 0.35 0.02"></a-plane>
            <a-entity position="0.6 -0.2 0.02">
                <a-text value="HP Max" position="-0.8 0.4 0" scale="0.4 0.4 0.4" color="#bdc3c7"></a-text><a-text id="attr-hpmax" value="100" position="-0.1 0.4 0" scale="0.4 0.4 0.4" align="right"></a-text>
                <a-text value="MP Max" position="-0.8 0.25 0" scale="0.4 0.4 0.4" color="#bdc3c7"></a-text><a-text id="attr-mpmax" value="100" position="-0.1 0.25 0" scale="0.4 0.4 0.4" align="right"></a-text>
                <a-text value="Ataque (+)" position="-0.8 0.1 0" scale="0.4 0.4 0.4" color="#e74c3c"></a-text><a-text id="attr-atk" value="10" position="-0.1 0.1 0" scale="0.4 0.4 0.4" align="right"></a-text>
                <a-box class="interativo" btn-atributo="tipo: forca" position="-0.02 0.1 0" width="0.08" height="0.08" depth="0.01" color="#e74c3c"><a-text value="+" align="center" position="0 0 0.01" scale="0.4 0.4 0.4"></a-text></a-box>
                <a-text value="Agilidade (+)" position="-0.8 -0.05 0" scale="0.4 0.4 0.4" color="#f1c40f"></a-text><a-text id="attr-agi" value="5" position="-0.1 -0.05 0" scale="0.4 0.4 0.4" align="right"></a-text>
                <a-box class="interativo" btn-atributo="tipo: velocidade" position="-0.02 -0.05 0" width="0.08" height="0.08" depth="0.01" color="#f1c40f"><a-text value="+" align="center" position="0 0 0.01" scale="0.4 0.4 0.4"></a-text></a-box>
                <a-text value="Pts. Livres" position="-0.8 -0.25 0" scale="0.4 0.4 0.4" color="#2ecc71"></a-text><a-text id="attr-pts" value="0" position="-0.1 -0.25 0" scale="0.4 0.4 0.4" color="#2ecc71" align="right"></a-text>
                
                <a-text value="EXP Atual" position="0.1 0.4 0" scale="0.4 0.4 0.4" color="#bdc3c7"></a-text><a-text id="attr-exp" value="0" position="0.8 0.4 0" scale="0.4 0.4 0.4" align="right"></a-text>
                <a-text value="Prox. Nivel" position="0.1 0.25 0" scale="0.4 0.4 0.4" color="#bdc3c7"></a-text><a-text id="attr-nextexp" value="50" position="0.8 0.25 0" scale="0.4 0.4 0.4" align="right"></a-text>
                <a-text value="Defesa (+)" position="0.1 0.1 0" scale="0.4 0.4 0.4" color="#3498db"></a-text><a-text id="attr-def" value="5" position="0.8 0.1 0" scale="0.4 0.4 0.4" align="right"></a-text>
                <a-box class="interativo" btn-atributo="tipo: defesa" position="0.88 0.1 0" width="0.08" height="0.08" depth="0.01" color="#3498db"><a-text value="+" align="center" position="0 0 0.01" scale="0.4 0.4 0.4"></a-text></a-box>
                <a-text value="Sorte" position="0.1 -0.05 0" scale="0.4 0.4 0.4" color="#bdc3c7"></a-text><a-text value="10" position="0.8 -0.05 0" scale="0.4 0.4 0.4" align="right"></a-text>
                <a-text value="Esquiva" position="0.1 -0.25 0" scale="0.4 0.4 0.4" color="#bdc3c7"></a-text><a-text value="5%" position="0.8 -0.25 0" scale="0.4 0.4 0.4" align="right"></a-text>
            </a-entity>
            <a-plane width="0.6" height="0.15" color="#7f8c8d" position="-0.9 -0.8 0.02"><a-text value="Geral" align="center" scale="0.4 0.4 0.4" color="#fff" position="0 0 0.01"></a-text></a-plane>
            <a-plane width="0.6" height="0.15" color="#34495e" position="-0.25 -0.8 0.02"><a-text value="Adicional" align="center" scale="0.4 0.4 0.4" color="#bdc3c7" position="0 0 0.01"></a-text></a-plane>
            <a-plane width="0.6" height="0.15" color="#34495e" position="0.4 -0.8 0.02"><a-text value="Elementos" align="center" scale="0.4 0.4 0.4" color="#bdc3c7" position="0 0 0.01"></a-text></a-plane>
        </a-entity>
    </a-scene>
</body>
</html>
