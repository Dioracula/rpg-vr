<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

    <style>
        body { margin: 0; overflow: hidden; }
        #ui-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 15, 20, 0.95); z-index: 9999999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: sans-serif; pointer-events: all !important; } 
        .menu-box { background: #2c3e50; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 320px; pointer-events: auto; }

    <script>
        AFRAME.registerComponent('anti-piscar', {
            init: function() {
                this.el.addEventListener('model-loaded', () => {
                    const obj = this.el.getObject3D('mesh');
                    if (obj) { obj.traverse((node) => { if (node.isMesh) node.frustumCulled = false; }); }
                });
            }
        });

        const firebaseConfig = {
             apiKey: "AIzaSyCdsfW1ALz-8ktkYl_rACiY6tu0M2wqkH0",
             authDomain: "rpg-vr-online.firebaseapp.com",
             databaseURL: "https://rpg-vr-online-default-rtdb.firebaseio.com",
             projectId: "rpg-vr-online",
             storageBucket: "rpg-vr-online.firebasestorage.app",
             messagingSenderId: "676174796336",
             appId: "1:676174796336:web:7a91d19a758d29ef247ff5",
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();

        window.GAME_MODE = 'NONE'; window.GAME_STARTED = false; window.currentUser = null; window.lastActionTime = Date.now();
        
        window.playerState = {
            nivel: 1, xp: 0, xpProxNivel: 50, pontos: 0, ouro: 0, forca: 10, velocidade: 5, defesa: 5,
            hpAtual: 100, hpMax: 100, mpAtual: 100, mpMax: 100, vivo: true,
            armaEquipada: 'Desarmado', escudoEquipado: false, flechas: 10, shurikens: 5, chaves: {},

        // ==========================================
        // SISTEMA DE MORTE E RESPAWN BLINDADO!
        // ==========================================
        window.receberDanoJogador = function(danoBase) {
            if (!window.playerState.vivo || window.playerState.invulneravel) return;

            let armaStats = window.bancoDeArmas[window.playerState.armaEquipada] || {defesaBonus: 0}; 
            let defesaTotal = window.playerState.defesa + armaStats.defesaBonus + (window.playerState.escudoEquipado ? 5 : 0);
            let danoFinal = Math.max(1, danoBase - defesaTotal); 
            window.playerState.hpAtual -= danoFinal; 
            
            let danoTela = document.querySelector('#dano-tela'); 
            if(danoTela) { danoTela.setAttribute('visible', 'true'); setTimeout(() => danoTela.setAttribute('visible', 'false'), 200); } 
            atualizarUI(); 
            
            if (window.playerState.hpAtual <= 0) { 
                window.playerState.vivo = false; 
                window.playerState.hpAtual = 0; 
                atualizarUI(); 

                let aviso = document.querySelector('#texto-central'); 
                if(aviso) { 
                    aviso.setAttribute('color', '#ff0000'); 
                    aviso.setAttribute('visible', 'true'); 
                    let tempoRespawn = 5; 
                    aviso.setAttribute('value', `VOCE MORREU!\nRespawn em ${tempoRespawn}...`);
                    
                    let respawnInterval = setInterval(() => {
                        tempoRespawn--;
                        if (tempoRespawn > 0) { 
                            aviso.setAttribute('value', `VOCE MORREU!\nRespawn em ${tempoRespawn}...`); 
                        } else {
                            clearInterval(respawnInterval); 
                            window.playerState.vivo = true; 
                            window.playerState.hpAtual = window.playerState.hpMax;
                            window.playerState.invulneravel = true; // Nasce imortal por 3 segundos

                            // TELEPORTE BLINDADO
                            let rig = document.querySelector('#rig'); 
                            if (rig) { 
                                // Desliga o andar, move o corpo em 3D, liga o andar de volta!
                                rig.removeAttribute('movement-controls');
                                rig.object3D.position.set(0, 0, 0); 
                                setTimeout(() => {
                                    rig.setAttribute('movement-controls', 'speed', 0.1 + (window.playerState.velocidade * 0.01));
                                }, 50);
                            }

                            atualizarUI(); 
                            aviso.setAttribute('visible', 'false'); 
                            aviso.setAttribute('value', ''); 
                            window.tocarSom('snd-magic'); 

                            // Tira a imortalidade depois de 3 seg
                            setTimeout(() => { window.playerState.invulneravel = false; }, 3000);
                        }
                    }, 1000);
                } 
            }
        };

        window.dialogoTimeout = null;
        window.mostrarDialogo = function(nome, texto) {
            let cx = document.querySelector('#caixa-dialogo'); let tNome = document.querySelector('#npc-nome-ui'); let tTexto = document.querySelector('#npc-texto-ui');
            if(cx && tNome && tTexto) {
                tNome.setAttribute('value', nome); tTexto.setAttribute('value', texto); cx.setAttribute('visible', 'true');
                if(window.dialogoTimeout) clearTimeout(window.dialogoTimeout);
                window.dialogoTimeout = setTimeout(() => { cx.setAttribute('visible', 'false'); }, 8000);
            }
        };

        AFRAME.registerComponent('firebase-multiplayer', {
            init: function() {
                this.db = realtimeDB; this.playersRef = this.db.ref('players'); 
                this.myId = 'player_' + Math.random().toString(36).substr(2, 9); 
                this.myRef = this.db.ref('players/' + this.myId); this.myRef.onDisconnect().remove();
                this.otherPlayers = {}; this.cena = document.querySelector('a-scene'); this.lastPosRot = "";

                this.playersRef.on('child_added', (snapshot) => {
                    let id = snapshot.key; if (id === this.myId) return; 
                    let data = snapshot.val(); let avatar = document.createElement('a-entity');
                    avatar.setAttribute('position', data.position || {x:0, y:0, z:0}); avatar.setAttribute('rotation', data.rotation || {x:0, y:0, z:0});
                    avatar.dataset.vivo = data.vivo !== false ? "true" : "false"; avatar.setAttribute('visible', data.vivo !== false ? 'true' : 'false');
                    avatar.innerHTML = `<a-box scale="0.3 0.3 0.3" color="#f1c40f" position="0 0.5 0"><a-box color="#222" scale="0.1 0.1 0.05" position="-0.3 0.2 -0.51"></a-box><a-box color="#222" scale="0.1 0.1 0.05" position="0.3 0.2 -0.51"></a-box></a-box><a-cylinder radius="0.25" height="0.6" color="#2980b9" position="0 0.0 0"></a-cylinder><a-text value="Aliado" align="center" position="0 0.9 0" color="white" scale="0.6 0.6 0.6" side="double"></a-text>`;
                    this.cena.appendChild(avatar); this.otherPlayers[id] = avatar;
                });

                this.playersRef.on('child_changed', (snapshot) => {
                    let id = snapshot.key; if (id === this.myId) return;
                    let avatar = this.otherPlayers[id]; let data = snapshot.val();
                    if (avatar && data) { 
                        avatar.dataset.vivo = data.vivo !== false ? "true" : "false"; avatar.setAttribute('visible', data.vivo !== false ? 'true' : 'false');
                        avatar.setAttribute('animation__pos', `property: position; to: ${data.position.x} ${data.position.y} ${data.position.z}; dur: 100; easing: linear`); 
                        avatar.setAttribute('animation__rot', `property: rotation; to: ${data.rotation.x} ${data.rotation.y} ${data.rotation.z}; dur: 100; easing: linear`); 
                    }
                });

                this.playersRef.on('child_removed', (snapshot) => { let id = snapshot.key; let avatar = this.otherPlayers[id]; if (avatar) { avatar.parentNode.removeChild(avatar); delete this.otherPlayers[id]; } });
                this.playersRef.on('value', (snapshot) => { let total = snapshot.numChildren(); let contadorHUD = document.querySelector('#contador-online'); if(contadorHUD) contadorHUD.setAttribute('value', 'Online: ' + total); });
                
                this.lastSyncTime = 0; this.cameraObj = document.querySelector('[camera]');
            },
            tick: function(time) {
                if (!window.GAME_STARTED || !window.playerState.vivo) return; // Se tiver morto, não transmite
                if (time - this.lastSyncTime > 100) { 
                    this.lastSyncTime = time; let pos = this.el.object3D.position; 
                    let euler = new THREE.Euler(0, 0, 0, 'YXZ'); euler.setFromQuaternion(this.cameraObj.object3D.quaternion); let rotY = euler.y * 180 / Math.PI;
                    let currentPosRot = pos.x.toFixed(2) + pos.y.toFixed(2) + pos.z.toFixed(2) + rotY.toFixed(2);
                    if (this.lastPosRot !== currentPosRot) { window.lastActionTime = Date.now(); this.lastPosRot = currentPosRot; }
                    this.myRef.set({ position: { x: Number(pos.x.toFixed(3)), y: Number(pos.y.toFixed(3)), z: Number(pos.z.toFixed(3)) }, rotation: { x: 0, y: Number(rotY.toFixed(3)), z: 0 }, vivo: window.playerState.vivo }); 
                }
            }
        });

        window.tocarSom = function(idSom, volume = 0.5) { let audio = document.getElementById(idSom); if(audio) { audio.volume = volume; audio.currentTime = 0; audio.play().catch(e => {}); } };

        document.addEventListener('DOMContentLoaded', () => { 
            document.body.classList.add('menu-aberto');
            ['mousedown', 'keydown', 'touchstart'].forEach(e => window.addEventListener(e, () => window.lastActionTime = Date.now()));
            document.getElementById('btn-registrar').addEventListener('click', () => { window.currentUser = { uid: 'test_user_local' }; iniciarTelaSelecaoModo(); }); 
            document.getElementById('btn-login').addEventListener('click', () => { window.currentUser = { uid: 'test_user_local' }; iniciarTelaSelecaoModo(); }); 
            document.getElementById('btn-pc').addEventListener('click', () => { iniciarJogo('PC'); }); 
            document.getElementById('btn-vr').addEventListener('click', () => { iniciarJogo('VR'); }); 
            
            window.addEventListener('click', () => { 
                if (window.GAME_MODE === 'PC' && window.GAME_STARTED) { let canvas = document.querySelector('.a-canvas'); if (canvas && document.pointerLockElement !== canvas) canvas.requestPointerLock(); } 
            }); 

            setInterval(() => {
                if (window.GAME_STARTED && window.playerState.vivo) {
                    if (Date.now() - window.lastActionTime > 900000) { 
                        window.GAME_STARTED = false; let mpComp = document.querySelector('[firebase-multiplayer]'); if(mpComp && mpComp.components['firebase-multiplayer'] && mpComp.components['firebase-multiplayer'].myRef) mpComp.components['firebase-multiplayer'].myRef.remove();
                        let aviso = document.querySelector('#texto-central'); if(aviso) { aviso.setAttribute('value', 'DESCONECTADO:\n15 MIN INATIVO (AFK)'); aviso.setAttribute('color', '#ff0000'); aviso.setAttribute('visible', 'true'); }
                        setTimeout(() => location.reload(), 4000);
                    }
                }
            }, 5000);

            realtimeDB.ref('server_commands/kick_all').on('value', snap => {
                if(snap.val() && window.GAME_STARTED) {
                    window.GAME_STARTED = false; let aviso = document.querySelector('#texto-central'); if(aviso) { aviso.setAttribute('value', 'KICKADO PELO ADMIN!'); aviso.setAttribute('color', '#ff0000'); aviso.setAttribute('visible', 'true'); }
                    setTimeout(() => location.reload(), 3000);
                }
            });
        });
        
        function iniciarTelaSelecaoModo() { document.getElementById('login-menu').style.display = 'none'; document.getElementById('start-menu').style.display = 'block'; }
        
        function iniciarJogo(modo) { 
            window.GAME_MODE = modo; window.GAME_STARTED = true; 
            document.getElementById('ui-layer').style.display = 'none'; 
            document.body.classList.remove('menu-aberto');
            
            if (modo === 'PC') { 
                document.querySelector('#mao-esquerda').setAttribute('visible', 'false'); document.querySelector('#mao-esquerda').setAttribute('raycaster', 'far', 0); document.querySelector('#mao-direita').setAttribute('visible', 'false'); document.querySelector('#mao-direita').setAttribute('raycaster', 'far', 0); setTimeout(() => { let canvas = document.querySelector('.a-canvas'); if(canvas) canvas.requestPointerLock(); }, 100); 
            } else { 
                document.querySelector('[cursor]').setAttribute('visible', 'false'); document.querySelector('[cursor]').setAttribute('raycaster', 'far', 0); document.querySelector('#arma-visual-pc').setAttribute('visible', 'false'); document.querySelector('#escudo-visual-pc').setAttribute('visible', 'false'); document.querySelector('a-scene').enterVR(); 
            } 
            atualizarUI(); 
        }
        
        window.salvarJogoNuvem = function() { if (!window.currentUser || window.currentUser.uid === 'test_user_local') return; firestoreDB.collection("jogadores").doc(window.currentUser.uid).set(window.playerState).then(() => console.log("Salvo na nuvem!")).catch(e => console.error(e)); };

        // ==========================================
        // 3. BANCOS E FÍSICA
        // ==========================================
        window.ANIM_PARADO = 'chr784_armature|chr784_bn01'; 
        window.ANIM_ANDANDO = 'chr784_armature|chr784_br01';
        window.ANIM_ATIRANDO = 'chr784_armature|chr784_ba01'; 
        window.ANIM_DANO = 'chr784_armature|chr784_bd01'; 
        window.ANIM_MORTE = 'chr784_armature|chr784_bd02'; 
        
        window.CONFIG_ARCO = { rotX: 180, rotY: 90, rotZ: 90 }; window.CONFIG_ESCUDO = { modeloGlb: '#modelo-escudo', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0' };

        window.bancoDeArmas = {
            'Desarmado': { categoria: 'Luva', danoBonus: 0, defesaBonus: 0, durabilidadeMax: Infinity, modeloGlb: '', visualDir: '', visualEsq: '' },
            'Espada Reta': { categoria: 'Espada', danoBonus: 5, defesaBonus: 1, durabilidadeMax: 100, modeloGlb: '#modelo-espada-reta', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.15 0.15 0.15', rotInv: '45 45 0', posInv: '0 0 0.05', visualDir: `<a-cylinder color="#8B4513" radius="0.02" height="0.15" position="0 0 0"></a-cylinder><a-box color="#DAA520" width="0.15" height="0.05" depth="0.05" position="0 0.075 0"></a-box><a-cylinder color="#aaa" radius="0.02" height="0.8" position="0 0.5 0"></a-cylinder>`, visualEsq: '' },
            'Varinha': { categoria: 'Varinha', danoBonus: 10, defesaBonus: 0, durabilidadeMax: 40, modeloGlb: '', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.1 0.1 0.1', rotInv: '0 0 0', posInv: '0 0 0.05', visualDir: `<a-cylinder color="#5C4033" radius="0.015" height="0.4" position="0 0.2 0"></a-cylinder><a-sphere color="#00FFFF" radius="0.04" position="0 0.4 0" material="emissive: #00FFFF; emissiveIntensity: 0.8"></a-sphere>`, visualEsq: '' },
            'Arco': { categoria: 'Arco', danoBonus: 12, defesaBonus: 0, durabilidadeMax: 60, modeloGlb: '#modelo-arco', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.1 0.1 0.1', rotInv: '45 45 0', posInv: '0 0 0.05', visualDir: '', visualEsq: 'ARCO_ESPECIAL' },
        };

        function atualizarUI() { let elsHtml = ['#txt-nivel-hud', '#txt-status-hud', '#hp-wrapper', '#mp-wrapper', '#txt-arma-hud', '#rig', '#attr-nivel-classe', '#attr-hp-txt', '#attr-mp-txt', '#attr-hpmax', '#attr-mpmax', '#attr-atk', '#attr-def', '#attr-agi', '#attr-exp', '#attr-nextexp', '#attr-pts', '#inv-total-forca', '#inv-total-defesa', '#inv-total-ouro', '#tt-flechas', '#tt-shurikens', '#attr-slot-1', '#attr-slot-2']; for(let i=0; i<elsHtml.length; i++) { if(!document.querySelector(elsHtml[i])) return; } document.querySelector('#txt-nivel-hud').setAttribute('value', 'Nivel: ' + window.playerState.nivel + ' | XP: ' + window.playerState.xp + '/' + window.playerState.xpProxNivel); document.querySelector('#txt-status-hud').setAttribute('value', 'HP: ' + window.playerState.hpAtual + '/' + window.playerState.hpMax + '   |   MP: ' + window.playerState.mpAtual + '/' + window.playerState.mpMax); let hpScale = Math.max(0, window.playerState.hpAtual / window.playerState.hpMax); document.querySelector('#hp-wrapper').setAttribute('scale', hpScale + ' 1 1'); let mpScale = Math.max(0, window.playerState.mpAtual / window.playerState.mpMax); document.querySelector('#mp-wrapper').setAttribute('scale', mpScale + ' 1 1'); document.querySelector('#txt-arma-hud').setAttribute('value', 'Equipado: ' + window.playerState.armaEquipada + (window.playerState.escudoEquipado ? ' + Escudo' : '')); document.querySelector('#rig').setAttribute('movement-controls', 'speed', 0.1 + (window.playerState.velocidade * 0.01)); let armaStats = window.bancoDeArmas[window.playerState.armaEquipada]; let forcaTotal = window.playerState.forca + (armaStats ? armaStats.danoBonus : 0); let defesaTotal = window.playerState.defesa + (armaStats ? armaStats.defesaBonus : 0) + (window.playerState.escudoEquipado ? 5 : 0); let els = { '#attr-nivel-classe': 'Lv ' + window.playerState.nivel + ' Aventureiro', '#attr-hp-txt': 'HP: ' + window.playerState.hpAtual + '/' + window.playerState.hpMax, '#attr-mp-txt': 'MP: ' + window.playerState.mpAtual + '/' + window.playerState.mpMax, '#attr-hpmax': window.playerState.hpMax, '#attr-mpmax': window.playerState.mpMax, '#attr-atk': forcaTotal, '#attr-def': defesaTotal, '#attr-agi': window.playerState.velocidade, '#attr-exp': window.playerState.xp, '#attr-nextexp': window.playerState.xpProxNivel, '#attr-pts': window.playerState.pontos, '#inv-total-forca': forcaTotal, '#inv-total-defesa': defesaTotal, '#inv-total-ouro': window.playerState.ouro, '#tt-flechas': window.playerState.flechas, '#tt-shurikens': window.playerState.shurikens, '#attr-slot-1': window.playerState.armaEquipada }; for(let id in els) { let e = document.querySelector(id); if(e) e.setAttribute('value', els[id]); } let elSlot2 = document.querySelector('#attr-slot-2'); if(elSlot2) { if(window.playerState.escudoEquipado) elSlot2.setAttribute('value', 'Escudo'); else if(armaStats && armaStats.categoria === 'Arco') elSlot2.setAttribute('value', '2 Maos (Arco)'); else if(armaStats && armaStats.visualEsq !== '') elSlot2.setAttribute('value', window.playerState.armaEquipada); else elSlot2.setAttribute('value', 'Vazio'); } atualizarArmaVisual(); window.salvarJogoNuvem(); }
        function atualizarArmaVisual() { let containerDir = document.querySelector('#arma-visual-dir'); let containerEsq = document.querySelector('#arma-visual-esq'); let containerPC = document.querySelector('#arma-visual-pc'); let escudoPC = document.querySelector('#escudo-visual-pc'); if(!containerDir || !containerEsq) return; containerDir.innerHTML = ''; containerEsq.innerHTML = ''; if(containerPC) containerPC.innerHTML = ''; if(escudoPC) escudoPC.innerHTML = ''; let armaStats = window.bancoDeArmas[window.playerState.armaEquipada]; if (!armaStats) return; if (armaStats.modeloGlb && armaStats.modeloGlb !== '') containerDir.innerHTML = `<a-entity gltf-model="${armaStats.modeloGlb}" scale="${armaStats.escalaMao}" rotation="${armaStats.rotMao}" position="${armaStats.posMao}" anti-piscar></a-entity>`; else if (armaStats.visualDir) containerDir.innerHTML = armaStats.visualDir; if (armaStats.visualEsq && armaStats.visualEsq !== 'ARCO_ESPECIAL') { if(armaStats.modeloGlb && armaStats.modeloGlb !== '') containerEsq.innerHTML = `<a-entity gltf-model="${armaStats.modeloGlb}" scale="${armaStats.escalaMao}" rotation="${armaStats.rotMao}" position="${armaStats.posMao}" anti-piscar></a-entity>`; else containerEsq.innerHTML = armaStats.visualEsq; } if (armaStats.categoria === 'Arco') { if(armaStats.modeloGlb && armaStats.modeloGlb !== '') containerEsq.innerHTML = `<a-entity gltf-model="${armaStats.modeloGlb}" scale="${armaStats.escalaMao}" rotation="${armaStats.rotMao}" position="${armaStats.posMao}" anti-piscar></a-entity>`; else { let rot = window.CONFIG_ARCO; containerEsq.innerHTML = `<a-entity rotation="${rot.rotX} ${rot.rotY} ${rot.rotZ}"><a-torus color="#8B4513" radius="0.3" radius-tubular="0.015" arc="180" rotation="0 0 90"></a-torus><a-cylinder color="#DDDDDD" radius="0.002" height="0.6" rotation="0 0 0"></a-cylinder></a-entity>`; } } if (window.playerState.escudoEquipado && armaStats.categoria !== 'Arco') { if(window.CONFIG_ESCUDO.modeloGlb && window.CONFIG_ESCUDO.modeloGlb !== '') containerEsq.innerHTML += `<a-entity gltf-model="${window.CONFIG_ESCUDO.modeloGlb}" scale="${window.CONFIG_ESCUDO.escalaMao}" rotation="${window.CONFIG_ESCUDO.rotMao}" position="${window.CONFIG_ESCUDO.posMao}" anti-piscar></a-entity>`; else containerEsq.innerHTML += `<a-box color="#4169E1" width="0.4" height="0.5" depth="0.05" position="0 0.1 0" rotation="-90 0 0"><a-box color="#C0C0C0" width="0.42" height="0.52" depth="0.02" position="0 0 -0.01"></a-box></a-box>`; } if(containerPC) containerPC.innerHTML = containerDir.innerHTML; if(escudoPC) escudoPC.innerHTML = containerEsq.innerHTML; }

        AFRAME.registerComponent('pc-controles', {
            init: function() {
                let menuAtrib = document.querySelector('#menu-atributos'); let menuInv = document.querySelector('#menu-inventario-novo'); let atribAberto = false; let invAberto = false; let podeAtacarPC = true;
                window.addEventListener('contextmenu', e => e.preventDefault());
                window.addEventListener('keydown', (e) => { if (!window.GAME_STARTED) return; if (e.key.toLowerCase() === 'i') { invAberto = !invAberto; menuInv.setAttribute('scale', invAberto ? '0.65 0.65 0.65' : '0 0 0'); if (invAberto) atualizarUI(); } if (e.key.toLowerCase() === 'c') { atribAberto = !atribAberto; menuAtrib.setAttribute('scale', atribAberto ? '0.7 0.7 0.7' : '0 0 0'); if (atribAberto) atualizarUI(); } if (e.key.toLowerCase() === 'q' && window.GAME_MODE === 'PC') { window.playerState.escudoEquipado = !window.playerState.escudoEquipado; atualizarUI(); let msg = window.playerState.escudoEquipado ? 'Escudo Equipado (Q)!' : 'Escudo Guardado!'; let aviso = document.querySelector('#texto-central'); aviso.setAttribute('value', msg); aviso.setAttribute('color', window.playerState.escudoEquipado ? '#4169E1' : '#FF4500'); aviso.setAttribute('visible', 'true'); setTimeout(() => aviso.setAttribute('visible', 'false'), 1500); } });

                    let tomouDano = (this.hpAtual > 0 && data.hp > 0 && data.hp < this.hpAtual); 
                    let reviveu = (estavaMorto && data.hp > 0);
                    
                    this.hpAtual = data.hp;

                    } else if (tomouDano) {
                        if(textoHp) textoHp.setAttribute('value', 'HP: ' + this.hpAtual); 
                        let v = this.el.querySelector('.modelo-visual') || this.el.querySelector('.inimigo-fallback'); let obj3D = v ? v.getObject3D('mesh') : null;
                        if (obj3D) obj3D.traverse((n) => { if (n.isMesh && n.material && n.material.emissive) { let corOr = n.material.emissive.getHex(); n.material.emissive.setHex(0xaa0000); setTimeout(() => { if(n.material) n.material.emissive.setHex(corOr); }, 150); } });

                            this.tocarAnimacao(window.ANIM_DANO, 'once'); 
                            setTimeout(() => { if (this.hpAtual > 0 && !this.isAttacking) this.tocarAnimacao(this.isMoving ? window.ANIM_ANDANDO : window.ANIM_PARADO, 'repeat'); }, 600);
                        }
                    } else if (!estavaMorto && data.hp > 0) { if(textoHp) textoHp.setAttribute('value', 'HP: ' + this.hpAtual); }
                });

                this.receberDano = (dano, tipoCategoria = '') => {

                            }

            },

            tick: function(time, timeDelta) {

                if (dist > 0.05) {

                this.el.object3D.quaternion.slerp(qTarget, 0.2);
            }

        AFRAME.registerComponent('slot-interativo', { schema: { item: {type: 'string'} }, init: function() { let painelTooltip = document.querySelector('#inv-tooltip'); let txtNome = document.querySelector('#tt-nome'); let txtForca = document.querySelector('#tt-forca'); let txtDefesa = document.querySelector('#tt-defesa'); let boxEquipar = document.querySelector('#tt-acao'); this.el.addEventListener('mouseenter', () => { this.el.children[0].setAttribute('color', '#FFD700'); let itemAlvo = window.bancoDeArmas[this.data.item]; let itemEquipado = window.bancoDeArmas[window.playerState.armaEquipada]; if(!itemAlvo) return; let diffForca = itemAlvo.danoBonus - itemEquipado.danoBonus; let diffDefesa = itemAlvo.defesaBonus - itemEquipado.defesaBonus; painelTooltip.setAttribute('visible', 'true'); txtNome.setAttribute('value', this.data.item); txtForca.setAttribute('value', `Dano Item: ${itemAlvo.danoBonus}${diffForca !== 0 ? (diffForca>0?` (+${diffForca})`:` (${diffForca})`) : ''}`); txtForca.setAttribute('color', diffForca>0?'#00FF00':(diffForca<0?'#FF4444':'#FFF')); txtDefesa.setAttribute('value', `Defesa Item: ${itemAlvo.defesaBonus}${diffDefesa !== 0 ? (diffDefesa>0?` (+${diffDefesa})`:` (${diffDefesa})`) : ''}`); txtDefesa.setAttribute('color', diffDefesa>0?'#00FF00':(diffDefesa<0?'#FF4444':'#FFF')); boxEquipar.setAttribute('value', window.playerState.armaEquipada === this.data.item ? 'EQUIPADO' : '[Gatilho/PC] Equipar'); boxEquipar.setAttribute('color', window.playerState.armaEquipada === this.data.item ? '#FFD700' : '#FFF'); }); this.el.addEventListener('mouseleave', () => { this.el.children[0].setAttribute('color', '#f19e20'); painelTooltip.setAttribute('visible', 'false'); }); this.el.addEventListener('click', () => { window.playerState.armaEquipada = this.data.item; atualizarUI(); let aviso = document.querySelector('#texto-central'); aviso.setAttribute('value', this.data.item + ' Equipado!'); aviso.setAttribute('color', '#00FF00'); aviso.setAttribute('visible', 'true'); setTimeout(() => aviso.setAttribute('visible', 'false'), 1000); }); } });
        AFRAME.registerComponent('sistema-jogo', { init: function () { setInterval(() => { if (!window.GAME_STARTED) return; if (window.playerState.vivo && window.playerState.mpAtual < window.playerState.mpMax) { window.playerState.mpAtual = Math.min(window.playerState.mpMax, window.playerState.mpAtual + 5); atualizarUI(); } }, 1000); } });
        AFRAME.registerComponent('controles-hud', { init: function () { let menuAtrib = document.querySelector('#menu-atributos'); let menuInv = document.querySelector('#menu-inventario-novo'); let atribAberto = false; let invAberto = false; this.el.addEventListener('ybuttondown', function () { atribAberto = !atribAberto; menuAtrib.setAttribute('scale', atribAberto ? '0.7 0.7 0.7' : '0 0 0'); if (atribAberto) atualizarUI(); }); this.el.addEventListener('xbuttondown', function () { invAberto = !invAberto; menuInv.setAttribute('scale', invAberto ? '0.65 0.65 0.65' : '0 0 0'); if (invAberto) atualizarUI(); }); } });
