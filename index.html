    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none;}
        #ui-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 15, 20, 0.95); z-index: 9999999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: sans-serif; pointer-events: all !important; transition: background 0.5s;} 
        
        #sys-ui-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); z-index: 9999999; display: none; justify-content: center; align-items: center; pointer-events: all; backdrop-filter: blur(5px); font-family: sans-serif;}

        .menu-box { background: #181d23; padding: 40px; border-radius: 10px; border: 2px solid #3a4454; box-shadow: 0 10px 25px rgba(0,0,0,0.8); text-align: center; width: 320px; pointer-events: auto; } 
        .menu-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #3a4454; background: #11151a; color: white; box-sizing: border-box; font-size: 1rem;} 
        .btn { padding: 12px 20px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; margin: 5px 0; width: 100%; color: white; transition: 0.2s;} 
        .btn:hover { transform: scale(1.02); }
        .btn:active { transform: scale(0.98); opacity: 0.8; }
        .btn-green { background: #27ae60; } .btn-blue { background: #2980b9; } .btn-orange { background: #d35400; } 
        .btn-purple { background: #8e44ad; } .btn-red { background: #e74c3c; } .btn-dark { background: #34495e; }
        
        #start-menu { display: none; }
        #login-error { color: #e74c3c; font-size: 0.9rem; margin-top: 10px; display: none; font-weight: bold; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px;}
        body.menu-aberto .a-canvas { pointer-events: none !important; }
        #crosshair { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; background: rgba(255,255,255,0.8); border-radius: 50%; z-index: 1000; pointer-events: none;}

        #mobile-ui { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10000; pointer-events: none; display: none;}
        #pc-ui { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10000; pointer-events: none; display: none;}
        
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px; background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; border: 2px solid rgba(255,255,255,0.3); touch-action: none;}
        #joystick-stick { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(241, 196, 15, 0.8); border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; transition: transform 0.05s ease-out;}
        #action-buttons { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; align-items: flex-end;}
        
        .hud-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(24, 29, 35, 0.8); border: 2px solid #3a4454; color: white; font-size: 1.5rem; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-weight: bold; touch-action: none; user-select: none; pointer-events: auto;}
        .hud-btn:active { background: #f1c40f; color: #111; transform: scale(0.95); }
        .hud-btn-sys { background: #d35400; border-color: #e67e22; width: 50px; height: 50px; font-size: 1.2rem; cursor: pointer; pointer-events: auto; position: absolute; top: 20px; right: 20px;}
        
        #btn-atacar { width: 80px; height: 80px; background: rgba(192, 57, 43, 0.8); border-color: #e74c3c; font-size: 2rem; margin-top: 10px;}
        .menu-top-right { position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; pointer-events: auto; align-items: center;}
    </style>

        };

        window.ANIM_PARADO = 'chr784_armature|chr784_bn01'; 
        window.ANIM_ANDANDO = 'chr784_armature|chr784_br01'; 
        window.ANIM_ATIRANDO = 'chr784_armature|chr784_ba01'; 
        window.ANIM_DANO = 'chr784_armature|chr784_bd01'; 
        window.ANIM_MORTE = 'chr784_armature|chr784_bd02'; 

        window.bancoDeArmas = {
            'Desarmado': { categoria: 'Luva', danoBonus: 0, defesaBonus: 0, distancia: 2.0, modeloGlb: '', visualDir: '', visualEsq: '' },
            'Espada Reta': { categoria: 'Espada', danoBonus: 5, defesaBonus: 1, distancia: 3.0, modeloGlb: '#modelo-espada-reta', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.15 0.15 0.15', rotInv: '45 45 0', posInv: '0 0 0.05', swingRotacao: '0 0 0', swingAdditive: false, hitAdditive: false, visualDir: '<a-cylinder color="#8B4513" radius="0.02" height="0.15" position="0 0 0"></a-cylinder><a-box color="#DAA520" width="0.15" height="0.05" depth="0.05" position="0 0.075 0"></a-box><a-cylinder color="#aaa" radius="0.02" height="0.8" position="0 0.5 0"></a-cylinder>', visualEsq: '' },
            'Espada Curva': { categoria: 'Espada', danoBonus: 7, defesaBonus: 0, distancia: 3.0, modeloGlb: '', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.1 0.1 0.1', rotInv: '0 0 0', posInv: '0 0 0.05', swingRotacao: '0 0 0', swingAdditive: false, hitAdditive: false, visualDir: '<a-cylinder color="#444" radius="0.02" height="0.15" position="0 0 0"></a-cylinder><a-cylinder color="#C0C0C0" radius="0.02" height="0.8" position="0.08 0.5 0" rotation="0 0 15"></a-cylinder>', visualEsq: '' },
            'Espada Grande': { categoria: 'Espada', danoBonus: 15, defesaBonus: -2, distancia: 4.0, modeloGlb: '#modelo-espada-grande', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.1 0.1 0.1', rotInv: '45 45 0', posInv: '0 0 0.05', swingRotacao: '0 0 0', swingAdditive: false, hitAdditive: false, visualDir: '<a-cylinder color="#333" radius="0.03" height="0.2" position="0 0 0"></a-cylinder><a-box color="#555" width="0.3" height="0.06" depth="0.06" position="0 0.1 0"></a-box><a-box color="#999" width="0.1" height="1.2" depth="0.02" position="0 0.7 0"></a-box>', visualEsq: '' },
            'Luva de Boxe': { categoria: 'Luva', danoBonus: 3, defesaBonus: 2, distancia: 2.0, modeloGlb: '', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.1 0.1 0.1', rotInv: '0 0 0', posInv: '0 0 0.05', swingRotacao: '0 0 0', swingAdditive: false, hitAdditive: false, visualDir: '<a-sphere color="#cc0000" radius="0.15" position="0 0.1 0"></a-sphere>', visualEsq: '<a-sphere color="#cc0000" radius="0.15" position="0 0.1 0"></a-sphere>' },
            'Varinha': { 
                categoria: 'Varinha', danoBonus: 10, defesaBonus: 0, distancia: 15.0, 
                modeloGlb: '', 
                escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', 
                escalaInv: '0.1 0.1 0.1', rotInv: '0 0 0', posInv: '0 0 0.05', swingRotacao: '0 0 0', swingAdditive: false, hitAdditive: false,
                visualDir: `
                    <a-cylinder color="#5C4033" radius="0.015" height="0.4" position="0 0.2 0"></a-cylinder>
                    <a-sphere id="wand-tip-vis" color="#00FFFF" radius="0.04" position="0 0.4 0" material="emissive: #00FFFF; emissiveIntensity: 0.8"></a-sphere>
                `, 
                visualEsq: '' 
            },
            'Shuriken': { categoria: 'Shuriken', danoBonus: 5, defesaBonus: 0, distancia: 10.0, modeloGlb: '', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.1 0.1 0.1', rotInv: '0 0 0', posInv: '0 0 0.05', swingRotacao: '0 0 0', swingAdditive: false, hitAdditive: false, visualDir: '<a-box color="#555" width="0.15" height="0.01" depth="0.15" position="0 0.05 0" rotation="0 0 0"></a-box><a-box color="#555" width="0.15" height="0.01" depth="0.15" position="0 0.05 0" rotation="0 45 0"></a-box>', visualEsq: '' },
            'Escudo de Madeira': { categoria: 'Escudo', danoBonus: 0, defesaBonus: 3, distancia: 0, modeloGlb: '', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.1 0.1 0.1', rotInv: '0 0 0', posInv: '0 0 0.05', swingRotacao: '0 0 0', swingAdditive: false, hitAdditive: false, visualDir: '', visualEsq: '<a-box color="#8B4513" width="0.4" height="0.5" depth="0.05" position="0 0.1 0" rotation="-90 0 0"></a-box>' },
            'Escudo de Ferro': { categoria: 'Escudo', danoBonus: 0, defesaBonus: 6, distancia: 0, modeloGlb: '', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.1 0.1 0.1', rotInv: '0 0 0', posInv: '0 0 0.05', swingRotacao: '0 0 0', swingAdditive: false, hitAdditive: false, visualDir: '', visualEsq: '<a-box color="#7F8C8D" width="0.45" height="0.55" depth="0.05" position="0 0.1 0" rotation="-90 0 0"><a-box color="#BDC3C7" width="0.4" height="0.5" depth="0.06" position="0 0 0"></a-box></a-box>' }
        };

        window.salvarJogoNuvem = function() { 
            if (!window.currentUser) return; 
            if (window.currentUser.uid && window.currentUser.uid.startsWith('teste_')) return;
            firestoreDB.collection("jogadores").doc(window.currentUser.uid).set(window.playerState).catch(e => console.error(e)); 
        };

        window.fazerLogout = function() {
            firebase.auth().signOut().then(() => { window.location.reload(); });
        };

        window.abrirConfiguracoes = function() {
            let aviso = document.querySelector('#texto-central'); 
            if(aviso) { aviso.setAttribute('value', 'Configuracoes em breve...'); aviso.setAttribute('color', '#f1c40f'); aviso.setAttribute('visible', 'true'); setTimeout(() => { if(aviso) aviso.setAttribute('visible', 'false'); }, 2000); }
            window.toggleMenu('sys');
        };

        window.atualizarArmaVisual = function() { 
            let containerDir = document.querySelector('#arma-visual-dir'); let containerEsq = document.querySelector('#arma-visual-esq'); let containerPC = document.querySelector('#arma-visual-pc'); let escudoPC = document.querySelector('#escudo-visual-pc'); 
            if(!containerDir || !containerEsq || !containerPC || !escudoPC) return; 
            
            containerDir.innerHTML = ''; containerEsq.innerHTML = ''; containerPC.innerHTML = ''; escudoPC.innerHTML = ''; 
            
            let armaStats = window.bancoDeArmas[window.playerState.armaEquipada]; 
            
            if (armaStats && window.playerState.armaEquipada !== 'Shuriken') {
                let htmlArma = '';
                if (armaStats.modeloGlb && armaStats.modeloGlb !== '') { 
                    let glbPath = armaStats.modeloGlb.startsWith('#') ? armaStats.modeloGlb : `url(${armaStats.modeloGlb})`;
                    htmlArma = `<a-entity gltf-model="${glbPath}" scale="${armaStats.escalaMao || '1 1 1'}" rotation="${armaStats.rotMao || '0 0 0'}" position="${armaStats.posMao || '0 0 0'}" anti-piscar></a-entity>`; 
                } 
                else if (armaStats.visualDir) { htmlArma = armaStats.visualDir; }
                containerDir.innerHTML = htmlArma; containerPC.innerHTML = htmlArma;
            }

            let escudoStats = window.bancoDeArmas[window.playerState.nomeEscudo];
            if (window.playerState.escudoEquipado && escudoStats && (!armaStats || (armaStats.categoria !== 'Arco' && armaStats.categoria !== 'Luva'))) { 
                let htmlEscudo = '';
                if(escudoStats.modeloGlb && escudoStats.modeloGlb !== '') { 
                    let glbPath = escudoStats.modeloGlb.startsWith('#') ? escudoStats.modeloGlb : `url(${escudoStats.modeloGlb})`;
                    htmlEscudo = `<a-entity gltf-model="${glbPath}" scale="${escudoStats.escalaMao || '1 1 1'}" rotation="${escudoStats.rotMao || '0 0 0'}" position="${escudoStats.posMao || '0 0 0'}" anti-piscar></a-entity>`; 
                } 
                else if (escudoStats.visualEsq) { htmlEscudo = escudoStats.visualEsq; }
                containerEsq.innerHTML = htmlEscudo; escudoPC.innerHTML = htmlEscudo;
            } else if (armaStats && armaStats.categoria === 'Arco') {
                let rot = { rotX: 180, rotY: 90, rotZ: 90 }; 
                let htmlArco = `<a-entity rotation="${rot.rotX} ${rot.rotY} ${rot.rotZ}"><a-torus color="#8B4513" radius="0.3" radius-tubular="0.015" arc="180" rotation="0 0 90"></a-torus><a-cylinder color="#DDDDDD" radius="0.002" height="0.6" rotation="0 0 0"></a-cylinder></a-entity>`;
                containerEsq.innerHTML = htmlArco; escudoPC.innerHTML = htmlArco;
            } else if (armaStats && armaStats.visualEsq && window.playerState.armaEquipada !== 'Shuriken') {
                containerEsq.innerHTML = armaStats.visualEsq;
            }
        };

        window.tocarSom = function(idSom) {
            let som = document.getElementById(idSom);
            if (som && som.play) { som.currentTime = 0; som.play().catch(e => console.log(e)); }
        };

        window.receberDanoJogador = function(danoBruto) {
            if (!window.GAME_STARTED || !window.playerState.vivo || window.playerState.invulneravel) return;

            let armaStats = window.bancoDeArmas[window.playerState.armaEquipada];
            let escudoStats = window.bancoDeArmas[window.playerState.nomeEscudo];
            let defesaTotal = window.playerState.defesa + (armaStats ? armaStats.defesaBonus : 0) + (window.playerState.escudoEquipado && escudoStats ? escudoStats.defesaBonus : 0);
            
            let danoFinal = Math.max(1, danoBruto - Math.floor(defesaTotal / 2));
            window.playerState.hpAtual -= danoFinal;
            window.tocarSom('snd-hit');

            let telaDano = document.querySelector('#dano-tela');
            if (telaDano) { telaDano.setAttribute('visible', 'true'); setTimeout(() => telaDano.setAttribute('visible', 'false'), 200); }

            if (window.playerState.hpAtual <= 0) {
                window.playerState.hpAtual = 0;
                window.playerState.vivo = false;
                
                let aviso = document.querySelector('#texto-central');
                if(aviso) { aviso.setAttribute('value', 'VOCÊ MORREU!'); aviso.setAttribute('color', '#ff0000'); aviso.setAttribute('visible', 'true'); }

                setTimeout(() => {
                    let resp = window.playerState.ultimoRespawn;
                    let rig = document.querySelector('#rig');
                    if (rig && resp) { rig.object3D.position.set(resp.x, resp.y, resp.z); } 
                    else if (rig) { rig.object3D.position.set(0, 0, 0); }
                    
                    window.playerState.hpAtual = window.playerState.hpMax;
                    window.playerState.vivo = true;
                    window.playerState.invulneravel = true;
                    if(aviso) aviso.setAttribute('visible', 'false');
                    
                    window.atualizarUI(); window.salvarJogoNuvem();
                    setTimeout(() => { window.playerState.invulneravel = false; }, 3000);
                }, 3000);
            }
            window.atualizarUI();
        };

        window.atualizarUI = function() { 
            let elsHtml = ['#txt-nivel-hud', '#txt-status-hud', '#hp-wrapper', '#mp-wrapper', '#txt-arma-hud', '#attr-nivel-classe', '#attr-hpmax', '#attr-mpmax', '#attr-atk', '#attr-def', '#attr-agi', '#attr-exp', '#attr-nextexp', '#attr-pts', '#inv-total-ouro', '#tt-flechas', '#tt-shurikens', '#attr-slot-1', '#attr-slot-2']; 
            for(let i=0; i<elsHtml.length; i++) { if(!document.querySelector(elsHtml[i])) return; } 
            
            document.querySelector('#txt-nivel-hud').setAttribute('value', `Nivel: ${window.playerState.nivel} | XP: ${window.playerState.xp}/${window.playerState.xpProxNivel}`); 
            document.querySelector('#txt-status-hud').setAttribute('value', `HP: ${window.playerState.hpAtual}/${window.playerState.hpMax}   |   MP: ${window.playerState.mpAtual}/${window.playerState.mpMax}`); 
            let hpScale = Math.max(0, window.playerState.hpAtual / window.playerState.hpMax); document.querySelector('#hp-wrapper').setAttribute('scale', `${hpScale} 1 1`); 
            let mpScale = Math.max(0, window.playerState.mpAtual / window.playerState.mpMax); document.querySelector('#mp-wrapper').setAttribute('scale', `${mpScale} 1 1`); 
            
            let armaStats = window.bancoDeArmas[window.playerState.armaEquipada]; 
            let escudoStats = window.bancoDeArmas[window.playerState.nomeEscudo];
            
            let strEquip = window.playerState.armaEquipada;
            if(window.playerState.escudoEquipado && window.playerState.nomeEscudo) strEquip += ' + ' + window.playerState.nomeEscudo;
            document.querySelector('#txt-arma-hud').setAttribute('value', `Equipado: ${strEquip}`); 
            
            let forcaTotal = window.playerState.forca + (armaStats ? armaStats.danoBonus : 0); 
            let defesaTotal = window.playerState.defesa + (armaStats ? armaStats.defesaBonus : 0) + (window.playerState.escudoEquipado && escudoStats ? escudoStats.defesaBonus : 0); 
            
            let nomeHeroi = window.playerState.nome || 'Aventureiro';
            let els = { 
                '#attr-nivel-classe': `Lv ${window.playerState.nivel} ${nomeHeroi}`, 
                '#attr-hpmax': window.playerState.hpMax, '#attr-mpmax': window.playerState.mpMax, 
                '#attr-atk': forcaTotal, '#attr-def': defesaTotal, '#attr-agi': window.playerState.velocidade, 
                '#attr-exp': window.playerState.xp, '#attr-nextexp': window.playerState.xpProxNivel, '#attr-pts': window.playerState.pontos, 
                '#inv-total-ouro': window.playerState.ouro, '#tt-flechas': window.playerState.flechas, '#tt-shurikens': window.playerState.shurikens, 
                '#attr-slot-1': window.playerState.armaEquipada 
            }; 
            for(let id in els) { let e = document.querySelector(id); if(e) e.setAttribute('value', els[id]); } 
            
            let elSlot2 = document.querySelector('#attr-slot-2'); 
            if(elSlot2) { 
                if(window.playerState.escudoEquipado && window.playerState.nomeEscudo) elSlot2.setAttribute('value', window.playerState.nomeEscudo.substring(0,8)); 
                else if(armaStats && armaStats.categoria === 'Arco') elSlot2.setAttribute('value', '2 Maos'); 
                else elSlot2.setAttribute('value', 'Vazio'); 
            } 
            window.atualizarArmaVisual(); 
            window.salvarJogoNuvem(); 
        };

        window.renderizarInventario = function() {
            let listaArmas = Object.keys(window.bancoDeArmas).filter(k => k !== 'Desarmado'); 
            let gridContainer = document.querySelector('#inv-grid-container'); 
            if(!gridContainer) return;
            
            let cols = 7; let startX = -1.05; let startY = 0.55; let gap = 0.28; 
            let htmlSlots = "";
            
            for (let i = 0; i < 35; i++) { 
                let col = i % cols; let row = Math.floor(i / cols); 
                let posX = startX + (col * gap);
                let posY = startY - (row * gap);
                
                htmlSlots += `<a-box class="interativo" position="${posX} ${posY} 0.01" width="0.25" height="0.25" depth="0.01" color="#3a4454" ${i < listaArmas.length ? `slot-interativo="item: ${listaArmas[i]}"` : ''}>
                    <a-plane width="0.22" height="0.22" color="#151a21" position="0 0 0.006"></a-plane>`;
                
                if (i < listaArmas.length) { 
                    let nomeArma = listaArmas[i]; 
                    let armaStats = window.bancoDeArmas[nomeArma]; 
                    if(armaStats && armaStats.modeloGlb && armaStats.modeloGlb !== '') { 
                        let glbPath = armaStats.modeloGlb.startsWith('#') ? armaStats.modeloGlb : `url(${armaStats.modeloGlb})`;
                        htmlSlots += `<a-entity gltf-model="${glbPath}" scale="${armaStats.escalaInv || '0.15 0.15 0.15'}" rotation="${armaStats.rotInv || '0 0 0'}" position="${armaStats.posInv || '0 0 0.05'}"></a-entity>`;
                    } else { 
                        htmlSlots += `<a-text value="${nomeArma.substring(0,5)}" align="center" width="1" position="0 0 0.02" color="#bdc3c7" scale="0.8 0.8 0.8"></a-text>`;
                    } 
                }

        window.posicionarMenuDeFrente = function(menuId) {
            let menu = document.querySelector(menuId);
            let camera = document.querySelector('[camera]');
            let cena = document.querySelector('a-scene');
            if(!menu || !camera || !cena) return;

            if(menu.parentNode !== cena) { cena.appendChild(menu); }

            let camPos = new THREE.Vector3(); 
            camera.object3D.getWorldPosition(camPos); 
            
            let camQuat = new THREE.Quaternion();
            camera.object3D.getWorldQuaternion(camQuat);
            let camRotY = new THREE.Euler().setFromQuaternion(camQuat, 'YXZ').y;
            
            let distancia = menuId === '#caixa-dialogo' || menuId === '#menu-sistema' ? 1.5 : 1.8; 
            let spawnX = camPos.x - Math.sin(camRotY) * distancia;
            let spawnZ = camPos.z - Math.cos(camRotY) * distancia;

            menu.object3D.position.set(spawnX, camPos.y - 0.2, spawnZ);
            menu.object3D.rotation.set(0, camRotY, 0);
            
            if(menuId === '#caixa-dialogo') menu.setAttribute('scale', '1 1 1');
            else if(menuId === '#menu-sistema') menu.setAttribute('scale', '0.8 0.8 0.8');
            else menu.setAttribute('scale', '0.65 0.65 0.65');
        };

        window.realizarAtaque = function() {
            if(!window.GAME_STARTED || !window.playerState.vivo || window.npcAtivo || window.invAberto || window.atribAberto || window.sysMenuAberto) return;
            let armaStats = window.bancoDeArmas[window.playerState.armaEquipada] || window.bancoDeArmas['Desarmado']; 

            // VR: Espadas normais são gerenciadas pelo 'colisor-arma-vr' na detecção física de swing.
            if (window.GAME_MODE === 'VR' && armaStats.categoria !== 'Arco' && armaStats.categoria !== 'Luva') { return; }

            window.tocarSom('snd-sword');
            let pcWeapon = document.querySelector('#arma-visual-pc'); 
            if(pcWeapon) { pcWeapon.removeAttribute('animation'); pcWeapon.setAttribute('animation', 'property: rotation; to: -60 45 -45; dur: 150; dir: alternate; loop: 1'); setTimeout(() => { if(pcWeapon) pcWeapon.setAttribute('rotation', '-90 0 0'); }, 300); }
            
            let cameraObj = document.querySelector('[camera]'); if(!cameraObj) return;
            let posCamera = new THREE.Vector3(); let direcao = new THREE.Vector3(0, 0, -1); 
            cameraObj.object3D.getWorldPosition(posCamera); 
            let camQuat = new THREE.Quaternion(); cameraObj.object3D.getWorldQuaternion(camQuat);
            direcao.applyQuaternion(camQuat);
            
            // --- GERAÇÃO DO RASTRO/SWING VFX PARA PC E MOBILE (DIAGONAL FIXA) ---
            let simVel = new THREE.Vector3(1, -1, 0); // Sentido do corte na tela (Diagonal direita p/ baixo)
            simVel.applyQuaternion(camQuat).normalize().multiplyScalar(5); // Converte para o mundo real
            window.gerarSwingVFX(simVel, armaStats, '[camera]');

            // Arco de partículas simulado para PC/Mobile
            let count = 0;
            let arcInt = setInterval(() => {
                if(count > 6) { clearInterval(arcInt); return; }
                let offX = 0.5 - (count * 0.15); // Move da direita pra esquerda
                let offY = 0.2 - (count * 0.1);  // Move de cima pra baixo
                let offVector = new THREE.Vector3(offX, offY, -1.2).applyQuaternion(camQuat);
                let pPos = posCamera.clone().add(offVector);
                window.gerarParticulaRastro(pPos, simVel, '#00FFFF');
                window.gerarParticulaRastro(pPos, simVel, '#FFFFFF'); // Miolo branco
                count++;
            }, 30);

            let dirCam2D = new THREE.Vector2(direcao.x, direcao.z); 
            if (dirCam2D.lengthSq() > 0.001) dirCam2D.normalize();
            
            let alcanceArma = armaStats.distancia || 3.0; 

            let inimigosEls = document.querySelectorAll('[sistema-inimigo-sync]');
            inimigosEls.forEach(inimigoEl => { 
                if(!inimigoEl.object3D) return; 
                let syncComp = inimigoEl.components['sistema-inimigo-sync']; 
                if(syncComp && syncComp.hpAtual <= 0) return;

                let posInimigo = new THREE.Vector3(); 
                inimigoEl.object3D.getWorldPosition(posInimigo); 
                
                let dx = posInimigo.x - posCamera.x; let dz = posInimigo.z - posCamera.z;
                let dist2D = Math.hypot(dx, dz);
                
                if (dist2D <= alcanceArma) { 
                    let dirInimigo2D = new THREE.Vector2(dx, dz); 
                    if (dist2D > 0.001) dirInimigo2D.normalize();
                    let anguloAcerto = dirCam2D.dot(dirInimigo2D); 
                    
                    if (anguloAcerto > 0.0) { 
                        if(syncComp) { 
                            syncComp.receberDano(Math.floor((window.playerState.forca + armaStats.danoBonus) * 1.5), armaStats.categoria); 
                            
                            // --- GERA O EFEITO DE HIT (Acerto) NO INIMIGO ---
                            let posHit = new THREE.Vector3();
                            inimigoEl.object3D.getWorldPosition(posHit);
                            posHit.y += 1.0; // Levanta para o peito do inimigo
                            window.gerarHitVFX(posHit, armaStats);
                        }
                    }
                } 
            });
        };

                rotX: { type: 'number', default: 0 },
                rotY: { type: 'number', default: 0 }
            },
            init: function() {
                this.alvo = document.querySelector(this.data.alvoId);

        // ==========================================
        // SISTEMA DE VFX DINÂMICO (CORTE, HIT E PARTÍCULAS)
        // ==========================================

        window.gerarParticulaRastro = function(pos, vel, corHex = '#00FFFF') {
            let scene = document.querySelector('a-scene');
            let p = document.createElement('a-entity');
            let rX = pos.x + (Math.random() - 0.5) * 0.2;
            let rY = pos.y + (Math.random() - 0.5) * 0.2;
            let rZ = pos.z + (Math.random() - 0.5) * 0.2;
            p.setAttribute('position', `${rX} ${rY} ${rZ}`);
            
            p.setAttribute('geometry', 'primitive: box; width: 0.015; height: 0.015; depth: 0.15');
            p.setAttribute('material', `color: ${corHex}; emissive: ${corHex}; emissiveIntensity: 3; shader: flat; transparent: true; blending: additive; depthWrite: false`);
            
            if (vel && vel.lengthSq() > 0.01) {
                p.object3D.lookAt(new THREE.Vector3(rX, rY, rZ).add(vel));
            }

            p.setAttribute('animation__scale', 'property: scale; to: 0 0 0; dur: 400; easing: linear');
            scene.appendChild(p);
            setTimeout(() => { if(p && p.parentNode) p.parentNode.removeChild(p); }, 400);
        };

        window.gerarSwingVFX = function(vetorVelocidade, armaStats, alvoSelector) {
            if (!armaStats.swingAnim || armaStats.swingAnim.trim() === '') return;

            let scene = document.querySelector('a-scene');
            let vfx = document.createElement('a-entity');

            let cam = document.querySelector('[camera]');
            let camQuat = new THREE.Quaternion();
            if(cam) cam.object3D.getWorldQuaternion(camQuat);

            let velLocal = vetorVelocidade.clone().applyQuaternion(camQuat.clone().invert());
            let angleZ = Math.atan2(velLocal.y, velLocal.x); 

            let rotBaseArr = (armaStats.swingRotacao || '0 0 0').split(' ');
            let rX = parseFloat(rotBaseArr[0]) || 0;
            let rY = parseFloat(rotBaseArr[1]) || 0;
            let rZ = parseFloat(rotBaseArr[2]) || 0;

            let finalAngleZ = angleZ + THREE.MathUtils.degToRad(rZ);

            let escBase = (armaStats.swingEscala || '1 1 1').split(' ');
            let sX = parseFloat(escBase[0]) || 1; 
            let sY = parseFloat(escBase[1]) || 1;
            let sZ = parseFloat(escBase[2]) || 1;

            let additive = armaStats.swingAdditive ? '; blending: additive' : '';
            let offsetFrente = alvoSelector === '[camera]' ? -1.5 : -0.6; 

            vfx.setAttribute('efeito-rastro', `alvoId: ${alvoSelector}; offsetZ: ${offsetFrente}; angleZ: ${finalAngleZ}; rotX: ${rX}; rotY: ${rY}`);

            if (armaStats.swingAnim.endsWith('.png') || armaStats.swingAnim.endsWith('.jpg')) {
                let imgMaterial = `src: url(${armaStats.swingAnim}); transparent: true; alphaTest: 0.5; side: double; depthWrite: false${additive}`;
                vfx.innerHTML = `<a-entity geometry="primitive: plane; width: ${sX}; height: ${sY}" material="${imgMaterial}"></a-entity>`;
            } else if (armaStats.swingAnim.endsWith('.gif')) {
                let imgMaterial = `shader: gif; src: url(${armaStats.swingAnim}); transparent: true; alphaTest: 0.5; side: double; depthWrite: false${additive}`;
                vfx.innerHTML = `<a-entity geometry="primitive: plane; width: ${sX}; height: ${sY}" material="${imgMaterial}"></a-entity>`;
            } else {
                let glbPath = armaStats.swingAnim.startsWith('#') ? armaStats.swingAnim : `url(${armaStats.swingAnim})`;
                vfx.innerHTML = `<a-entity gltf-model="${glbPath}" scale="${sX} ${sY} ${sZ}" animation-mixer="loop: once; clampWhenFinished: true;"></a-entity>`;
            }

            scene.appendChild(vfx);
            setTimeout(() => { if (vfx && vfx.parentNode) vfx.parentNode.removeChild(vfx); }, 600); 
        };

        window.gerarHitVFX = function(pos, armaStats) {
            if (!armaStats.hitAnim || armaStats.hitAnim.trim() === '') return;

            let scene = document.querySelector('a-scene');
            let vfx = document.createElement('a-entity');

            let offsetX = (Math.random() - 0.5) * 0.4;
            let offsetY = (Math.random() - 0.5) * 0.4;
            let offsetZ = (Math.random() - 0.5) * 0.4;

            vfx.setAttribute('position', `${pos.x + offsetX} ${pos.y + offsetY} ${pos.z + offsetZ}`);

            let cam = document.querySelector('[camera]');
            if(cam) {
                let camQuat = new THREE.Quaternion();
                cam.object3D.getWorldQuaternion(camQuat);
                vfx.object3D.quaternion.copy(camQuat); 
            }

            let escBase = (armaStats.hitEscala || '1 1 1').split(' ');
            let sX = parseFloat(escBase[0]) || 1; 
            let sY = parseFloat(escBase[1]) || 1;
            let sZ = parseFloat(escBase[2]) || 1;

            let additive = armaStats.hitAdditive ? '; blending: additive' : '';
            let shaderTipo = armaStats.hitAnim.toLowerCase().endsWith('.gif') ? 'gif' : 'flat';

            if (armaStats.hitAnim.endsWith('.png') || armaStats.hitAnim.endsWith('.jpg') || armaStats.hitAnim.endsWith('.gif')) {
                let imgMaterial = `shader: ${shaderTipo}; src: url(${armaStats.hitAnim}); transparent: true; alphaTest: 0.5; side: double; depthWrite: false${additive}`;
                vfx.innerHTML = `<a-entity geometry="primitive: plane; width: ${sX}; height: ${sY}" material="${imgMaterial}"></a-entity>`;
            } else {
                let glbPath = armaStats.hitAnim.startsWith('#') ? armaStats.hitAnim : `url(${armaStats.hitAnim})`;
                vfx.innerHTML = `<a-entity gltf-model="${glbPath}" scale="${sX} ${sY} ${sZ}" animation-mixer="loop: once; clampWhenFinished: true;"></a-entity>`;
            }

            scene.appendChild(vfx);
            setTimeout(() => { if (vfx && vfx.parentNode) vfx.parentNode.removeChild(vfx); }, 600);

        // ====== DETECTOR DE CORTE FÍSICO DO VR (CAIXA EXATA, ESTOCADA E PARTÍCULAS) ======
        AFRAME.registerComponent('colisor-arma-vr', {
            schema: { mao: { type: 'string' } },
            init: function() {
                this.lastWorldPos = new THREE.Vector3();
                this.el.object3D.getWorldPosition(this.lastWorldPos);
                this.lastLocalPos = this.el.object3D.position.clone();
                this.cortando = false;
                this.tempoCorte = 0;
                this.camera = document.querySelector('[camera]');
                this.lastHits = new Map();
                this.vel = new THREE.Vector3();
                this.speed = 0;
            },
            tick: function(time, timeDelta) {
                if (window.GAME_MODE !== 'VR' || !window.playerState.vivo) return;
                
                let dt = timeDelta / 1000;
                if (dt === 0) return;

                let armaStats = window.bancoDeArmas[window.playerState.armaEquipada];
                let currentWorldPos = new THREE.Vector3();
                this.el.object3D.getWorldPosition(currentWorldPos);
                let currentLocalPos = this.el.object3D.position.clone();

                let deltaWorld = new THREE.Vector3().subVectors(currentWorldPos, this.lastWorldPos);
                this.vel.copy(deltaWorld).divideScalar(dt);
                this.lastWorldPos.copy(currentWorldPos);

                // Velocidade Local do controle (ignora andada geral do player)
                let deltaLocal = new THREE.Vector3().subVectors(currentLocalPos, this.lastLocalPos);
                this.speed = deltaLocal.length() / dt;
                this.lastLocalPos.copy(currentLocalPos);

                if (this.data.mao === 'esquerda' && armaStats && armaStats.categoria !== 'Luva') return; 
                if (!armaStats || (armaStats.categoria !== 'Espada' && armaStats.categoria !== 'Luva')) return;

                // INICIA O CORTE
                if (this.speed > 2.0 && !this.cortando) {
                    this.cortando = true;
                    this.tempoCorte = time;
                    window.tocarSom('snd-sword');
                    
                    let maoId = this.data.mao === 'direita' ? '#mao-direita' : '#mao-esquerda';
                    window.gerarSwingVFX(this.vel.clone(), armaStats, maoId);
                }

                // GERA AS PARTÍCULAS LUMINOSAS DURANTE O MOVIMENTO DO CORTE
                if (this.cortando) {
                    if (time - this.tempoCorte > 400) {
                        this.cortando = false;
                    } else {
                        // Calcula a ponta da espada para nascer a faísca
                        let posPonta = currentWorldPos.clone();
                        if (armaStats.categoria === 'Espada') {
                            let dirPonta = new THREE.Vector3(0, 0, -1).applyQuaternion(this.el.object3D.getWorldQuaternion(new THREE.Quaternion()));
                            posPonta.add(dirPonta.multiplyScalar(0.6)); // Joga a partícula lá pra ponta da lâmina
                        }
                        
                        // Uma faísca branca e uma ciano
                        window.gerarParticulaRastro(posPonta, this.vel, '#FFFFFF');
                        if(Math.random() > 0.5) window.gerarParticulaRastro(posPonta, this.vel, '#00FFFF');
                    }
                }

                // Bounding Box Exata da Espada
                let boxArma = new THREE.Box3();
                let visualEl = this.el.querySelector(this.data.mao === 'direita' ? '#arma-visual-dir' : '#arma-visual-esq');
                if (visualEl) {
                    visualEl.object3D.updateMatrixWorld(true);
                    boxArma.setFromObject(visualEl.object3D);
                }
                if (boxArma.isEmpty()) { 
                    boxArma.setFromCenterAndSize(currentWorldPos, new THREE.Vector3(0.2, 0.2, 0.2));
                }

                let inimigosEls = document.querySelectorAll('[sistema-inimigo-sync]');
                let agora = Date.now();
                
                inimigosEls.forEach(inimigoEl => {
                    let syncComp = inimigoEl.components['sistema-inimigo-sync'];
                    if(syncComp && syncComp.hpAtual > 0) {
                        let colisorNode = inimigoEl.querySelector('.colisao-inimigo');
                        let boxInimigo = new THREE.Box3();
                        if(colisorNode) {
                            colisorNode.object3D.updateMatrixWorld(true);
                            boxInimigo.setFromObject(colisorNode.object3D);
                        } else {
                            inimigoEl.object3D.updateMatrixWorld(true);
                            boxInimigo.setFromObject(inimigoEl.object3D);
                        }

                        if (boxArma.intersectsBox(boxInimigo)) {
                            let lastHit = this.lastHits.get(inimigoEl) || 0;
                            // Se a lâmina estiver dentro do inimigo e você der estocada/corte veloz
                            if (this.speed > 1.5 && (agora - lastHit > 400)) { 
                                syncComp.receberDano(Math.floor(window.playerState.forca + armaStats.danoBonus), armaStats.categoria);
                                let posHit = new THREE.Vector3(); inimigoEl.object3D.getWorldPosition(posHit); posHit.y += 1.0;
                                window.gerarHitVFX(posHit, armaStats); 
                                this.lastHits.set(inimigoEl, agora);
                            }
                        }
                    }
                });
            }
        });

        // ====== DEFENDE E RICOCHETEIA PROJÉTEIS (REGRAS NOVAS) ======
        AFRAME.registerComponent('projetil-inimigo-fisico', {
            schema: { velocidade: {type: 'vec3'}, dano: {type: 'number', default: 10} },
            init: function () { 
                this.vel = new THREE.Vector3(this.data.velocidade.x, this.data.velocidade.y, this.data.velocidade.z); 
                this.camera = document.querySelector('[camera]'); 
            },
            tick: function (time, timeDelta) {
                let dt = timeDelta / 1000; 
                if (dt === 0 || !window.GAME_STARTED) return; 

                if (!window.playerState.vivo) {
                    this.el.remove(); return;
                }

                this.el.object3D.position.add(this.vel.clone().multiplyScalar(dt));
                
                if (this.el.object3D.position.y < -1) { 
                    this.el.remove(); return; 
                }

                let posProj = new THREE.Vector3(); 
                this.el.object3D.getWorldPosition(posProj);

                if (this.el.dataset.defletido !== "true") {
                    let maos = [];
                    let maoEsq = document.querySelector('#mao-esquerda');
                    let maoDir = document.querySelector('#mao-direita');
                    if (maoEsq) maos.push({el: maoEsq, esq: true});
                    if (maoDir) maos.push({el: maoDir, esq: false});

                    for (let i = 0; i < maos.length; i++) {
                        let mao = maos[i].el;
                        let isEsq = maos[i].esq;

                        let armaStats = window.bancoDeArmas[window.playerState.armaEquipada];
                        let isEscudo = isEsq && window.playerState.escudoEquipado;
                        let isLuva = (armaStats && armaStats.categoria === 'Luva');
                        let isEspada = (!isEsq && armaStats && armaStats.categoria === 'Espada');
                        
                        if (isEscudo || isLuva || isEspada) {
                            let posMao = new THREE.Vector3();
                            mao.object3D.getWorldPosition(posMao);
                            
                            let raioColisao = isEspada ? 0.8 : 0.4;
                            if (isEscudo) raioColisao = 0.5;
                            
                            if (posProj.distanceTo(posMao) < raioColisao) {
                                let colisorComp = mao.components['colisor-arma-vr'];
                                let handSpeed = colisorComp ? colisorComp.speed : 0;
                                
                                if (isEscudo) {
                                    if (handSpeed > 1.5) {
                                        // Escudo batendo rápido -> Ricocheteia
                                        this.el.dataset.defletido = "true";
                                        let handVel = colisorComp ? colisorComp.vel.clone().normalize() : new THREE.Vector3(0, 1, -1).normalize();
                                        if (handVel.lengthSq() === 0) handVel.set(0, 1, -1).normalize();
                                        this.vel.copy(handVel).multiplyScalar(20); 
                                        window.tocarSom('snd-sword');
                                        return; 
                                    } else {
                                        // Escudo Parado -> Destrói o tiro
                                        window.tocarSom('snd-hit'); 
                                        this.el.remove();
                                        return; 
                                    }
                                } else if (isEspada) {
                                    if (handSpeed > 1.5) {
                                        // Espada batendo no tiro -> Destrói o tiro
                                        window.tocarSom('snd-sword'); 
                                        this.el.remove();
                                        
                                        // Brilho na ponta da espada quando corta o tiro
                                        window.gerarParticulaRastro(posProj, null, '#FFFFFF');
                                        return; 
                                    }
                                } else if (isLuva) {
                                    if (handSpeed > 1.5) {
                                        // Luva batendo no tiro -> Ricocheteia
                                        this.el.dataset.defletido = "true";
                                        let handVel = colisorComp ? colisorComp.vel.clone().normalize() : new THREE.Vector3(0, 1, -1).normalize();
                                        if (handVel.lengthSq() === 0) handVel.set(0, 1, -1).normalize();
                                        this.vel.copy(handVel).multiplyScalar(20); 
                                        window.tocarSom('snd-sword');
                                        return; 
                                    }
                                }
                            }
                        }
                    }
                }

                if (this.el.dataset.defletido === "true") {
                    let inimigos = document.querySelectorAll('[sistema-inimigo-sync]');
                    for(let i=0; i<inimigos.length; i++) {
                        let ini = inimigos[i];
                        let sync = ini.components['sistema-inimigo-sync'];
                        if(sync && sync.hpAtual > 0) {
                            let posIni = new THREE.Vector3();
                            ini.object3D.getWorldPosition(posIni);
                            if (posProj.distanceTo(posIni) < 1.5) {
                                sync.receberDano(this.data.dano * 2, 'Luva'); 
                                this.el.remove();
                                return;
                            }
                        }
                    }
                    return; 
                }
                
                if(!this.camera) return; 
                let posPlayer = new THREE.Vector3(); 
                this.camera.object3D.getWorldPosition(posPlayer); 
                
                if (posProj.distanceTo(posPlayer) < 0.3) { 
                    window.receberDanoJogador(this.data.dano); 
                    this.el.remove(); 
                }
            }
        });

        // ====== MAGIA: PROJÉTIL (SEM GRAVIDADE) ======

        // ====== VARINHA: MAGIA POR GESTOS E MIRA ASSISTIDA ======
        AFRAME.registerComponent('vr-magia-lancar', {
            init: function() {
                this.gravando = false;
                this.tempoInicio = 0;
                this.scene = document.querySelector('a-scene');

                this.el.addEventListener('triggerdown', () => {
                    if (window.GAME_MODE !== 'VR' || !window.playerState.vivo) return;
                    let armaStats = window.bancoDeArmas[window.playerState.armaEquipada];
                    if (!armaStats || armaStats.categoria !== 'Varinha') return;

                    if (window.playerState.mpAtual < 10) {
                        window.tocarSom('snd-hit');
                        return;
                    }

                    this.gravando = true;
                    // Salva de onde o gesto comecou
                    this.posInicio = new THREE.Vector3(0, 0, -0.45);
                    this.posInicio.applyMatrix4(this.el.object3D.matrixWorld);

                    this.tempoInicio = Date.now();
                    
                    // Acende a pontinha da varinha (que esta no HTML base do visual dela)
                    const tipVisEl = this.el.querySelector('#wand-tip-vis');
                    if (tipVisEl) {
                        tipVisEl.setAttribute('material', 'emissive: #fff; emissiveIntensity: 1.5'); 
                    }
                });

                this.el.addEventListener('triggerup', () => {
                    if (!this.gravando) return;
                    this.gravando = false;
                    
                    const tipVisEl = this.el.querySelector('#wand-tip-vis');
                    if (tipVisEl) {
                        tipVisEl.setAttribute('material', 'emissive: #00FFFF; emissiveIntensity: 0.8'); 
                    }
                    
                    // Pega a posicao da ponta da varinha agora (45cm pra frente do controle)
                    let posFim = new THREE.Vector3(0, 0, -0.45);
                    posFim.applyMatrix4(this.el.object3D.matrixWorld);

                    let tempoGasto = Date.now() - this.tempoInicio;
                    let deltaWorld = new THREE.Vector3().subVectors(posFim, this.posInicio);
                    
                    if (tempoGasto > 50 && deltaWorld.length() > 0.15) {
                        
                        let cam = document.querySelector('[camera]');
                        let deltaMatrix = new THREE.Matrix4().copy(cam.object3D.matrixWorld).invert();
                        let localInicio = this.posInicio.clone().applyMatrix4(deltaMatrix);
                        let localFim = posFim.clone().applyMatrix4(deltaMatrix);
                        let localDelta = new THREE.Vector3().subVectors(localFim, localInicio);
                        
                        let isHorizontal = Math.abs(localDelta.x) > Math.abs(localDelta.y);
                        
                        let corMagia, custoMP, multDano, scaleMagia;
                        if (isHorizontal) {
                            corMagia = '#9b59b6';
                            custoMP = 10;
                            multDano = 1.0;
                            scaleMagia = '1 1 1';
                        } else {
                            corMagia = '#00FFFF';
                            custoMP = 15;
                            multDano = 1.5;
                            scaleMagia = '1.5 1.5 1.5';
                        }

                        if (window.playerState.mpAtual < custoMP) { window.tocarSom('snd-hit'); return; }
                        
                        window.playerState.mpAtual -= custoMP;
                        window.atualizarUI();

                        // --- DIREÇÃO REAL: Exatamente a frente do controle (-Z) ---
                        let quatMao = new THREE.Quaternion();
                        this.el.object3D.getWorldQuaternion(quatMao);
                        let castDir = new THREE.Vector3(0, 0, -1);
                        castDir.applyQuaternion(quatMao).normalize();

                        // --- AIM ASSIST MÁGICO (Trava agressiva de 85% se no cone) ---
                        let bestTarget = null;
                        let smallestAngle = 0.35; // ~20 graus de cone visual frontal
                        let inimigosAtuais = document.querySelectorAll('[sistema-inimigo-sync]');
                        inimigosAtuais.forEach(ini => {
                            let syncComp = ini.components['sistema-inimigo-sync'];
                            if(syncComp && syncComp.hpAtual > 0) {
                                let iniPos = new THREE.Vector3(); ini.object3D.getWorldPosition(iniPos);
                                iniPos.y += 1.0; // Mira pro peito
                                let dirToIni = new THREE.Vector3().subVectors(iniPos, posFim).normalize();
                                let angle = castDir.angleTo(dirToIni);
                                if (angle < smallestAngle) { smallestAngle = angle; bestTarget = dirToIni; }
                            }
                        });
                        
                        if (bestTarget) { castDir.lerp(bestTarget, 0.85).normalize(); } 

                        let armaStats = window.bancoDeArmas[window.playerState.armaEquipada];
                        let speed = armaStats.projetilVel || 20;
                        let finalVel = castDir.multiplyScalar(speed);

                this.el.addEventListener('gripup', () => {
                    if (this.segurando) {

                            let oldData = this.posHistory[0];

                            let smallestAngle = 0.3; 
                            
                            let inimigosAtuais = document.querySelectorAll('[sistema-inimigo-sync]');

                        if (speed > 1.5) window.tocarSom('snd-sword');
                        
                        this.origemGrab = null;
                    }

                    this.el.children[0].setAttribute('color', '#f1c40f'); let itemAlvo = window.bancoDeArmas[this.data.item]; let itemEquipado = window.bancoDeArmas[window.playerState.armaEquipada]; if(!itemAlvo) return; 
                    let diffForca = itemAlvo.danoBonus - (itemEquipado ? itemEquipado.danoBonus : 0); let diffDefesa = itemAlvo.defesaBonus - (itemEquipado ? itemEquipado.defesaBonus : 0); 
                    if(painelTooltip) painelTooltip.setAttribute('visible', 'true'); if(txtNome) txtNome.setAttribute('value', this.data.item); 
                    if(txtForca) { txtForca.setAttribute('value', `ATK: ${itemAlvo.danoBonus}`); } 
                    if(txtDefesa) { txtDefesa.setAttribute('value', `DEF: ${itemAlvo.defesaBonus}`); } 
                    if(boxEquipar) { let msg = itemAlvo.categoria === 'Escudo' ? (window.playerState.nomeEscudo === this.data.item ? '[ EQUIPPED ]' : '[C] Equipar') : (window.playerState.armaEquipada === this.data.item ? '[ EQUIPPED ]' : '[C] Equipar'); let cor = (window.playerState.armaEquipada === this.data.item || window.playerState.nomeEscudo === this.data.item) ? '#f1c40f' : '#2ecc71'; boxEquipar.setAttribute('value', msg); boxEquipar.setAttribute('color', cor); } 
                }); 
                this.el.addEventListener('mouseleave', () => { this.el.children[0].setAttribute('color', '#151a21'); if(painelTooltip) painelTooltip.setAttribute('visible', 'false'); }); 
                
                const equiparFuncao = () => { 
                    let itemAlvo = window.bancoDeArmas[this.data.item]; if(!itemAlvo) return;
                    let armaAtual = window.bancoDeArmas[window.playerState.armaEquipada];
                    
                    if(itemAlvo.categoria === 'Escudo') { 
                        if (armaAtual && (armaAtual.categoria === 'Arco' || armaAtual.categoria === 'Luva' || armaAtual.categoria === 'Varinha')) {
                            let aviso = document.querySelector('#texto-central'); if(aviso) { aviso.setAttribute('value', 'NÃO PODE USAR ESCUDO\nCOM ARMA DE 2 MÃOS!'); aviso.setAttribute('color', '#FF0000'); aviso.setAttribute('visible', 'true'); setTimeout(() => { if(aviso) aviso.setAttribute('visible', 'false'); }, 2000); }
                            return;
                        }
                        window.playerState.nomeEscudo = this.data.item; 
                        window.playerState.escudoEquipado = true; 
                    } else { 
                        if ((itemAlvo.categoria === 'Arco' || itemAlvo.categoria === 'Luva' || itemAlvo.categoria === 'Varinha') && window.playerState.escudoEquipado) {
                            window.playerState.escudoEquipado = false;
                            window.playerState.nomeEscudo = '';
                        }
                        window.playerState.armaEquipada = this.data.item; 
                    }
                    
                    window.atualizarUI(); let aviso = document.querySelector('#texto-central'); if(aviso) { aviso.setAttribute('value', `${this.data.item} Equipado!`); aviso.setAttribute('color', '#00FF00'); aviso.setAttribute('visible', 'true'); setTimeout(() => { if(aviso) aviso.setAttribute('visible', 'false'); }, 1000); } 
                };
                
                this.el.addEventListener('mousedown', equiparFuncao);
                this.el.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); equiparFuncao(); }, {passive: false});
            } 
        });
        
        AFRAME.registerComponent('sistema-jogo', { init: function () { setInterval(() => { if (!window.GAME_STARTED) return; if (window.playerState.vivo && window.playerState.mpAtual < window.playerState.mpMax) { window.playerState.mpAtual = Math.min(window.playerState.mpMax, window.playerState.mpAtual + 5); window.atualizarUI(); } }, 1000); } });
        
        AFRAME.registerComponent('btn-atributo', { 
            schema: { tipo: { type: 'string' } }, 
            init: function () { 
                const upFn = () => { 
                    if (window.playerState.pontos > 0 && window.playerState.vivo) { 
                        window.playerState.pontos--; window.playerState[this.data.tipo]++; this.el.setAttribute('color', '#fff'); 
                        setTimeout(() => { if(this.el) this.el.setAttribute('color', this.data.tipo === 'forca' ? '#e74c3c' : (this.data.tipo === 'defesa' ? '#3498db' : '#f1c40f')); }, 150); 
                        if (this.data.tipo === 'defesa') { window.playerState.hpMax += 10; window.playerState.hpAtual = window.playerState.hpMax; } 
                        if (this.data.tipo === 'forca') { window.playerState.mpMax += 10; window.playerState.mpAtual = window.playerState.mpMax; } 
                        window.atualizarUI(); 
                    } 
                }; 
                this.el.addEventListener('mousedown', upFn); 
                this.el.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); upFn(); }, {passive: false}); 
            } 
        });
        
        AFRAME.registerComponent('sistema-bau', { init: function() { let aberto = false; this.el.addEventListener('click', () => { if(!aberto) { aberto = true; this.el.setAttribute('color', '#8B4513'); this.el.setAttribute('rotation', '-45 45 0'); window.playerState.flechas += 15; window.playerState.shurikens += 15; window.playerState.ouro += 500; window.playerState.pontos += 3; window.atualizarUI(); let aviso = document.querySelector('#texto-central'); if(aviso) { aviso.setAttribute('value', '+15 Flechas\n+15 Shurikens\n+500 Ouro\n+3 Pontos!'); aviso.setAttribute('color', '#FFD700'); aviso.setAttribute('visible', 'true'); setTimeout(() => { if(aviso) aviso.setAttribute('visible', 'false'); }, 3000); } } }); } });
    </script>
