<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG MMO - 3 Magia Fluida e Mira Precisa</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="https://rawgit.com/mayognaise/aframe-gif-shader/master/dist/aframe-gif-shader.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/config.js"></script>
    <script src="js/game-core.js"></script>
    <script src="js/aframe-components.js"></script>
    <script src="js/network.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div id="login-menu" class="menu-box">
            <form onsubmit="event.preventDefault();">
                <h2 style="color: #f1c40f;">MMO Login</h2>
                <input type="email" id="login-email" placeholder="Email" autocomplete="username">
                <input type="password" id="login-senha" placeholder="Senha" autocomplete="current-password">
                <button id="btn-login" class="btn btn-blue">Entrar</button>
                <button id="btn-registrar" class="btn btn-green">Criar Conta</button>
                <button id="btn-login-teste" class="btn btn-orange" style="display: none; margin-top: 15px;">🧪 Entrar sem Senha (Teste)</button>
                <p id="login-error"></p>
            </form>
        </div>

        <div id="start-menu" class="menu-box">
            <h2 style="color: #2ecc71;">Logado!</h2>
            <button id="btn-pc" class="btn btn-orange">Jogar no PC (Mouse)</button>
            <button id="btn-vr" class="btn btn-blue">Jogar em VR</button>
            <button id="btn-android" class="btn btn-purple">📱 Jogar no Android (Touch)</button>
        </div>
    </div>

    <div id="sys-ui-layer">
        <div class="menu-box">
            <h2 style="color: #f1c40f;">SYSTEM MENU</h2>
            <button class="btn btn-blue" onclick="abrirConfiguracoes()">⚙️ Configurações</button>
            <button class="btn btn-red" onclick="fazerLogout()">🚪 Logout (Desconectar)</button>
            <button class="btn btn-dark" style="margin-top: 20px;" onclick="window.toggleMenu('sys')">▶️ Voltar ao Jogo</button>
        </div>
    </div>

    <div id="pc-ui">
        <button id="btn-sys-pc" class="hud-btn-sys">⚙️</button>
        <div id="crosshair"></div>
    </div>

    <div id="mobile-ui">
        <div class="menu-top-right">
            <div class="hud-btn hud-btn-sys" id="btn-sys-mobile">⚙️</div>
            <div class="hud-btn" id="btn-inv">🎒</div>
            <div class="hud-btn" id="btn-status">📈</div>
        </div>
        <div id="joystick-zone"><div id="joystick-stick"></div></div>
        <div id="action-buttons">
            <div class="hud-btn" id="btn-escudo">🛡️</div>
            <div class="hud-btn" id="btn-atacar">⚔️</div>
        </div>
    </div>

    <a-scene pc-controles sistema-jogo gerenciador-inimigos gerenciador-npcs gerenciador-respawns renderer="colorManagement: true;">
        
        <a-entity id="mouse-cursor" cursor="rayOrigin: mouse" raycaster="objects: none"></a-entity>

        <a-assets timeout="3000">
            <a-asset-item id="modelo-espada-reta" src="Armas/Espadas/espada_reta.glb"></a-asset-item>
            <a-asset-item id="modelo-espada-grande" src="Armas/Espadas/espada_grande.glb"></a-asset-item>
            <a-asset-item id="modelo-arco" src="Armas/Arcos/arco.glb"></a-asset-item>
            <a-asset-item id="modelo-escudo" src="Armas/Escudos/escudo.glb"></a-asset-item>
            <a-asset-item id="modelo-inimigo" src="Inimigos/atiradora.glb"></a-asset-item>
            <a-asset-item id="modelo-inimigo2" src="Inimigos/atiradora.glb"></a-asset-item>
        </a-assets>

        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.5" position="-1 2 1"></a-light>
        <a-entity environment="preset: forest; groundColor: #445; grid: none"></a-entity>

        <a-box class="interativo" sistema-bau position="-3 0.5 -3" rotation="0 45 0" color="#4CC3D9" shadow><a-text value="Loot" position="-0.3 0.6 0" color="#FFF" scale="0.8 0.8 0.8"></a-text></a-box>

        <a-entity id="rig" firebase-multiplayer movement-controls="speed: 0.15" mobile-movement position="0 0 0">
            
            <a-entity camera mobile-look position="0 1.6 0" look-controls="pointerLockEnabled: true">
                
                <a-entity id="cursor-centro" cursor="fuse: false" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025" material="color: white; shader: flat; opacity: 0.8" raycaster="objects: .interativo; far: 20"></a-entity>
                
                <a-entity id="arma-visual-pc" position="0.3 -0.3 -0.6" rotation="-90 0 0" scale="0.7 0.7 0.7"></a-entity>
                <a-entity id="escudo-visual-pc" position="-0.4 -0.2 -0.5" rotation="180 0 0" scale="0.7 0.7 0.7"></a-entity>

                <a-plane id="dano-tela" position="0 0 -0.5" width="2" height="2" color="#ff0000" opacity="0.3" visible="false"></a-plane>
                <a-text id="texto-central" value="" position="0 -0.3 -1.5" color="#00FF00" visible="false" scale="0.5 0.5 0.5" align="center"></a-text>
                
                <a-entity id="hud-status" position="-0.4 0.8 -1.4" rotation="25 0 0">
                    <a-plane position="0.05 0 -0.01" width="1.1" height="0.25" color="#1a1a1a" opacity="0.85"></a-plane>
                    <a-text id="txt-nivel-hud" value="Nivel: 1 | XP: 0/50" position="-0.45 -0.05 0" color="#AAAAAA" scale="0.25 0.25 0.25" align="left"></a-text>
                    <a-entity position="-0.05 0 0">
                        <a-plane position="0.3 0.05 0" width="0.6" height="0.04" color="#333"></a-plane>
                        <a-entity id="hp-wrapper" position="0 0.05 0.01"><a-plane position="0.3 0 0" width="0.6" height="0.04" color="#c0392b"></a-plane></a-entity>
                        <a-plane position="0.3 -0.01 0" width="0.6" height="0.04" color="#333"></a-plane>
                        <a-entity id="mp-wrapper" position="0 -0.01 0.01"><a-plane position="0.3 0 0" width="0.6" height="0.04" color="#2980b9"></a-plane></a-entity>
                        <a-text id="txt-status-hud" value="HP: 100/100   |   MP: 100/100" position="0.3 -0.07 0" color="#FFF" scale="0.2 0.2 0.2" align="center"></a-text>
                        <a-text id="txt-arma-hud" value="Equipado: Nenhuma" position="-0.45 -0.15 0" color="#FFD700" scale="0.25 0.25 0.25" align="left"></a-text>
                    </a-entity>
                </a-entity>
                
                <a-text id="contador-online" value="Conectando Servidor..." position="0.6 0.8 -1.2" color="#00FF00" scale="0.4 0.4 0.4" align="right"></a-text>
            </a-entity> 
            
            <a-entity id="cintura-player" sync-cintura></a-entity>

            <a-entity id="mao-esquerda" laser-controls="hand: left" raycaster="objects: .interativo; far: 15" vr-controles-left colisor-arma-vr="mao: esquerda" vr-shuriken-lancar vr-magia-lancar>
                <a-entity id="arma-visual-esq" position="0 0 0" rotation="180 0 0"></a-entity>
            </a-entity>
            <a-entity id="mao-direita" laser-controls="hand: right" raycaster="objects: .interativo; far: 15" vr-controles-gatilho vr-controles-right colisor-arma-vr="mao: direita" vr-shuriken-lancar vr-magia-lancar>
                <a-entity id="arma-visual-dir" position="0 0 0" rotation="-90 0 0"></a-entity>
            </a-entity>
        </a-entity>

        <a-entity id="menu-sistema" scale="0 0 0" visible="false" position="0 1.5 -1.6" rotation="0 0 0">
            <a-plane width="1.5" height="1.4" color="#181d23" opacity="0.95"></a-plane>
            <a-plane width="1.45" height="1.35" color="#1c222b" position="0 0 0.005"></a-plane>
            <a-plane width="1.45" height="0.2" color="#11151a" position="0 0.575 0.01"></a-plane>
            <a-text value="SYSTEM MENU" position="0 0.575 0.02" color="#f1c40f" scale="0.6 0.6 0.6" align="center"></a-text>
            <a-box class="interativo" btn-sistema-acao="acao: config" width="1.2" height="0.25" depth="0.02" color="#3498db" position="0 0.2 0.01"><a-text value="Configuracoes" position="0 0 0.02" align="center" scale="0.5 0.5 0.5"></a-text></a-box>
            <a-box class="interativo" btn-sistema-acao="acao: logout" width="1.2" height="0.25" depth="0.02" color="#e74c3c" position="0 -0.15 0.01"><a-text value="Logout (Desconectar)" position="0 0 0.02" align="center" scale="0.5 0.5 0.5"></a-text></a-box>
            <a-box class="interativo" btn-sistema-acao="acao: fechar" width="1.2" height="0.15" depth="0.02" color="#7f8c8d" position="0 -0.5 0.01"><a-text value="Voltar ao Jogo" position="0 0 0.02" align="center" scale="0.4 0.4 0.4"></a-text></a-box>
        </a-entity>

        <a-entity id="caixa-dialogo" scale="0 0 0" visible="false" position="0 1.5 -1.6" rotation="0 0 0">
            <a-plane color="#181d23" width="2.2" height="1.6" opacity="0.95" position="0 0 0"></a-plane>
            <a-plane color="#11151a" width="2.15" height="1.55" position="0 0 0.01"></a-plane>
            <a-plane color="#222831" width="2.15" height="0.25" position="0 0.65 0.02"></a-plane>
            <a-text id="npc-nome-ui" value="Nome do NPC" position="-1.0 0.65 0.03" color="#f1c40f" scale="0.5 0.5 0.5" baseline="center"></a-text>
            <a-box id="btn-npc-x" btn-dialogo-fechar class="interativo" color="#e74c3c" width="0.15" height="0.15" depth="0.02" position="1.0 0.65 0.03"><a-text value="X" align="center" position="0 0 0.02" color="#FFF" scale="0.4 0.4 0.4"></a-text></a-box>
            <a-text id="npc-texto-ui" value="Texto..." position="-1.0 0.4 0.02" color="#bdc3c7" scale="0.4 0.4 0.4" wrap-count="45" baseline="top"></a-text>
            <a-plane color="#222831" width="2.0" height="0.01" position="0 -0.1 0.02"></a-plane>
            <a-entity id="npc-recompensa-ui" visible="false" position="0 -0.2 0.02">
                <a-text value="Recompensas da Missao:" position="-1.0 0 0" color="#9b59b6" scale="0.35 0.35 0.35"></a-text>
                <a-text id="npc-rec-texto" value="" position="-1.0 -0.15 0" color="#2ecc71" scale="0.4 0.4 0.4"></a-text>
            </a-entity>
            <a-box id="btn-npc-aceitar" btn-dialogo-aceitar class="interativo" color="#27ae60" width="0.8" height="0.2" depth="0.02" position="0 -0.55 0.03" visible="false"><a-text value="ACEITAR MISSAO" align="center" position="0 0 0.02" scale="0.4 0.4 0.4" color="#FFF"></a-text></a-box>
        </a-entity>

        <a-entity id="menu-inventario-novo" scale="0 0 0" visible="false" position="0 1.5 -1.6" rotation="0 0 0">
            <a-plane width="2.6" height="2.0" color="#181d23" opacity="0.95"></a-plane>
            <a-plane width="2.55" height="1.95" color="#1c222b" position="0 0 0.005"></a-plane>
            <a-plane width="2.55" height="0.15" color="#11151a" position="0 0.9 0.01"></a-plane>
            <a-text value="INVENTORY" position="-1.2 0.9 0.02" color="#f1c40f" scale="0.6 0.6 0.6"></a-text>
            <a-entity id="inv-grid-container" position="0.1 0.1 0.02"></a-entity>
            <a-entity id="inv-tooltip" position="-0.4 0.1 0.05" visible="false">
                <a-plane width="1.2" height="0.6" color="#0a0c10" opacity="0.95" border="1px solid #34495e"></a-plane>
                <a-text id="tt-nome" value="Nome do Item" position="-0.5 0.2 0.01" color="#f1c40f" scale="0.45 0.45 0.45"></a-text>
                <a-text id="tt-forca" value="Forca: 0" position="-0.5 0.05 0.01" color="#e74c3c" scale="0.4 0.4 0.4"></a-text>
                <a-text id="tt-defesa" value="Defesa: 0" position="-0.5 -0.1 0.01" color="#3498db" scale="0.4 0.4 0.4"></a-text>
                <a-text id="tt-acao" value="[C] Equipar" position="-0.5 -0.25 0.01" color="#2ecc71" scale="0.4 0.4 0.4"></a-text>
            </a-entity>
            <a-plane width="2.55" height="0.25" color="#11151a" position="0 -0.85 0.01"></a-plane>
            <a-entity position="0 -0.85 0.02">
                <a-text value="Gold:" position="0.3 0 0" color="#bdc3c7" scale="0.5 0.5 0.5"></a-text>
                <a-circle radius="0.05" position="0.65 0 0" color="#f1c40f"></a-circle>
                <a-text id="inv-total-ouro" value="0" position="0.75 0 0" color="#FFF" scale="0.6 0.6 0.6"></a-text>
                <a-text value="Arrows:" position="-1.2 0 0" color="#bdc3c7" scale="0.5 0.5 0.5"></a-text>
                <a-text id="tt-flechas" value="0" position="-0.8 0 0" color="#FFF" scale="0.6 0.6 0.6"></a-text>
                <a-text value="Shurikens:" position="-0.5 0 0" color="#bdc3c7" scale="0.5 0.5 0.5"></a-text>
                <a-text id="tt-shurikens" value="0" position="-0.0 0 0" color="#FFF" scale="0.6 0.6 0.6"></a-text>
            </a-entity>
        </a-entity>

        <a-entity id="menu-atributos" scale="0 0 0" visible="false" position="0 1.5 -1.6" rotation="0 0 0">
            <a-plane width="3.4" height="2.2" color="#181d23" opacity="0.95"></a-plane>
            <a-plane width="3.35" height="2.15" color="#1c222b" position="0 0 0.005"></a-plane>
            <a-plane width="3.35" height="0.2" color="#11151a" position="0 0.975 0.01"></a-plane>
            <a-text value="GEAR & ATTRIBUTES" position="-1.6 0.975 0.02" color="#f1c40f" scale="0.6 0.6 0.6"></a-text>
            <a-text id="attr-nivel-classe" value="Lv 1 Aventureiro" position="0 0.975 0.02" color="#FFF" scale="0.6 0.6 0.6" align="center"></a-text>

            <a-entity position="-1.2 0.3 0.02">
                <a-text value="Equipped Gear" position="-0.35 0.45 0" color="#bdc3c7" scale="0.4 0.4 0.4"></a-text>
                <a-box width="0.25" height="0.25" depth="0.01" color="#3a4454" position="-0.25 0.2 0"><a-plane width="0.22" height="0.22" color="#151a21" position="0 0 0.01"></a-plane><a-text value="Head" position="0 0 0.02" color="#555" scale="0.3 0.3 0.3" align="center"></a-text></a-box>
                <a-box width="0.25" height="0.25" depth="0.01" color="#3a4454" position="-0.25 -0.1 0"><a-plane width="0.22" height="0.22" color="#151a21" position="0 0 0.01"></a-plane><a-text value="Body" position="0 0 0.02" color="#555" scale="0.3 0.3 0.3" align="center"></a-text></a-box>
                <a-box width="0.25" height="0.25" depth="0.01" color="#3a4454" position="-0.25 -0.4 0"><a-plane width="0.22" height="0.22" color="#151a21" position="0 0 0.01"></a-plane><a-text value="Legs" position="0 0 0.02" color="#555" scale="0.3 0.3 0.3" align="center"></a-text></a-box>
                <a-box width="0.25" height="0.25" depth="0.01" color="#3a4454" position="0.1 0.2 0"><a-plane width="0.22" height="0.22" color="#151a21" position="0 0 0.01"></a-plane><a-text value="Hands" position="0 0 0.02" color="#555" scale="0.3 0.3 0.3" align="center"></a-text></a-box>
                <a-box width="0.25" height="0.25" depth="0.01" color="#3a4454" position="0.1 -0.1 0"><a-plane width="0.22" height="0.22" color="#151a21" position="0 0 0.01"></a-plane><a-text value="Feet" position="0 0 0.02" color="#555" scale="0.3 0.3 0.3" align="center"></a-text></a-box>
                <a-text value="Main Hand" position="-0.25 -0.65 0" color="#e74c3c" scale="0.3 0.3 0.3" align="center"></a-text>
                <a-box width="0.25" height="0.25" depth="0.01" color="#e74c3c" position="-0.25 -0.85 0"><a-plane width="0.22" height="0.22" color="#151a21" position="0 0 0.01"></a-plane><a-text id="attr-slot-1" value="None" position="0 0 0.02" color="#FFF" scale="0.25 0.25 0.25" align="center"></a-text></a-box>
                <a-text value="Off Hand" position="0.1 -0.65 0" color="#3498db" scale="0.3 0.3 0.3" align="center"></a-text>
                <a-box width="0.25" height="0.25" depth="0.01" color="#3498db" position="0.1 -0.85 0"><a-plane width="0.22" height="0.22" color="#151a21" position="0 0 0.01"></a-plane><a-text id="attr-slot-2" value="None" position="0 0 0.02" color="#FFF" scale="0.25 0.25 0.25" align="center"></a-text></a-box>
            </a-entity>

            <a-entity position="0 0 0.02">
                <a-plane width="1.2" height="1.6" color="#11151a" position="0 0.05 0"></a-plane>
                <a-text value="CHARACTER PREVIEW" position="0 0.05 0.01" color="#3a4454" scale="0.5 0.5 0.5" align="center"></a-text>
                <a-plane width="1.2" height="0.15" color="#151a21" position="0 -0.85 0"></a-plane>
                <a-text value="XP" position="-0.5 -0.82 0.01" color="#f1c40f" scale="0.4 0.4 0.4"></a-text>
                <a-text id="attr-exp" value="0" position="0 -0.82 0.01" color="#FFF" scale="0.4 0.4 0.4" align="right"></a-text>
                <a-text value="/" position="0.05 -0.82 0.01" color="#7f8c8d" scale="0.4 0.4 0.4"></a-text>
                <a-text id="attr-nextexp" value="50" position="0.1 -0.82 0.01" color="#FFF" scale="0.4 0.4 0.4" align="left"></a-text>
            </a-entity>

            <a-entity position="0.8 0.4 0.02">
                <a-plane width="1.4" height="0.12" color="#11151a" position="0.3 0.35 0"></a-plane>
                <a-text value="Health & Mana" position="-0.35 0.35 0.01" color="#FFF" scale="0.4 0.4 0.4"></a-text>
                <a-text value="HP Max:" position="-0.35 0.2 0" color="#bdc3c7" scale="0.4 0.4 0.4"></a-text>
                <a-text id="attr-hpmax" value="100" position="0.9 0.2 0" color="#2ecc71" scale="0.4 0.4 0.4" align="right"></a-text>
                <a-text value="MP Max:" position="-0.35 0.05 0" color="#bdc3c7" scale="0.4 0.4 0.4"></a-text>
                <a-text id="attr-mpmax" value="100" position="0.9 0.05 0" color="#3498db" scale="0.4 0.4 0.4" align="right"></a-text>

                <a-plane width="1.4" height="0.12" color="#11151a" position="0.3 -0.15 0"></a-plane>
                <a-text value="Offensive" position="-0.35 -0.15 0.01" color="#e74c3c" scale="0.4 0.4 0.4"></a-text>
                <a-text value="ATK DMG:" position="-0.35 -0.3 0" color="#bdc3c7" scale="0.4 0.4 0.4"></a-text>
                <a-text id="attr-atk" value="10" position="0.5 -0.3 0" color="#FFF" scale="0.4 0.4 0.4" align="right"></a-text>
                <a-box class="interativo" btn-atributo="tipo: forca" width="0.08" height="0.08" depth="0.01" color="#e74c3c" position="0.8 -0.3 0"><a-text value="+" position="0 0 0.01" scale="0.4 0.4 0.4" align="center"></a-text></a-box>
                <a-text value="SPEED (AGI):" position="-0.35 -0.45 0" color="#bdc3c7" scale="0.4 0.4 0.4"></a-text>
                <a-text id="attr-agi" value="5" position="0.5 -0.45 0" color="#FFF" scale="0.4 0.4 0.4" align="right"></a-text>
                <a-box class="interativo" btn-atributo="tipo: velocidade" width="0.08" height="0.08" depth="0.01" color="#f1c40f" position="0.8 -0.45 0"><a-text value="+" position="0 0 0.01" scale="0.4 0.4 0.4" align="center"></a-text></a-box>

                <a-plane width="1.4" height="0.12" color="#11151a" position="0.3 -0.75 0"></a-plane>
                <a-text value="Defensive" position="-0.35 -0.75 0.01" color="#3498db" scale="0.4 0.4 0.4"></a-text>
                <a-text value="DEFENSE:" position="-0.35 -0.9 0" color="#bdc3c7" scale="0.4 0.4 0.4"></a-text>
                <a-text id="attr-def" value="5" position="0.5 -0.9 0" color="#FFF" scale="0.4 0.4 0.4" align="right"></a-text>
                <a-box class="interativo" btn-atributo="tipo: defesa" width="0.08" height="0.08" depth="0.01" color="#3498db" position="0.8 -0.9 0"><a-text value="+" position="0 0 0.01" scale="0.4 0.4 0.4" align="center"></a-text></a-box>

                <a-plane width="1.4" height="0.15" color="#151a21" position="0.3 -1.2 0"></a-plane>
                <a-text value="Available Points:" position="-0.35 -1.2 0.01" color="#f1c40f" scale="0.4 0.4 0.4"></a-text>
                <a-text id="attr-pts" value="0" position="0.9 -1.2 0.01" color="#f1c40f" scale="0.5 0.5 0.5" align="right"></a-text>
            </a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
