    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; user-select: none; -webkit-user-select: none;}
        #ui-layer { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 15, 20, 0.95); z-index: 9999999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: sans-serif; pointer-events: all !important; } 
        .menu-box { background: #2c3e50; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 320px; pointer-events: auto; } 
        .menu-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; font-size: 1rem;} 
        .btn { padding: 12px 20px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; margin: 5px 0; width: 100%; color: white; transition: 0.2s;} 
        .btn:hover { transform: scale(1.02); }
        .btn:active { transform: scale(0.98); opacity: 0.8; }
        .btn-green { background: #27ae60; } .btn-blue { background: #2980b9; } .btn-orange { background: #d35400; } 
        .btn-purple { background: #8e44ad; } .btn-purple:hover { background: #9b59b6; }

        body.menu-aberto .a-canvas { pointer-events: none !important; }
        #crosshair { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 6px; height: 6px; background: rgba(255,255,255,0.8); border-radius: 50%; z-index: 1000; pointer-events: none;}

        /* INTERFACE MOBILE */
        #mobile-ui { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1000; pointer-events: none; display: none;}
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px; background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; border: 2px solid rgba(255,255,255,0.3); touch-action: none;}
        #joystick-stick { position: absolute; top: 40px; left: 40px; width: 50px; height: 50px; background: rgba(241, 196, 15, 0.8); border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; transition: transform 0.05s ease-out;}
        #action-buttons { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; align-items: flex-end;}
        .hud-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(44, 62, 80, 0.8); border: 2px solid #bdc3c7; color: white; font-size: 1.5rem; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-weight: bold; touch-action: none; user-select: none; pointer-events: auto;}
        .hud-btn:active { background: #f1c40f; color: #111; transform: scale(0.95); }
        #btn-atacar { width: 80px; height: 80px; background: rgba(192, 57, 43, 0.8); border-color: #e74c3c; font-size: 2rem; margin-top: 10px;}
        .menu-top-right { position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; pointer-events: auto;}

            'Espada Grande': { categoria: 'Espada', danoBonus: 15, defesaBonus: -2, distancia: 4.0, modeloGlb: '#modelo-espada-grande', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.1 0.1 0.1', rotInv: '45 45 0', posInv: '0 0 0.05', visualDir: '<a-cylinder color="#333" radius="0.03" height="0.2" position="0 0 0"></a-cylinder><a-box color="#555" width="0.3" height="0.06" depth="0.06" position="0 0.1 0"></a-box><a-box color="#999" width="0.1" height="1.2" depth="0.02" position="0 0.7 0"></a-box>', visualEsq: '' },
            'Luva de Boxe': { categoria: 'Luva', danoBonus: 3, defesaBonus: 2, distancia: 2.0, modeloGlb: '', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.1 0.1 0.1', rotInv: '0 0 0', posInv: '0 0 0.05', visualDir: '<a-sphere color="#cc0000" radius="0.15" position="0 0.1 0"></a-sphere>', visualEsq: '<a-sphere color="#cc0000" radius="0.15" position="0 0.1 0"></a-sphere>' },
            'Varinha': { categoria: 'Varinha', danoBonus: 10, defesaBonus: 0, distancia: 15.0, modeloGlb: '', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.1 0.1 0.1', rotInv: '0 0 0', posInv: '0 0 0.05', visualDir: '<a-cylinder color="#5C4033" radius="0.015" height="0.4" position="0 0.2 0"></a-cylinder><a-sphere color="#00FFFF" radius="0.04" position="0 0.4 0" material="emissive: #00FFFF; emissiveIntensity: 0.8"></a-sphere>', visualEsq: '' },
            'Arco': { categoria: 'Arco', danoBonus: 12, defesaBonus: 0, distancia: 20.0, modeloGlb: '#modelo-arco', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.1 0.1 0.1', rotInv: '45 45 0', posInv: '0 0 0.05', visualDir: '', visualEsq: 'ARCO_ESPECIAL' },
            'Shuriken': { categoria: 'Shuriken', danoBonus: 5, defesaBonus: 0, distancia: 10.0, modeloGlb: '', escalaMao: '1 1 1', rotMao: '0 0 0', posMao: '0 0 0', escalaInv: '0.1 0.1 0.1', rotInv: '0 0 0', posInv: '0 0 0.05', visualDir: '<a-box color="#555" width="0.15" height="0.01" depth="0.15" position="0 0.05 0" rotation="0 0 0"></a-box><a-box color="#555" width="0.15" height="0.01" depth="0.15" position="0 0.05 0" rotation="0 45 0"></a-box>', visualEsq: '' },
            'Escudo de Madeira': { categoria: 'Escudo', defesaBonus: 5, modeloGlb: '', escalaInv: '0.15 0.15 0.15', rotInv: '0 0 0', posInv: '0 0 0.05', visualDir: '', visualEsq: '<a-box color="#8B4513" width="0.4" height="0.5" depth="0.05" position="0 0.1 0" rotation="-90 0 0"><a-box color="#A0522D" width="0.42" height="0.52" depth="0.02" position="0 0 -0.01"></a-box></a-box>' },
            'Escudo de Ferro': { categoria: 'Escudo', defesaBonus: 12, modeloGlb: '', escalaInv: '0.15 0.15 0.15', rotInv: '0 0 0', posInv: '0 0 0.05', visualDir: '', visualEsq: '<a-box color="#7f8c8d" width="0.45" height="0.55" depth="0.05" position="0 0.1 0" rotation="-90 0 0"><a-box color="#bdc3c7" width="0.47" height="0.57" depth="0.02" position="0 0 -0.01"></a-box></a-box>' }
        };

        // ==========================================
        // FUNÇÕES HOISTED
        // ==========================================
        window.salvarJogoNuvem = function() { 
            if (!window.currentUser) return; 
            firestoreDB.collection("jogadores").doc(window.currentUser.uid).set(window.playerState).catch(e => console.error(e)); 
        };

        window.atualizarArmaVisual = function() { 
            let containerDir = document.querySelector('#arma-visual-dir'); let containerEsq = document.querySelector('#arma-visual-esq'); let containerPC = document.querySelector('#arma-visual-pc'); let escudoPC = document.querySelector('#escudo-visual-pc'); 
            if(!containerDir || !containerEsq || !containerPC || !escudoPC) return; 
            
            containerDir.innerHTML = ''; containerEsq.innerHTML = ''; containerPC.innerHTML = ''; escudoPC.innerHTML = ''; 
            
            let armaStats = window.bancoDeArmas[window.playerState.armaEquipada]; 
            if (armaStats) {
                let htmlArma = '';
                if (armaStats.modeloGlb && armaStats.modeloGlb !== '') { 
                    let glbPath = armaStats.modeloGlb.startsWith('#') ? armaStats.modeloGlb : `url(${armaStats.modeloGlb})`;
                    htmlArma = `<a-entity gltf-model="${glbPath}" scale="${armaStats.escalaMao || '1 1 1'}" rotation="${armaStats.rotMao || '0 0 0'}" position="${armaStats.posMao || '0 0 0'}" anti-piscar></a-entity>`; 
                } 
                else if (armaStats.visualDir) { htmlArma = armaStats.visualDir; }
                
                containerDir.innerHTML = htmlArma; containerPC.innerHTML = htmlArma;
                
                // Se for luva de boxe/garras, bota na mão esquerda também!
                if(armaStats.categoria === 'Luva' && !window.playerState.escudoEquipado) {
                    containerEsq.innerHTML = htmlArma;
                }
            }

            let escudoStats = window.bancoDeArmas[window.playerState.nomeEscudo];
            if (window.playerState.escudoEquipado && escudoStats && (!armaStats || armaStats.categoria !== 'Arco')) { 
                let htmlEscudo = '';
                if(escudoStats.modeloGlb && escudoStats.modeloGlb !== '') { 
                    let glbPath = escudoStats.modeloGlb.startsWith('#') ? escudoStats.modeloGlb : `url(${escudoStats.modeloGlb})`;
                    htmlEscudo = `<a-entity gltf-model="${glbPath}" scale="${escudoStats.escalaMao || '1 1 1'}" rotation="${escudoStats.rotMao || '0 0 0'}" position="${escudoStats.posMao || '0 0 0'}" anti-piscar></a-entity>`; 
                } 
                else if (escudoStats.visualEsq) { htmlEscudo = escudoStats.visualEsq; }
                containerEsq.innerHTML = htmlEscudo; escudoPC.innerHTML = htmlEscudo;
            } else if (armaStats && armaStats.categoria === 'Arco') {
                let rot = { rotX: 180, rotY: 90, rotZ: 90 }; 
                let htmlArco = `<a-entity rotation="${rot.rotX} ${rot.rotY} ${rot.rotZ}"><a-torus color="#8B4513" radius="0.3" radius-tubular="0.015" arc="180" rotation="0 0 90"></a-torus><a-cylinder color="#DDDDDD" radius="0.002" height="0.6" rotation="0 0 0"></a-cylinder></a-entity>`;
                containerEsq.innerHTML = htmlArco; escudoPC.innerHTML = htmlArco;
            }
        };

        window.tocarSom = function(idSom) {
            let som = document.getElementById(idSom);
            if (som && som.play) { 
                som.currentTime = 0; 
                som.play().catch(e => console.log(e)); 
            }
        };

        window.receberDanoJogador = function(danoBruto) {
            if (!window.GAME_STARTED || !window.playerState.vivo || window.playerState.invulneravel) return;

            let armaStats = window.bancoDeArmas[window.playerState.armaEquipada];
            let escudoStats = window.bancoDeArmas[window.playerState.nomeEscudo];
            let defesaTotal = window.playerState.defesa + (armaStats ? armaStats.defesaBonus : 0) + (window.playerState.escudoEquipado && escudoStats ? escudoStats.defesaBonus : 0);
            
            let danoFinal = Math.max(1, danoBruto - Math.floor(defesaTotal / 2));
            window.playerState.hpAtual -= danoFinal;
            window.tocarSom('snd-hit');

            let telaDano = document.querySelector('#dano-tela');
            if (telaDano) {
                telaDano.setAttribute('visible', 'true');
                setTimeout(() => telaDano.setAttribute('visible', 'false'), 200);
            }

            if (window.playerState.hpAtual <= 0) {
                window.playerState.hpAtual = 0;
                window.playerState.vivo = false;
                
                let aviso = document.querySelector('#texto-central');
                if(aviso) { aviso.setAttribute('value', 'VOCÊ MORREU!'); aviso.setAttribute('color', '#ff0000'); aviso.setAttribute('visible', 'true'); }

                setTimeout(() => {
                    let resp = window.playerState.ultimoRespawn;
                    let rig = document.querySelector('#rig');
                    if (rig && resp) { rig.object3D.position.set(resp.x, resp.y, resp.z); } 
                    else if (rig) { rig.object3D.position.set(0, 0, 0); }
                    
                    window.playerState.hpAtual = window.playerState.hpMax;
                    window.playerState.vivo = true;
                    window.playerState.invulneravel = true;
                    if(aviso) aviso.setAttribute('visible', 'false');
                    
                    window.atualizarUI();
                    window.salvarJogoNuvem();
                    
                    setTimeout(() => { window.playerState.invulneravel = false; }, 3000);
                }, 3000);
            }
            window.atualizarUI();
        };

        window.atualizarUI = function() { 
            let elsHtml = ['#txt-nivel-hud', '#txt-status-hud', '#hp-wrapper', '#mp-wrapper', '#txt-arma-hud', '#attr-nivel-classe', '#attr-hp-txt', '#attr-mp-txt', '#attr-hpmax', '#attr-mpmax', '#attr-atk', '#attr-def', '#attr-agi', '#attr-exp', '#attr-nextexp', '#attr-pts', '#inv-total-forca', '#inv-total-defesa', '#inv-total-ouro', '#tt-flechas', '#tt-shurikens', '#attr-slot-1', '#attr-slot-2']; 
            for(let i=0; i<elsHtml.length; i++) { if(!document.querySelector(elsHtml[i])) return; } 
            
            document.querySelector('#txt-nivel-hud').setAttribute('value', `Nivel: ${window.playerState.nivel} | XP: ${window.playerState.xp}/${window.playerState.xpProxNivel}`); 
            document.querySelector('#txt-status-hud').setAttribute('value', `HP: ${window.playerState.hpAtual}/${window.playerState.hpMax}   |   MP: ${window.playerState.mpAtual}/${window.playerState.mpMax}`); 
            let hpScale = Math.max(0, window.playerState.hpAtual / window.playerState.hpMax); document.querySelector('#hp-wrapper').setAttribute('scale', `${hpScale} 1 1`); 
            let mpScale = Math.max(0, window.playerState.mpAtual / window.playerState.mpMax); document.querySelector('#mp-wrapper').setAttribute('scale', `${mpScale} 1 1`); 
            
            let armaStats = window.bancoDeArmas[window.playerState.armaEquipada]; 
            let escudoStats = window.bancoDeArmas[window.playerState.nomeEscudo];
            
            let strEquip = window.playerState.armaEquipada;
            if(window.playerState.escudoEquipado && window.playerState.nomeEscudo) strEquip += ' + ' + window.playerState.nomeEscudo;
            document.querySelector('#txt-arma-hud').setAttribute('value', `Equipado: ${strEquip}`); 
            
            if (window.GAME_MODE === 'PC') { let r = document.querySelector('#rig'); if(r && r.hasAttribute('movement-controls')) r.setAttribute('movement-controls', 'speed', 0.1 + (window.playerState.velocidade * 0.01)); }
            
            let forcaTotal = window.playerState.forca + (armaStats ? armaStats.danoBonus : 0); 
            let defesaTotal = window.playerState.defesa + (armaStats ? armaStats.defesaBonus : 0) + (window.playerState.escudoEquipado && escudoStats ? escudoStats.defesaBonus : 0); 
            
            let els = { 
                '#attr-nivel-classe': `Lv ${window.playerState.nivel} Aventureiro`, '#attr-hp-txt': `HP: ${window.playerState.hpAtual}/${window.playerState.hpMax}`, '#attr-mp-txt': `MP: ${window.playerState.mpAtual}/${window.playerState.mpMax}`, '#attr-hpmax': window.playerState.hpMax, '#attr-mpmax': window.playerState.mpMax, '#attr-atk': forcaTotal, '#attr-def': defesaTotal, '#attr-agi': window.playerState.velocidade, '#attr-exp': window.playerState.xp, '#attr-nextexp': window.playerState.xpProxNivel, '#attr-pts': window.playerState.pontos, '#inv-total-forca': forcaTotal, '#inv-total-defesa': defesaTotal, '#inv-total-ouro': window.playerState.ouro, '#tt-flechas': window.playerState.flechas, '#tt-shurikens': window.playerState.shurikens, '#attr-slot-1': window.playerState.armaEquipada 
            }; 
            for(let id in els) { let e = document.querySelector(id); if(e) e.setAttribute('value', els[id]); } 
            
            let elSlot2 = document.querySelector('#attr-slot-2'); 
            if(elSlot2) { 
                if(window.playerState.escudoEquipado && window.playerState.nomeEscudo) elSlot2.setAttribute('value', window.playerState.nomeEscudo); 
                else if(armaStats && armaStats.categoria === 'Arco') elSlot2.setAttribute('value', '2 Maos (Arco)'); 
                else elSlot2.setAttribute('value', 'Vazio'); 
            } 
            window.atualizarArmaVisual(); 
            window.salvarJogoNuvem(); 
        };

        window.renderizarInventario = function() {
            let listaArmas = Object.keys(window.bancoDeArmas).filter(k => k !== 'Desarmado'); 
            let gridContainer = document.querySelector('#inv-grid-container'); 
            if(!gridContainer) return;
            
            let cols = 6; let startX = -0.75; let startY = 0.35; let gap = 0.3; 
            let htmlSlots = "";
            
            for (let i = 0; i < 18; i++) { 
                let col = i % cols; let row = Math.floor(i / cols); 
                
                let posX = startX + (col * gap);
                let posY = startY - (row * gap);
                
                htmlSlots += `<a-box class="interativo" position="${posX} ${posY} 0.02" width="0.25" height="0.25" depth="0.02" color="#2b1b12" ${i < listaArmas.length ? `slot-interativo="item: ${listaArmas[i]}"` : ''}>
                    <a-plane width="0.23" height="0.23" color="#f19e20" position="0 0 0.011"></a-plane>
                    <a-plane width="0.21" height="0.21" color="#1e110b" position="0 0 0.012"></a-plane>`;
                
                if (i < listaArmas.length) { 
                    let nomeArma = listaArmas[i]; 
                    let armaStats = window.bancoDeArmas[nomeArma]; 
                    if(armaStats && armaStats.modeloGlb && armaStats.modeloGlb !== '') { 
                        let glbPath = armaStats.modeloGlb.startsWith('#') ? armaStats.modeloGlb : `url(${armaStats.modeloGlb})`;
                        htmlSlots += `<a-entity gltf-model="${glbPath}" scale="${armaStats.escalaInv || '0.15 0.15 0.15'}" rotation="${armaStats.rotInv || '0 0 0'}" position="${armaStats.posInv || '0 0 0.05'}"></a-entity>`;
                    } else { 
                        htmlSlots += `<a-text value="${nomeArma}" align="center" width="1" position="0 0 0.02" color="#FFF"></a-text>`;
                    } 
                } 
                htmlSlots += `</a-box>`;
            } 
            gridContainer.innerHTML = htmlSlots;
        };

        window.posicionarMenuDeFrente = function(menuId) {
            let menu = document.querySelector(menuId);
            let camera = document.querySelector('[camera]');
            let cena = document.querySelector('a-scene');
            if(!menu || !camera || !cena) return;

            if(menu.parentNode !== cena) { cena.appendChild(menu); }

            let camPos = new THREE.Vector3(); 
            camera.object3D.getWorldPosition(camPos); 
            
            let camQuat = new THREE.Quaternion();
            camera.object3D.getWorldQuaternion(camQuat);
            let camRotY = new THREE.Euler().setFromQuaternion(camQuat, 'YXZ').y;
            
            let distancia = 1.5; 
            let spawnX = camPos.x - Math.sin(camRotY) * distancia;
            let spawnZ = camPos.z - Math.cos(camRotY) * distancia;

            menu.object3D.position.set(spawnX, camPos.y - 0.2, spawnZ);
            menu.object3D.rotation.set(0, camRotY, 0);
            
            if(menuId === '#caixa-dialogo') menu.setAttribute('scale', '1 1 1');
            else menu.setAttribute('scale', '0.65 0.65 0.65');
        };

        window.toggleMenu = function(tipo) {
            let menuInv = document.querySelector('#menu-inventario-novo'); 
            let menuAtrib = document.querySelector('#menu-atributos');
            
            if (tipo === 'inv') {

        // Combate Clássico (Mouse/Touch)
        window.realizarAtaque = function() {
            if(!window.GAME_STARTED || !window.playerState.vivo || window.npcAtivo || window.invAberto || window.atribAberto) return;
            let armaStats = window.bancoDeArmas[window.playerState.armaEquipada] || window.bancoDeArmas['Desarmado']; 

            window.tocarSom('snd-sword');
            let pcWeapon = document.querySelector('#arma-visual-pc'); 
            if(pcWeapon) { pcWeapon.removeAttribute('animation'); pcWeapon.setAttribute('animation', 'property: rotation; to: -60 45 -45; dur: 150; dir: alternate; loop: 1'); setTimeout(() => { if(pcWeapon) pcWeapon.setAttribute('rotation', '-90 0 0'); }, 300); }
            
            let cameraObj = document.querySelector('[camera]'); if(!cameraObj) return;
            let posCamera = new THREE.Vector3(); let direcao = new THREE.Vector3(0, 0, -1); 
            cameraObj.object3D.getWorldPosition(posCamera); 
            let camQuat = new THREE.Quaternion(); cameraObj.object3D.getWorldQuaternion(camQuat);
            direcao.applyQuaternion(camQuat);
            
            let dirCam2D = new THREE.Vector2(direcao.x, direcao.z); 
            if (dirCam2D.lengthSq() > 0.001) dirCam2D.normalize();
            
            let alcanceArma = armaStats.distancia || 3.0; 

            let inimigosEls = document.querySelectorAll('[sistema-inimigo-sync]');
            inimigosEls.forEach(inimigoEl => { 
                if(!inimigoEl.object3D) return; 
                let syncComp = inimigoEl.components['sistema-inimigo-sync']; 
                if(syncComp && syncComp.hpAtual <= 0) return;

                let posInimigo = new THREE.Vector3(); 
                inimigoEl.object3D.getWorldPosition(posInimigo); 
                
                let dx = posInimigo.x - posCamera.x; let dz = posInimigo.z - posCamera.z;
                let dist2D = Math.hypot(dx, dz);
                
                let escX = 1.0;
                let colisor = inimigoEl.querySelector('.colisao-inimigo');
                if(colisor && colisor.object3D) { escX = colisor.object3D.scale.x; }
                let raioColisao = 1.2 * escX;
                
                if (dist2D <= (alcanceArma + raioColisao)) { 
                    let dirInimigo2D = new THREE.Vector2(dx, dz); 
                    if (dist2D > 0.001) dirInimigo2D.normalize();
                    let anguloAcerto = dirCam2D.dot(dirInimigo2D); 
                    
                    if (anguloAcerto > 0.0) { 
                        if(syncComp) { syncComp.receberDano(Math.floor((window.playerState.forca + armaStats.danoBonus) * 1.5), armaStats.categoria); }
                    }
                } 
            });
        };

        // ==========================================
        // CONTROLES VR AVANÇADOS (Hitbox, Magia, Bow)
        // ==========================================
        AFRAME.registerComponent('vr-hand-logic', {
            schema: { side: {type: 'string'} },
            init: function() {
                this.velocity = new THREE.Vector3();
                this.lastPosition = new THREE.Vector3();
                this.triggerPressed = false;
                this.hitEnemies = {}; // Guarda quem já apanhou nesse "balanço" de espada
                this.cooldownMagia = 0;
                this.pullingBow = false;
                this.pullStartPos = new THREE.Vector3();

                this.el.addEventListener('triggerdown', () => {
                    this.triggerPressed = true;
                    let armaStats = window.bancoDeArmas[window.playerState.armaEquipada];
                    
                    // Se estiver com o arco e for a mão direita
                    if (armaStats && armaStats.categoria === 'Arco' && this.data.side === 'right') {
                        this.pullingBow = true;
                        this.el.object3D.getWorldPosition(this.pullStartPos);
                    }
                });

                this.el.addEventListener('triggerup', () => {
                    this.triggerPressed = false;
                    let armaStats = window.bancoDeArmas[window.playerState.armaEquipada];
                    
                    // Soltar Shuriken
                    if (armaStats && armaStats.categoria === 'Shuriken' && this.data.side === 'right') {
                        if (window.playerState.shurikens > 0) {
                            window.playerState.shurikens--;
                            window.atualizarUI();
                            let vel = this.velocity.clone().multiplyScalar(2.0); // Amplifica a força do braço
                            this.atirarProjetil(vel, armaStats.danoBonus, true);
                        }
                    }
                    
                    // Soltar Flecha
                    if (this.pullingBow && this.data.side === 'right') {
                        this.pullingBow = false;
                        if (window.playerState.flechas > 0) {
                            window.playerState.flechas--;
                            window.atualizarUI();
                            
                            let currentPos = new THREE.Vector3();
                            this.el.object3D.getWorldPosition(currentPos);
                            let pullDist = this.pullStartPos.distanceTo(currentPos);
                            
                            let maoEsq = document.querySelector('#mao-esquerda');
                            let bowDir = new THREE.Vector3(0,0,-1);
                            if(maoEsq) {
                                let quat = new THREE.Quaternion();
                                maoEsq.object3D.getWorldQuaternion(quat);
                                bowDir.applyQuaternion(quat);
                            }
                            
                            // Velocidade depende do quanto puxou para trás
                            let velMult = Math.max(15, pullDist * 60); 
                            this.atirarProjetil(bowDir.multiplyScalar(velMult), armaStats.danoBonus, true);
                        }
                    }
                });
            },
            atirarProjetil: function(velVector, danoAdd, isGravity) {
                let proj = document.createElement('a-entity');
                let pos = new THREE.Vector3();
                this.el.object3D.getWorldPosition(pos);
                proj.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
                
                let forcaTotal = window.playerState.forca + danoAdd;
                proj.setAttribute('projetil-fisico', `velocidade: ${velVector.x} ${velVector.y} ${velVector.z}; dano: ${forcaTotal}; gravidade: ${isGravity}`);
                
                proj.innerHTML = '<a-sphere radius="0.05" color="#fff" material="emissive: #fff"></a-sphere>';
                document.querySelector('a-scene').appendChild(proj);
                window.tocarSom('snd-sword'); // Você pode adicionar um 'snd-magic' se quiser
            },
            tick: function(time, timeDelta) {
                if (!window.GAME_STARTED || window.GAME_MODE !== 'VR' || !window.playerState.vivo) return;
                let dt = timeDelta / 1000;
                if (dt === 0) return;

                let pos = new THREE.Vector3();
                this.el.object3D.getWorldPosition(pos);
                this.velocity.subVectors(pos, this.lastPosition).divideScalar(dt);
                this.lastPosition.copy(pos);

                let arma = window.bancoDeArmas[window.playerState.armaEquipada];
                let escudo = window.playerState.escudoEquipado ? window.bancoDeArmas[window.playerState.nomeEscudo] : null;

                let isMeleeRight = this.data.side === 'right' && arma && ['Espada', 'Luva'].includes(arma.categoria);
                let isMeleeLeft = this.data.side === 'left' && ( (arma && arma.categoria === 'Luva' && !escudo) || escudo );
                
                // 1. COLISÃO FÍSICA MELEE E RESET DE HIT
                if (isMeleeRight || isMeleeLeft) {
                    let inimigos = document.querySelectorAll('[sistema-inimigo-sync]');
                    inimigos.forEach(ini => {
                        let sync = ini.components['sistema-inimigo-sync'];
                        if (!sync || sync.hpAtual <= 0) return;
                        
                        let iniPos = new THREE.Vector3();
                        ini.object3D.getWorldPosition(iniPos);
                        
                        let colisor = ini.querySelector('.colisao-inimigo');
                        let escX = 1.0; if(colisor && colisor.object3D) escX = colisor.object3D.scale.x;
                        let radius = 1.2 * escX;

                        let dist = pos.distanceTo(iniPos);
                        
                        if (dist < radius + 0.4) { // Tocou
                            if (!this.hitEnemies[ini.dataset.id]) {
                                this.hitEnemies[ini.dataset.id] = true; // Impede ficar dando dano parado dentro
                                
                                let dano = window.playerState.forca;
                                if (this.data.side === 'right' && arma) dano += arma.danoBonus;
                                if (this.data.side === 'left' && escudo) dano += (escudo.defesaBonus || 5); 
                                sync.receberDano(dano, arma ? arma.categoria : 'Melee');
                            }
                        } else if (dist > radius + 0.8) {
                            this.hitEnemies[ini.dataset.id] = false; // Tirou a arma, pode bater de novo
                        }
                    });
                }

                // 2. DEFESA E RICOCHETE DE PROJÉTEIS
                let projeteisInimigos = document.querySelectorAll('[projetil-inimigo-fisico]');
                projeteisInimigos.forEach(proj => {
                    let projPos = new THREE.Vector3();
                    proj.object3D.getWorldPosition(projPos);
                    
                    if (pos.distanceTo(projPos) < 0.6) {
                        let speed = this.velocity.length();
                        
                        // Espada sempre destrói. Escudo parado destrói.
                        if ((this.data.side === 'right' && arma && arma.categoria === 'Espada') || 
                            (this.data.side === 'left' && escudo && speed < 1.5)) {
                            proj.remove();
                            window.tocarSom('snd-sword'); 
                        }

                            if (visual.dataset.currentModel !== newModel) { 
                                visual.dataset.currentModel = newModel; 
                                let glbPath = newModel.startsWith('#') ? newModel : `url(${newModel})`;
                                visual.setAttribute('gltf-model', glbPath); 
                                let holograma = el.querySelector('a-box[color="#f1c40f"], a-box[color="#e74c3c"]'); if(holograma) { holograma.setAttribute('visible', 'true'); holograma.setAttribute('color', '#f1c40f'); } 
                            }
                        }
                        
                        let colisor = el.querySelector('.colisao-inimigo');
                        if(colisor) {
                            colisor.setAttribute('scale', `${escX} ${escY} ${escZ}`);
                            colisor.setAttribute('position', `0 ${1.25 * escY} 0`);
                        }
                        let hpText = el.querySelector('.hp-texto');
                        if(hpText) {
                            hpText.setAttribute('position', `-0.4 ${2.2 * escY} 0`);
                        }
                    }
                });

                this.db.ref('cenario_inimigos').on('child_removed', (snapshot) => { let el = document.querySelector(`[data-id="${snapshot.key}"]`); if (el && el.parentNode) { el.removeAttribute('sistema-inimigo-sync'); el.parentNode.removeChild(el); } });
            }
        });

        AFRAME.registerComponent('gerenciador-npcs', {
            init: function() {
                this.db = realtimeDB;
                this.db.ref('cenario_npcs').on('child_added', (snapshot) => {
                    let id = snapshot.key; let data = snapshot.val();
                    if (!data || document.querySelector(`[data-npc-id="${id}"]`)) return;

                    let el = document.createElement('a-entity'); this.el.appendChild(el); el.dataset.npcId = id;
                    if (data.pos) el.setAttribute('position', `${data.pos.x} ${data.pos.y} ${data.pos.z}`); el.setAttribute('shadow', '');

                    let escX = data.escala ? data.escala.x : 1; let escY = data.escala ? data.escala.y : 1; let escZ = data.escala ? data.escala.z : 1;

                    let colisor = document.createElement('a-cylinder'); el.appendChild(colisor);
                    colisor.setAttribute('radius', '0.8'); colisor.setAttribute('height', '2.5'); colisor.setAttribute('position', `0 ${1.25 * escY} 0`); colisor.setAttribute('scale', `${escX} ${escY} ${escZ}`); colisor.setAttribute('opacity', '0'); colisor.classList.add('interativo'); colisor.npcData = data; colisor.setAttribute('sistema-npc-interacao', ''); 

                    let holograma = document.createElement('a-box'); el.appendChild(holograma); holograma.setAttribute('color', '#f1c40f'); holograma.setAttribute('opacity', '0.5'); holograma.setAttribute('scale', '0.6 1.8 0.6'); holograma.setAttribute('position', '0 0.9 0'); holograma.className = 'npc-holograma'; 
                    let fallback = document.createElement('a-entity'); el.appendChild(fallback); fallback.innerHTML = `<a-cylinder color="#3498db" radius="0.3" height="1.6" position="0 0.8 0"></a-cylinder><a-sphere color="#f1c40f" radius="0.25" position="0 1.8 0"></a-sphere>`; 

                    let visual = document.createElement('a-entity'); el.appendChild(visual); visual.classList.add('modelo-visual');
                    visual.setAttribute('scale', `${escX} ${escY} ${escZ}`);

                    let modelSrc = data.modeloGlb && data.modeloGlb.trim() !== '' ? data.modeloGlb : ''; visual.dataset.currentModel = modelSrc;

                    if (modelSrc !== '') {
                        let glbPath = modelSrc.startsWith('#') ? modelSrc : `url(${modelSrc})`;
                        visual.setAttribute('gltf-model', glbPath); visual.setAttribute('anti-piscar', '');
                        visual.addEventListener('model-loaded', () => { holograma.setAttribute('visible', 'false'); fallback.setAttribute('visible', 'false'); });
                        visual.addEventListener('model-error', () => { holograma.setAttribute('color', '#e74c3c'); holograma.setAttribute('opacity', '0.8'); fallback.innerHTML = `<a-cylinder color="#e74c3c" radius="0.4" height="1.8" position="0 0.9 0" opacity="0.8"></a-cylinder>`; fallback.setAttribute('visible', 'true'); });
                    }

                    let nomeTag = document.createElement('a-text'); el.appendChild(nomeTag); nomeTag.className = 'npc-nome-tag'; nomeTag.setAttribute('value', data.nome || 'NPC'); nomeTag.setAttribute('align', 'center'); nomeTag.setAttribute('position', `0 ${2.4 * escY} 0`); nomeTag.setAttribute('color', '#f1c40f'); nomeTag.setAttribute('scale', '0.6 0.6 0.6'); nomeTag.setAttribute('side', 'double'); 
                });

                this.db.ref('cenario_npcs').on('child_changed', (snapshot) => {
                    let id = snapshot.key; let data = snapshot.val(); let el = document.querySelector(`[data-npc-id="${id}"]`);
                    if (el) {
                        el.setAttribute('position', `${data.pos.x} ${data.pos.y} ${data.pos.z}`);
                        let escX = data.escala ? data.escala.x : 1; let escY = data.escala ? data.escala.y : 1; let escZ = data.escala ? data.escala.z : 1;
                        
                        let visual = el.querySelector('.modelo-visual');
                        if(visual) {
                            visual.setAttribute('scale', `${escX} ${escY} ${escZ}`);
                            let newModel = data.modeloGlb && data.modeloGlb.trim() !== '' ? data.modeloGlb : '';
                            if (visual.dataset.currentModel !== newModel) { 
                                visual.dataset.currentModel = newModel; 
                                let glbPath = newModel.startsWith('#') ? newModel : `url(${newModel})`;
                                visual.setAttribute('gltf-model', glbPath); 
                                let holograma = el.querySelector('.npc-holograma'); if(holograma) { holograma.setAttribute('visible', 'true'); holograma.setAttribute('color', '#f1c40f'); } 
                            }
                        }
                        let colisor = el.querySelector('a-cylinder.interativo'); 
                        if (colisor) {
                            colisor.npcData = data; 
                            colisor.setAttribute('scale', `${escX} ${escY} ${escZ}`);
                            colisor.setAttribute('position', `0 ${1.25 * escY} 0`);
                        } 
                        let nomeTag = el.querySelector('.npc-nome-tag'); 
                        if (nomeTag) { 
                            nomeTag.setAttribute('value', data.nome || 'NPC'); 
                            nomeTag.setAttribute('position', `0 ${2.4 * escY} 0`);
                        }
                    }
                });

                this.db.ref('cenario_npcs').on('child_removed', (snapshot) => { let el = document.querySelector(`[data-npc-id="${snapshot.key}"]`); if (el && el.parentNode) el.parentNode.removeChild(el); });
            }
        });

        AFRAME.registerComponent('sistema-npc-interacao', {
            init: function() {
                this.tocarAnimacao = (nomeAnimacao) => {
                    if(!nomeAnimacao) return; let visual = this.el.parentNode.querySelector('.modelo-visual');
                    if (visual && visual.hasAttribute('gltf-model')) { visual.removeAttribute('animation-mixer'); setTimeout(() => { if(visual && visual.parentNode) visual.setAttribute('animation-mixer', `clip: ${nomeAnimacao}; loop: repeat; crossFadeDuration: 0.2`); }, 20); }
                };

                this.el.parentNode.addEventListener('model-loaded', () => { if(this.el.npcData && this.el.npcData.animParado) this.tocarAnimacao(this.el.npcData.animParado); });
                this.el.addEventListener('mouseenter', () => { let tag = this.el.parentNode.querySelector('.npc-nome-tag'); if(tag) tag.setAttribute('color', '#00ffcc'); });
                this.el.addEventListener('mouseleave', () => { let tag = this.el.parentNode.querySelector('.npc-nome-tag'); if(tag) tag.setAttribute('color', '#f1c40f'); });

                this.el.addEventListener('click', () => {
                    if (!window.GAME_STARTED || !window.playerState.vivo) return;
                    let cameraObj = document.querySelector('[camera]'); if(!cameraObj) return; let posPlayer = new THREE.Vector3(); cameraObj.object3D.getWorldPosition(posPlayer); let posNPC = new THREE.Vector3(); this.el.parentNode.object3D.getWorldPosition(posNPC);
                    
                    let data = this.el.npcData; if (!data) return;
                    let escX = data.escala ? data.escala.x : 1;
                    
                    let dist2D = Math.hypot(posPlayer.x - posNPC.x, posPlayer.z - posNPC.z); 
                    if (dist2D > (3.0 + escX * 1.5)) return; 
                    
                    if (data.animFalando) { this.tocarAnimacao(data.animFalando); setTimeout(() => { if(data.animParado) this.tocarAnimacao(data.animParado); }, 8000); }
                    window.abrirDialogoNPC(data);
                });
            }
        });

        AFRAME.registerComponent('slot-interativo', { 
            schema: { item: {type: 'string'} }, 
            init: function() { 
                let painelTooltip = document.querySelector('#inv-tooltip'); let txtNome = document.querySelector('#tt-nome'); let txtForca = document.querySelector('#tt-forca'); let txtDefesa = document.querySelector('#tt-defesa'); let boxEquipar = document.querySelector('#tt-acao'); 
                
                this.el.addEventListener('mouseenter', () => { 
                    this.el.children[0].setAttribute('color', '#FFD700'); let itemAlvo = window.bancoDeArmas[this.data.item]; let itemEquipado = window.bancoDeArmas[window.playerState.armaEquipada]; if(!itemAlvo) return; 
                    let diffForca = itemAlvo.danoBonus - (itemEquipado ? itemEquipado.danoBonus : 0); let diffDefesa = itemAlvo.defesaBonus - (itemEquipado ? itemEquipado.defesaBonus : 0); 
                    if(painelTooltip) painelTooltip.setAttribute('visible', 'true'); if(txtNome) txtNome.setAttribute('value', this.data.item); 
                    if(txtForca) { txtForca.setAttribute('value', `Dano Item: ${itemAlvo.danoBonus}${diffForca !== 0 ? (diffForca>0?` (+${diffForca})`:` (${diffForca})`) : ''}`); txtForca.setAttribute('color', diffForca>0?'#00FF00':(diffForca<0?'#FF4444':'#FFF')); } 
                    if(txtDefesa) { txtDefesa.setAttribute('value', `Defesa Item: ${itemAlvo.defesaBonus}${diffDefesa !== 0 ? (diffDefesa>0?` (+${diffDefesa})`:` (${diffDefesa})`) : ''}`); txtDefesa.setAttribute('color', diffDefesa>0?'#00FF00':(diffDefesa<0?'#FF4444':'#FFF')); } 
                    if(boxEquipar) { let msg = itemAlvo.categoria === 'Escudo' ? (window.playerState.nomeEscudo === this.data.item ? 'EQUIPADO' : '[C] Equipar Escudo') : (window.playerState.armaEquipada === this.data.item ? 'EQUIPADO' : '[C] Equipar Arma'); let cor = (window.playerState.armaEquipada === this.data.item || window.playerState.nomeEscudo === this.data.item) ? '#FFD700' : '#FFF'; boxEquipar.setAttribute('value', msg); boxEquipar.setAttribute('color', cor); } 
                }); 
                this.el.addEventListener('mouseleave', () => { this.el.children[0].setAttribute('color', '#f19e20'); if(painelTooltip) painelTooltip.setAttribute('visible', 'false'); }); 
                
                const equiparFuncao = () => { 
                    let itemAlvo = window.bancoDeArmas[this.data.item]; if(!itemAlvo) return;
                    if(itemAlvo.categoria === 'Escudo') { window.playerState.nomeEscudo = this.data.item; window.playerState.escudoEquipado = true; } else { window.playerState.armaEquipada = this.data.item; }
                    window.atualizarUI(); let aviso = document.querySelector('#texto-central'); if(aviso) { aviso.setAttribute('value', `${this.data.item} Equipado!`); aviso.setAttribute('color', '#00FF00'); aviso.setAttribute('visible', 'true'); setTimeout(() => { if(aviso) aviso.setAttribute('visible', 'false'); }, 1000); } 
                };
                
                this.el.addEventListener('mousedown', equiparFuncao);
                this.el.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); equiparFuncao(); }, {passive: false});
            } 
        });
        
        AFRAME.registerComponent('sistema-jogo', { init: function () { setInterval(() => { if (!window.GAME_STARTED) return; if (window.playerState.vivo && window.playerState.mpAtual < window.playerState.mpMax) { window.playerState.mpAtual = Math.min(window.playerState.mpMax, window.playerState.mpAtual + 5); window.atualizarUI(); } }, 1000); } });
        
        AFRAME.registerComponent('btn-atributo', { 
            schema: { tipo: { type: 'string' } }, 
            init: function () { 
                const upFn = () => { 
                    if (window.playerState.pontos > 0 && window.playerState.vivo) { 
                        window.playerState.pontos--; window.playerState[this.data.tipo]++; this.el.setAttribute('color', '#fff'); 
                        setTimeout(() => { if(this.el) this.el.setAttribute('color', '#4CC3D9'); }, 150); 
                        if (this.data.tipo === 'defesa') { window.playerState.hpMax += 10; window.playerState.hpAtual = window.playerState.hpMax; } 
                        if (this.data.tipo === 'forca') { window.playerState.mpMax += 10; window.playerState.mpAtual = window.playerState.mpMax; } 
                        window.atualizarUI(); 
                    } 
                }; 
                this.el.addEventListener('mousedown', upFn); 
                this.el.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); upFn(); }, {passive: false}); 
            } 
        });
        
        AFRAME.registerComponent('sistema-bau', { init: function() { let aberto = false; this.el.addEventListener('click', () => { if(!aberto) { aberto = true; this.el.setAttribute('color', '#8B4513'); this.el.setAttribute('rotation', '-45 45 0'); window.playerState.flechas += 15; window.playerState.shurikens += 15; window.playerState.ouro += 500; window.playerState.pontos += 3; window.atualizarUI(); let aviso = document.querySelector('#texto-central'); if(aviso) { aviso.setAttribute('value', '+15 Flechas\n+15 Shurikens\n+500 Ouro\n+3 Pontos!'); aviso.setAttribute('color', '#FFD700'); aviso.setAttribute('visible', 'true'); setTimeout(() => { if(aviso) aviso.setAttribute('visible', 'false'); }, 3000); } } }); } });
    }); // Fim do DOMContentLoaded
    </script>
</head>
