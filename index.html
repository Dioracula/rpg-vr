+ window.playerState.mpAtual + '/' + window.playerState.mpMax, '#attr-hpmax': window.playerState.hpMax, '#attr-mpmax': window.playerState.mpMax, '#attr-atk': forcaTotal, '#attr-def': defesaTotal, '#attr-agi': window.playerState.velocidade, '#attr-exp': window.playerState.xp, '#attr-nextexp': window.playerState.xpProxNivel, '#attr-pts': window.playerState.pontos, '#inv-total-forca': forcaTotal, '#inv-total-defesa': defesaTotal, '#inv-total-ouro': window.playerState.ouro, '#tt-flechas': window.playerState.flechas, '#tt-shurikens': window.playerState.shurikens, '#attr-slot-1': window.playerState.armaEquipada }; for(let id in els) { let e = document.querySelector(id); if(e) e.setAttribute('value', els[id]); } let elSlot2 = document.querySelector('#attr-slot-2'); if(elSlot2) { if(window.playerState.escudoEquipado) elSlot2.setAttribute('value', 'Escudo'); else if(armaStats && armaStats.categoria === 'Arco') elSlot2.setAttribute('value', '2 Maos (Arco)'); else if(armaStats && armaStats.visualEsq !== '') elSlot2.setAttribute('value', window.playerState.armaEquipada); else elSlot2.setAttribute('value', 'Vazio'); } atualizarArmaVisual(); window.salvarJogoNuvem(); }

        AFRAME.registerComponent('pc-controles', {
            init: function() {
                let menuAtrib = document.querySelector('#menu-atributos'); let menuInv = document.querySelector('#menu-inventario-novo'); let atribAberto = false; let invAberto = false; let podeAtacarPC = true;
                window.addEventListener('contextmenu', e => e.preventDefault());
                window.addEventListener('keydown', (e) => { if (!window.GAME_STARTED) return; if (e.key.toLowerCase() === 'i') { invAberto = !invAberto; menuInv.setAttribute('scale', invAberto ? '0.65 0.65 0.65' : '0 0 0'); if (invAberto) atualizarUI(); } if (e.key.toLowerCase() === 'c') { atribAberto = !atribAberto; menuAtrib.setAttribute('scale', atribAberto ? '0.7 0.7 0.7' : '0 0 0'); if (atribAberto) atualizarUI(); } if (e.key.toLowerCase() === 'q' && window.GAME_MODE === 'PC') { window.playerState.escudoEquipado = !window.playerState.escudoEquipado; atualizarUI(); let msg = window.playerState.escudoEquipado ? 'Escudo Equipado (Q)!' : 'Escudo Guardado!'; let aviso = document.querySelector('#texto-central'); aviso.setAttribute('value', msg); aviso.setAttribute('color', window.playerState.escudoEquipado ? '#4169E1' : '#FF4500'); aviso.setAttribute('visible', 'true'); setTimeout(() => aviso.setAttribute('visible', 'false'), 1500); } });

                let puxandoArco = false; let tempoInicioPuxada = 0;
                window.addEventListener('mousedown', (e) => {
                    if(!window.GAME_STARTED || window.GAME_MODE !== 'PC' || !window.playerState.vivo) return;
                    let cursor = document.querySelector('[cursor]'); if(cursor && cursor.components && cursor.components.raycaster && cursor.components.raycaster.intersectedEls.some(el => el.classList.contains('interativo'))) return;
                    let armaStats = window.bancoDeArmas[window.playerState.armaEquipada]; if(!armaStats) return;

                    if(e.button === 0) {
                        if(armaStats.categoria === 'Arco' && window.playerState.flechas > 0) { puxandoArco = true; tempoInicioPuxada = Date.now(); }
                        else if(armaStats.categoria === 'Espada' || armaStats.categoria === 'Luva') {
                            if (!podeAtacarPC) return; podeAtacarPC = false; setTimeout(() => podeAtacarPC = true, 800);
                            if(armaStats.categoria === 'Espada') window.tocarSom('snd-sword');

                            let pcWeapon = document.querySelector('#arma-visual-pc');
                            if(pcWeapon) { pcWeapon.removeAttribute('animation'); pcWeapon.setAttribute('animation', 'property: rotation; to: -60 45 -45; dur: 150; dir: alternate; loop: 1'); setTimeout(() => pcWeapon.setAttribute('rotation', '-90 0 0'), 300); }

                            let posCamera = new THREE.Vector3(); let direcao = new THREE.Vector3(0, 0, -1); let cameraObj = document.querySelector('[camera]').object3D; cameraObj.getWorldPosition(posCamera); direcao.applyQuaternion(cameraObj.quaternion);
                            let inimigosEls = document.querySelectorAll('[sistema-inimigo-sync]');
                            inimigosEls.forEach(inimigoEl => { 
                                let posInimigo = new THREE.Vector3(); inimigoEl.object3D.getWorldPosition(posInimigo); posInimigo.y += 1.0;
                                if (posCamera.distanceTo(posInimigo) < 3.5 && direcao.dot(new THREE.Vector3().subVectors(posInimigo, posCamera).normalize()) > 0.6) { 
                                    let dano = window.playerState.forca + armaStats.danoBonus; 
                                    inimigoEl.components['sistema-inimigo-sync'].receberDano(Math.floor(dano * 1.5), armaStats.categoria); 
                                } 
                            });

        AFRAME.registerComponent('controles-vr-fisica', {
            schema: { isLeft: { default: false } },
            init: function() {
                this.posicaoAnterior = new THREE.Vector3();
                this.velocidadeMao = 0;
                this.bateuNoInimigo = {}; // Armazena se a arma já bateu neste inimigo durante este movimento
            },
            tick: function(time, timeDelta) {
                if (window.GAME_MODE === 'PC' || !window.playerState.vivo || !window.GAME_STARTED) return;
                
                let armaStats = window.bancoDeArmas[window.playerState.armaEquipada];
                if (!armaStats) return;

                let posAtual = new THREE.Vector3();
                this.el.object3D.getWorldPosition(posAtual);
                
                if (timeDelta > 0) {
                    this.velocidadeMao = posAtual.distanceTo(this.posicaoAnterior) / (timeDelta / 1000);
                }
                this.posicaoAnterior.copy(posAtual);

                // Determina o que esta mão está segurando fisicamente
                let isLuva = armaStats.categoria === 'Luva';
                let isEspadaDir = armaStats.categoria === 'Espada' && !this.data.isLeft;
                let isEscudoEsq = window.playerState.escudoEquipado && this.data.isLeft && armaStats.categoria !== 'Arco';
                
                let podeDarDanoFisico = isLuva || isEspadaDir;
                let podeRefletir = isLuva || isEscudoEsq || (isEspadaDir && this.velocidadeMao > 1.2); // Espada só rebate se estiver rápida (corte)

                // 1. DANO POR CONTATO (Física Pura)
                if (podeDarDanoFisico) {
                    let inimigosEls = document.querySelectorAll('[sistema-inimigo-sync]');
                    for (let i = 0; i < inimigosEls.length; i++) {
                        let inimigoEl = inimigosEls[i];
                        let syncData = inimigoEl.components['sistema-inimigo-sync'].data;
                        let idInimigo = syncData ? syncData.idBd : "inimigo_" + i;

                        let posInimigo = new THREE.Vector3();
                        inimigoEl.object3D.getWorldPosition(posInimigo);
                        posInimigo.y += 1.0; 
                        
                        // Se a arma está encostando no inimigo...
                        if (posAtual.distanceTo(posInimigo) < 1.0) { 
                            // AQUI É A MUDANÇA: Exige que a arma saia do inimigo antes de bater de novo
                            if (!this.bateuNoInimigo[idInimigo]) {
                                this.bateuNoInimigo[idInimigo] = true;
                                
                                if(armaStats.categoria === 'Espada') window.tocarSom('snd-sword');
                                
                                let dano = window.playerState.forca + armaStats.danoBonus;
                                if (inimigoEl.components['sistema-inimigo-sync']) {
                                    inimigoEl.components['sistema-inimigo-sync'].receberDano(Math.floor(dano * (this.data.isLeft ? 1 : 1.5)), armaStats.categoria);
                                }
                            }
                        } else {
                            // Perdeu o contato físico com o inimigo! 
                            // Reseta a flag para permitir um novo golpe no próximo movimento.
                            this.bateuNoInimigo[idInimigo] = false; 
                        }
                    }
                }

                // 2. RICOCHETE 360º BASEADO EM ÂNGULO E VELOCIDADE
                if (podeRefletir) {
                    let magias = document.querySelectorAll('.projetil-inimigo'); 
                    magias.forEach(magia => { 
                        let posMagia = new THREE.Vector3(); 
                        magia.object3D.getWorldPosition(posMagia); 
                        
                        // Se a magia tocou na sua mão/escudo...
                        if (posMagia.distanceTo(posAtual) < 0.5) { 
                            
                            if (isEspadaDir && this.velocidadeMao > 1.2 && !isLuva) { 
                                // CORTE NO AR (Espada)
                                magia.removeAttribute('projetil-inimigo-fisico');
                                if(magia.parentNode) magia.parentNode.removeChild(magia);
                                
                                let aviso = document.querySelector('#texto-central'); 
                                aviso.setAttribute('value', 'CORTE PERFEITO!'); 
                                aviso.setAttribute('color', '#00FFFF'); 
                                aviso.setAttribute('visible', 'true'); 
                                setTimeout(() => aviso.setAttribute('visible', 'false'), 800); 
                                window.tocarSom('snd-sword');
                            }
                            else if ((isLuva || isEscudoEsq) && magia.dataset.defletido !== "true") {
                                // RICOCHETE (Luvas ou Escudo)
                                magia.dataset.defletido = "true"; 
                                magia.removeAttribute('projetil-inimigo-fisico'); 
                                magia.setAttribute('color', '#00FF00'); 
                                
                                // O Pulo do Gato: O vetor de ricochete sai do centro da sua mão para o ponto onde a magia bateu.
                                // Ex: Se bater de baixo para cima, a magia voa para cima!
                                let direcaoRicochete = posMagia.clone().sub(posAtual).normalize();
                                if (direcaoRicochete.length() < 0.1) {
                                    direcaoRicochete = new THREE.Vector3(0, 0, -1).applyQuaternion(this.el.object3D.quaternion);
                                }
                                
                                // Soma a velocidade do seu soco real à magia
                                let forcaRebatida = 15 + (this.velocidadeMao * 5); 
                                
                                magia.setAttribute('projetil-fisico', `velocidade: ${direcaoRicochete.x * forcaRebatida} ${direcaoRicochete.y * forcaRebatida} ${direcaoRicochete.z * forcaRebatida}; dano: ${window.playerState.forca * 2}`); 
                                
                                let aviso = document.querySelector('#texto-central'); 
                                aviso.setAttribute('value', isLuva ? 'SOCO RICOCHETE!' : 'PARRY VR!'); 
                                aviso.setAttribute('color', '#FFD700'); 
                                aviso.setAttribute('visible', 'true'); 
                                setTimeout(() => aviso.setAttribute('visible', 'false'), 800); 
                            }
                        }
                    });
                }
            }
        });

                        shuri.setAttribute('animation__rot', `property: rotation; to: 0 720 0; dur: 300; loop: true`);
                        shuri.setAttribute('projetil-fisico', `velocidade: ${direcaoMao.x * 25} ${direcaoMao.y * 25} ${direcaoMao.z * 25}; dano: ${Math.floor((window.playerState.forca + armaStats.danoBonus) * 0.8)}`);

        AFRAME.registerComponent('projetil-fisico', { schema: { velocidade: {type: 'vec3'}, dano: {type: 'number', default: 10} }, init: function () { this.gravidade = new THREE.Vector3(0, -9.8, 0); this.vel = new THREE.Vector3(this.data.velocidade.x, this.data.velocidade.y, this.data.velocidade.z); this.inimigos = document.querySelectorAll('[sistema-inimigo-sync]'); }, tick: function (time, timeDelta) { let dt = timeDelta / 1000; if (dt === 0) return; this.vel.add(this.gravidade.clone().multiplyScalar(dt)); this.el.object3D.position.add(this.vel.clone().multiplyScalar(dt)); this.el.object3D.lookAt(this.el.object3D.position.clone().add(this.vel)); this.el.object3D.rotateX(Math.PI / 2); if (this.el.object3D.position.y < 0) { this.el.removeAttribute('projetil-fisico'); setTimeout(() => { if(this.el.parentNode) this.el.parentNode.removeChild(this.el); }, 2000); } let inimigosAtuais = document.querySelectorAll('[sistema-inimigo-sync]'); for (let i = 0; i < inimigosAtuais.length; i++) { let inimigo = inimigosAtuais[i]; this.el.object3D.updateMatrixWorld(true); inimigo.object3D.updateMatrixWorld(true); let boxProj = new THREE.Box3().setFromObject(this.el.object3D); let boxInimigo = new THREE.Box3(); let colisorNode = inimigo.querySelector('.colisao-inimigo'); if(colisorNode) { colisorNode.object3D.updateMatrixWorld(true); boxInimigo.setFromObject(colisorNode.object3D); } else { boxInimigo.setFromObject(inimigo.object3D); } if (boxProj.intersectsBox(boxInimigo)) { if (inimigo.components['sistema-inimigo-sync']) inimigo.components['sistema-inimigo-sync'].receberDano(this.data.dano, 'Arco'); this.el.parentNode.removeChild(this.el); break;} } } });
        AFRAME.registerComponent('projetil-inimigo-fisico', { schema: { velocidade: {type: 'vec3'}, dano: {type: 'number', default: 10} }, init: function () { this.vel = new THREE.Vector3(this.data.velocidade.x, this.data.velocidade.y, this.data.velocidade.z); this.camera = document.querySelector('[camera]'); }, tick: function (time, timeDelta) { let dt = timeDelta / 1000; if (dt === 0 || !window.playerState.vivo) return; this.el.object3D.position.add(this.vel.clone().multiplyScalar(dt)); if (this.el.object3D.position.y < -1) { this.el.removeAttribute('projetil-inimigo-fisico'); if(this.el.parentNode) this.el.parentNode.removeChild(this.el); return; } let posPlayer = new THREE.Vector3(); this.camera.object3D.getWorldPosition(posPlayer); let posProj = new THREE.Vector3(); this.el.object3D.getWorldPosition(posProj); if (posProj.distanceTo(posPlayer) < 1.0) { if (this.el.dataset.defletido === "true") return; let armaStats = window.bancoDeArmas[window.playerState.armaEquipada] || {defesaBonus: 0}; let defesaTotal = window.playerState.defesa + armaStats.defesaBonus + (window.playerState.escudoEquipado ? 5 : 0); let danoFinal = Math.max(1, this.data.dano - defesaTotal); window.playerState.hpAtual -= danoFinal; let danoTela = document.querySelector('#dano-tela'); if(danoTela) { danoTela.setAttribute('visible', 'true'); setTimeout(() => danoTela.setAttribute('visible', 'false'), 200); } atualizarUI(); if (window.playerState.hpAtual <= 0) { window.playerState.vivo = false; window.playerState.hpAtual = 0; atualizarUI(); let aviso = document.querySelector('#texto-central'); if(aviso) { aviso.setAttribute('value', 'VOCE MORREU!'); aviso.setAttribute('color', '#ff0000'); aviso.setAttribute('visible', 'true'); } setTimeout(() => { location.reload(); }, 3000); } this.el.removeAttribute('projetil-inimigo-fisico'); if(this.el.parentNode) this.el.parentNode.removeChild(this.el); } } });
        
        AFRAME.registerComponent('sistema-arco', { init: function() { this.puxando = false; this.flechaVisual = null; this.maoEsq = document.querySelector('#mao-esquerda'); this.el.addEventListener('triggerdown', () => { if (window.GAME_MODE === 'PC') return; let armaStats = window.bancoDeArmas[window.playerState.armaEquipada]; if (!armaStats || armaStats.categoria !== 'Arco' || window.playerState.flechas <= 0) return; let posEsq = new THREE.Vector3(); this.maoEsq.object3D.getWorldPosition(posEsq); let posDir = new THREE.Vector3(); this.el.object3D.getWorldPosition(posDir); if (posDir.distanceTo(posEsq) < 0.6) { this.puxando = true; this.flechaVisual = document.createElement('a-cylinder'); this.flechaVisual.setAttribute('color', '#fff'); this.flechaVisual.setAttribute('radius', '0.008'); document.querySelector('a-scene').appendChild(this.flechaVisual); } }); this.el.addEventListener('triggerup', () => { if (window.GAME_MODE === 'PC' || !this.puxando) return; this.puxando = false; if (this.flechaVisual) { this.flechaVisual.parentNode.removeChild(this.flechaVisual); this.flechaVisual = null; } let posEsq = new THREE.Vector3(); this.maoEsq.object3D.getWorldPosition(posEsq); let posDir = new THREE.Vector3(); this.el.object3D.getWorldPosition(posDir); let dist = posEsq.distanceTo(posDir); let armaStats = window.bancoDeArmas[window.playerState.armaEquipada]; if (dist > 0.15) { window.playerState.flechas--; atualizarUI(); let cena = document.querySelector('a-scene'); let flecha = document.createElement('a-cylinder'); flecha.setAttribute('color', '#FFF'); flecha.setAttribute('radius', '0.01'); flecha.setAttribute('height', '0.6'); let direcao = new THREE.Vector3().subVectors(posEsq, posDir).normalize(); flecha.setAttribute('position', `${posEsq.x} ${posEsq.y} ${posEsq.z}`); let forcaBase = Math.min(dist * 35, 45); flecha.setAttribute('projetil-fisico', { velocidade: direcao.multiplyScalar(forcaBase), dano: Math.floor((window.playerState.forca + armaStats.danoBonus) * (dist * 3)) }); flecha.object3D.position.copy(posEsq); flecha.object3D.lookAt(posEsq.clone().add(direcao)); flecha.object3D.rotateX(Math.PI / 2); cena.appendChild(flecha); } }); }, tick: function() { if (this.puxando && this.flechaVisual) { let posEsq = new THREE.Vector3(); this.maoEsq.object3D.getWorldPosition(posEsq); let posDir = new THREE.Vector3(); this.el.object3D.getWorldPosition(posDir); let dist = posEsq.distanceTo(posDir); let meio = new THREE.Vector3().addVectors(posEsq, posDir).multiplyScalar(0.5); this.flechaVisual.object3D.position.copy(meio); this.flechaVisual.setAttribute('height', Math.max(0.1, dist)); this.flechaVisual.object3D.lookAt(posEsq); this.flechaVisual.object3D.rotateX(Math.PI / 2); } } });

        // ==========================================
        // 5. COMBATE E ESCUTA DO SERVIDOR (Cliente Leve)
        // ==========================================
        AFRAME.registerComponent('sistema-inimigo-sync', { 
            schema: { idBd: { type: 'string' }, hpMax: { type: 'number', default: 50 }, xpDrop: { type: 'number', default: 50 }, tipo: { type: 'string', default: 'atirador'} }, 
            
            tocarAnimacao: function(nomeAnimacao, loopState, clamp = false) { 
                let visual = this.el.querySelector('.modelo-visual');
                if (visual && visual.hasAttribute('gltf-model')) { 
                    visual.removeAttribute('animation-mixer'); 
                    setTimeout(() => { 
                        visual.setAttribute('animation-mixer', `clip: ${nomeAnimacao}; loop: ${loopState}; crossFadeDuration: 0.1; clampWhenFinished: ${clamp}`); 
                    }, 20); 
                }
            },

            init: function () { 
                this.hpAtual = this.data.hpMax; this.el.classList.add('interativo');
                setTimeout(() => { this.tocarAnimacao(window.ANIM_PARADO, 'repeat'); }, 500);

                this.dbRef = firebase.database().ref('cenario_inimigos/' + this.data.idBd);
                this.ultimoTempoTiro = 0;
                this.ultimoTempoMelee = 0; 
                this.dadosBD = null;

                // ESCUTA O SERVIDOR NODE.JS
                this.dbRef.on('value', snap => {
                    let data = snap.val(); if (!data) return;
                    this.dadosBD = data; 
                    let textoHp = this.el.querySelector('.hp-texto');
                    
                    if (data.pos) { 
                        this.el.setAttribute('animation__syncpos', `property: position; to: ${data.pos.x} ${data.pos.y} ${data.pos.z}; dur: 200; easing: linear`);
                        this.el.object3D.rotation.y = data.rotY;
                    }

                    if (data.shoot && data.shoot.time !== this.ultimoTempoTiro) {
                        this.ultimoTempoTiro = data.shoot.time;
                        this.tocarAnimacao(window.ANIM_ATIRANDO, 'once');
                        
                        this.el.object3D.updateMatrixWorld(true);
                        let posInimigo = new THREE.Vector3(); 
                        this.el.object3D.getWorldPosition(posInimigo);

                        let posAlvo = new THREE.Vector3(Number(data.shoot.tx), Number(data.shoot.ty), Number(data.shoot.tz));
                        let projetil = document.createElement('a-cylinder'); 
                        projetil.setAttribute('radius', '0.04'); projetil.setAttribute('height', '0.6'); projetil.setAttribute('color', '#e74c3c'); 
                        projetil.classList.add('projetil-inimigo'); 
                        
                        let origemTiro = new THREE.Vector3(posInimigo.x, posInimigo.y + 1.2, posInimigo.z); 
                        let direcao = new THREE.Vector3().subVectors(posAlvo, origemTiro).normalize();
                        
                        projetil.setAttribute('position', `${origemTiro.x} ${origemTiro.y} ${origemTiro.z}`); 
                        projetil.object3D.position.copy(origemTiro); 
                        projetil.object3D.lookAt(origemTiro.clone().add(direcao)); 
                        projetil.object3D.rotateX(Math.PI / 2);
                        
                        let speed = 7;
                        let danoMatematico = 15 + (window.playerState.nivel * 2);
                        projetil.setAttribute('projetil-inimigo-fisico', `velocidade: ${direcao.x * speed} ${direcao.y * speed} ${direcao.z * speed}; dano: ${danoMatematico}`);
                        
                        document.querySelector('a-scene').appendChild(projetil); 
                        
                        setTimeout(() => { if(projetil.parentNode && !projetil.dataset.defletido) projetil.parentNode.removeChild(projetil); }, 5000);
                        setTimeout(() => { if (this.hpAtual > 0) this.tocarAnimacao(window.ANIM_PARADO, 'repeat'); }, 1000);
                    }

                    if (data.meleeAttack && data.meleeAttack.time !== this.ultimoTempoMelee) {
                        this.ultimoTempoMelee = data.meleeAttack.time;
                        this.tocarAnimacao(window.ANIM_ATIRANDO, 'once');
                        setTimeout(() => { if (this.hpAtual > 0) this.tocarAnimacao(window.ANIM_PARADO, 'repeat'); }, 1000);

                        if (window.playerState.vivo) {
                            let camEl = document.querySelector('[camera]');
                            camEl.object3D.updateMatrixWorld(true);
                            let posPlayer = new THREE.Vector3(); 
                            camEl.object3D.getWorldPosition(posPlayer);
                            
                            this.el.object3D.updateMatrixWorld(true);
                            let posInimigo = new THREE.Vector3(); 
                            this.el.object3D.getWorldPosition(posInimigo);
                            
                            if (posPlayer.distanceTo(posInimigo) < 2.5) {
                                let armaStats = window.bancoDeArmas[window.playerState.armaEquipada] || {defesaBonus: 0};
                                let defesaTotal = window.playerState.defesa + armaStats.defesaBonus + (window.playerState.escudoEquipado ? 5 : 0);
                                let danoFinal = Math.max(1, (10 + window.playerState.nivel) - defesaTotal);
                                window.playerState.hpAtual -= danoFinal;

                                let danoTela = document.querySelector('#dano-tela');
                                if(danoTela) { danoTela.setAttribute('visible', 'true'); setTimeout(() => danoTela.setAttribute('visible', 'false'), 200); }
                                atualizarUI();

                                if (window.playerState.hpAtual <= 0) {
                                    window.playerState.vivo = false; window.playerState.hpAtual = 0; atualizarUI();
                                    let aviso = document.querySelector('#texto-central');
                                    if(aviso) { aviso.setAttribute('value', 'VOCE MORREU!'); aviso.setAttribute('color', '#ff0000'); aviso.setAttribute('visible', 'true'); }
                                    setTimeout(() => { location.reload(); }, 3000);
                                }
                            }
                        }
                    }

                    // Lógica de Dano e Ressurreição
                    let estavaMorto = (this.hpAtual <= 0);
                    let morreuAgora = (this.hpAtual > 0 && data.hp <= 0);
                    let tomouDano = (this.hpAtual > 0 && data.hp > 0 && data.hp < this.hpAtual);
                    let reviveu = (estavaMorto && data.hp > 0);

                    this.hpAtual = data.hp;

                    if (morreuAgora) {
                        if(textoHp) textoHp.setAttribute('value', 'MORTO'); 
                        this.el.classList.remove('interativo');
                        this.tocarAnimacao(window.ANIM_MORTE, 'once', true); 
                        setTimeout(() => { if(this.hpAtual <= 0) this.el.setAttribute('visible', 'false'); }, 3000);
                    } else if (reviveu) {
                        if(textoHp) { textoHp.setAttribute('value', 'HP: ' + this.hpAtual); textoHp.setAttribute('color', '#FFF'); }
                        this.el.classList.add('interativo'); 
                        this.el.setAttribute('visible', 'true');
                        this.tocarAnimacao(window.ANIM_PARADO, 'repeat');
                    } else if (tomouDano) {
                        if(textoHp) textoHp.setAttribute('value', 'HP: ' + this.hpAtual); 
                        let v = this.el.querySelector('.modelo-visual') || this.el.querySelector('.inimigo-fallback');
                        let obj3D = v ? v.getObject3D('mesh') : null;
                        
                        if (obj3D) obj3D.traverse((n) => { if (n.isMesh && n.material && n.material.emissive) { let corOr = n.material.emissive.getHex(); n.material.emissive.setHex(0xaa0000); setTimeout(() => { if(n.material) n.material.emissive.setHex(corOr); }, 150); } });
                        
                        this.tocarAnimacao(window.ANIM_DANO, 'once');
                        setTimeout(() => { if (this.hpAtual > 0) this.tocarAnimacao(window.ANIM_PARADO, 'repeat'); }, 600);
                    } else if (!estavaMorto && data.hp > 0) {
                        if(textoHp) textoHp.setAttribute('value', 'HP: ' + this.hpAtual); 
                    }
                });

                // ENVIA DANO PARA O SERVIDOR
                this.receberDano = (dano, tipoCategoria = '') => { 
                    if (!window.playerState.vivo || this.hpAtual <= 0) return; window.tocarSom('snd-hit'); 
                    this.dbRef.child('hp').transaction(currentHp => { 
                        if (currentHp === null) return this.data.hpMax - dano; 
                        if (currentHp <= 0) return; 
                        return Math.max(0, currentHp - dano); 
                    }, (error, committed, snapshot) => {
                        if (committed && snapshot.val() === 0) {
                            this.hpAtual = 0; 
                            window.playerState.xp += this.data.xpDrop; 
                            let textoHp = this.el.querySelector('.hp-texto');
                            if(textoHp) { textoHp.setAttribute('value', '+ ' + this.data.xpDrop + ' XP!'); textoHp.setAttribute('color', '#00ff00'); }
                            this.el.classList.remove('interativo');
                            
                            if (window.playerState.xp >= window.playerState.xpProxNivel) { 
                                window.playerState.nivel++; window.playerState.pontos++; window.playerState.xp -= window.playerState.xpProxNivel; window.playerState.xpProxNivel = Math.floor(window.playerState.xpProxNivel * 1.5); 
                                let aviso = document.querySelector('#texto-central'); aviso.setAttribute('value', 'LEVEL UP! (Aperte C/Y)'); aviso.setAttribute('color', '#00FF00'); aviso.setAttribute('visible', 'true'); setTimeout(() => aviso.setAttribute('visible', 'false'), 4000); 
                            } 
                            atualizarUI(); 
                            
                            this.dbRef.update({ mortoEm: Date.now() }); 
                        }
                    });
                }; 
            }
        });
    </script>
    <style>
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 20, 0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-family: sans-serif; } .menu-box { background: #2c3e50; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 320px; } .menu-box input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; box-sizing: border-box; } .btn { padding: 12px 20px; font-size: 1.1rem; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; margin: 5px 0; width: 100%; color: white; } .btn-green { background: #27ae60; } .btn-blue { background: #2980b9; } .btn-orange { background: #d35400; } #start-menu { display: none; }
    </style>
</head>
<body>

        <div id="login-menu" class="menu-box"><h2 style="color: #f1c40f;">MMO Login</h2><input type="email" id="login-email" placeholder="Email"><input type="password" id="login-senha" placeholder="Senha"><button id="btn-login" class="btn btn-blue">Entrar</button><button id="btn-registrar" class="btn btn-green">Criar Conta</button></div>
        <div id="start-menu" class="menu-box"><h2 style="color: #2ecc71;">Logado!</h2><button id="btn-pc" class="btn btn-orange">Jogar no PC (Mouse)</button><button id="btn-vr" class="btn btn-blue">Jogar em VR</button></div>
    </div>

    <a-scene pc-controles sistema-jogo renderer="colorManagement: true; localClippingEnabled: true">
        
       <a-assets timeout="3000">

            <a-asset-item id="modelo-inimigo2" src="Inimigos/atiradora.glb"></a-asset-item>

            <audio id="snd-sword" src="Sons/espada.mp3" preload="auto"></audio>
            <audio id="snd-magic" src="Sons/magia.mp3" preload="auto"></audio>
            <audio id="snd-hit" src="Sons/dano.mp3" preload="auto"></audio>
        </a-assets>

        <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.5" position="-1 2 1"></a-light>

        <a-entity environment="preset: forest; groundColor: #445; grid: none"></a-entity>

        <a-box class="interativo" sistema-bau position="-3 0.5 -3" rotation="0 45 0" color="#4CC3D9" shadow>

            <a-entity class="modelo-visual" gltf-model="#modelo-inimigo"></a-entity>
            <a-text class="hp-texto" value="HP: 80" position="-0.4 2.2 0" color="#FFF" scale="0.8 0.8 0.8"></a-text>
            <a-box class="inimigo-fallback" color="#e74c3c" visible="false" scale="0.5 1.5 0.5" position="0 0.75 0"></a-box>
            <a-box class="colisao-inimigo" visible="false" scale="1 2 1" position="0 1 0"></a-box>
        </a-entity>

        <a-entity sistema-inimigo-sync="idBd: goblin_zona_1; hpMax: 40; xpDrop: 20; tipo: meelee" position="5 0 -8" shadow>

            <a-text class="hp-texto" value="HP: 40" position="-0.4 2.2 0" color="#FFF" scale="0.8 0.8 0.8"></a-text>
            <a-box class="inimigo-fallback" color="#8e44ad" visible="false" scale="0.5 1.2 0.5" position="0 0.6 0"></a-box>
            <a-box class="colisao-inimigo" visible="false" scale="1 1.5 1" position="0 0.75 0"></a-box>
        </a-entity>

        <a-entity id="rig" firebase-multiplayer movement-controls="speed: 0.15" position="0 0 0">
            <a-entity camera position="0 1.6 0" look-controls="pointerLockEnabled: true">
                <a-entity cursor="fuse: false" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025" material="color: white; shader: flat; opacity: 0.8" raycaster="objects: .interativo; far: 20"></a-entity>
                
                <a-entity id="arma-visual-pc" position="0.3 -0.3 -0.6" rotation="-90 0 0" scale="0.7 0.7 0.7"></a-entity>
                <a-entity id="escudo-visual-pc" position="-0.4 -0.2 -0.5" rotation="180 0 0" scale="0.7 0.7 0.7"></a-entity>

                <a-plane id="dano-tela" position="0 0 -0.5" width="2" height="2" color="#ff0000" opacity="0.3" visible="false"></a-plane>
                <a-text id="texto-central" value="" position="-0.5 -0.3 -1.5" color="#00FF00" visible="false" scale="0.5 0.5 0.5"></a-text>
                
                <a-text id="contador-online" value="Conectando Servidor..." position="0.6 0.8 -1.2" color="#00FF00" scale="0.4 0.4 0.4" align="right"></a-text>
            </a-entity> 

            <a-entity id="hud-status" position="-0.4 2.4 -1.4" rotation="25 0 0">
                <a-plane position="0.05 0 -0.01" width="1.1" height="0.25" color="#1a1a1a" opacity="0.85"></a-plane>
                <a-text id="txt-nivel-hud" value="Nivel: 1 | XP: 0/50" position="-0.45 -0.05 0" color="#AAAAAA" scale="0.25 0.25 0.25" align="left"></a-text>
                <a-entity position="-0.05 0 0">
                    <a-plane position="0.3 0.05 0" width="0.6" height="0.04" color="#333"></a-plane>
                    <a-entity id="hp-wrapper" position="0 0.05 0.01"><a-plane position="0.3 0 0" width="0.6" height="0.04" color="#c0392b"></a-plane></a-entity>
                    <a-plane position="0.3 -0.01 0" width="0.6" height="0.04" color="#333"></a-plane>
                    <a-entity id="mp-wrapper" position="0 -0.01 0.01"><a-plane position="0.3 0 0" width="0.6" height="0.04" color="#2980b9"></a-plane></a-entity>
                    <a-text id="txt-status-hud" value="HP: 100/100   |   MP: 100/100" position="0.3 -0.07 0" color="#FFF" scale="0.2 0.2 0.2" align="center"></a-text>
                    <a-text id="txt-arma-hud" value="Equipado: Nenhuma" position="-0.45 -0.15 0" color="#FFD700" scale="0.25 0.25 0.25" align="left"></a-text>
                </a-entity>
            </a-entity>

            <a-entity id="menu-inventario-novo" scale="0 0 0" position="-0.5 1.5 -1.6" rotation="0 15 0">
                <a-plane width="3.2" height="1.9" color="#e67e22" opacity="1.0" position="0 0 0"></a-plane>
