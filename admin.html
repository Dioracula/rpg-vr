<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Mestre - RPG MMO</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: #ecf0f1; margin: 0; padding: 20px; }
        h1 { color: #f1c40f; text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; text-transform: uppercase;}
        .container { max-width: 1200px; margin: 0 auto; }
        .header-controls { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .section-title { color: #fff; background: #333; padding: 10px; border-radius: 5px; margin-bottom: 20px; border-left: 5px solid #f1c40f; display: flex; justify-content: space-between; align-items: center;}
        
        .admin-tabs { display: flex; gap: 10px; margin-bottom: 30px; background: #2c3e50; padding: 10px; border-radius: 8px; overflow-x: auto; }
        .tab-btn { flex: 1; background: #34495e; color: #bdc3c7; border: none; padding: 15px 20px; border-radius: 5px; cursor: pointer; font-size: 1rem; font-weight: bold; transition: 0.3s; white-space: nowrap; }
        .tab-btn:hover { background: #455a64; color: white; }
        .tab-btn.active { background: #f1c40f; color: #111; box-shadow: 0 0 10px rgba(241, 196, 15, 0.5); }
        
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: #2c3e50; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border-left: 4px solid #e74c3c;}
        .card.npc-card { border-left-color: #2ecc71; }
        .card.player-card { border-left-color: #9b59b6; }
        .card.respawn-card { border-left-color: #00ffcc; }
        .card.arma-card { border-left-color: #e67e22; }
        .card.cosm-card { border-left-color: #ff69b4; } 
        
        .card h3 { margin: 0 0 10px 0; color: #f1c40f; width: 100%; display: flex; justify-content: space-between;}
        
        .input-group { display: flex; flex-direction: column; margin-right: 15px; margin-bottom: 10px; }
        .input-group label { font-size: 0.80rem; color: #bdc3c7; margin-bottom: 3px; font-weight: bold; }
        .input-group input, .input-group select, .input-group textarea { background: #34495e; border: 1px solid #7f8c8d; color: white; padding: 8px; border-radius: 4px; width: 90px; }
        .input-group input[type="text"] { width: 180px; }
        .input-group textarea { width: 250px; resize: vertical; height: 35px;}
        .input-group input:focus, .input-group textarea:focus { border-color: #f1c40f; background: #2c3e50; outline: none; }
        
        .input-file-mini { margin-top: 5px; font-size: 0.75rem; color: #f1c40f; }

        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; margin-right: 5px; margin-top: 10px;}
        .btn-green { background: #27ae60; color: white; } .btn-green:hover { background: #2ecc71; }
        .btn-blue { background: #2980b9; color: white; } .btn-blue:hover { background: #3498db; }
        .btn-red { background: #c0392b; color: white; } .btn-red:hover { background: #e74c3c; }
        .btn-dark { background: #111; color: #e74c3c; border: 1px solid #e74c3c; } .btn-dark:hover { background: #e74c3c; color: white; }
        .btn-edit { background: #f39c12; color: #111; } .btn-edit:hover { background: #f1c40f; }

        .painel-spawn { background: #8e44ad; padding: 20px; border-radius: 8px; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .painel-spawn.npc-spawn { background: #2c3e50; border: 2px solid #2ecc71;}
        .painel-spawn.ini-spawn { background: #2c3e50; border: 2px solid #e74c3c;}
        .painel-spawn.resp-spawn { background: #16a085; border: 2px solid #1abc9c;}
        .painel-spawn.arma-spawn { background: #d35400; border: 2px solid #e67e22;}
        .painel-spawn.cosm-spawn { background: #2c3e50; border: 2px solid #ff69b4;}
        .painel-spawn h2 { margin-top: 0; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 10px;}
        
        .grid-spawn { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .grid-spawn .input-group { margin: 0; }
        .grid-spawn .input-group input, .grid-spawn .input-group select, .grid-spawn .input-group textarea { width: 100%; box-sizing: border-box; }
        
        .grupo-destaque { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.1); }
        .grupo-especial { background: rgba(52, 152, 219, 0.1); padding: 10px; border-radius: 5px; border: 1px solid rgba(52, 152, 219, 0.3); }
        .tag-chave { background: #f39c12; color: #111; padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; margin-right: 5px; display: inline-block; margin-bottom: 5px;}
        .status-extracao { font-size: 0.75rem; font-weight: bold; margin-left: 5px; }

        /* Estilos do Navegador GitHub */
        .gh-item { padding: 10px; margin-bottom: 5px; background: #2c3e50; border-radius: 4px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; }
        .gh-item:hover { background: #34495e; transform: translateX(5px); }
        .gh-icon { font-size: 1.2rem; }

        /* Estilo para campos Dinâmicos de Armas */
        .dyn-group { display: none; }
        .dyn-group.active { display: contents; }
        .bg-vfx { background: rgba(155, 89, 182, 0.1); padding: 10px; border-radius: 5px; border: 1px solid rgba(155, 89, 182, 0.3); }
        .bg-vfx label { color: #d2b4de !important; }
        
        .bloco-ataque { background: rgba(0, 0, 0, 0.2); border: 1px dashed #e74c3c; padding: 15px; border-radius: 8px; position: relative; }
        .btn-rm-atk { position: absolute; top: 10px; right: 10px; background: #c0392b; border:none; color: white; border-radius: 5px; cursor: pointer;}
    </style>
</head>
<body>

<div id="github-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.85); z-index:99999; justify-content:center; align-items:center; backdrop-filter: blur(5px);">
    <div style="background:#1a1a1a; padding:25px; border-radius:10px; width:600px; max-width:90%; box-shadow:0 10px 40px rgba(0,0,0,0.8); border: 1px solid #333;">
        <h2 style="color:#f1c40f; margin-top:0; display:flex; align-items:center; gap:10px;">🐙 Navegador GitHub</h2>
        <p style="color:#bdc3c7; font-size:0.9rem; margin-top:-10px;">Conecte seu repositório para ler os arquivos GLB ou PNG diretamente.</p>
        
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <input type="text" id="gh-user" placeholder="Usuário (Ex: seunome)" value="Dioracula" style="flex:1; padding:10px; border-radius:5px; border:1px solid #7f8c8d; background:#2c3e50; color:white;">
            <input type="text" id="gh-repo" placeholder="Repositório (Ex: mmo-assets)" value="rpg-vr" style="flex:1; padding:10px; border-radius:5px; border:1px solid #7f8c8d; background:#2c3e50; color:white;">
            <button class="btn btn-blue" style="margin:0; width:auto;" onclick="carregarPastaGitHub('')">🔄 Conectar</button>
        </div>
        
        <div style="background:#000; padding:12px; border-radius:5px; margin-bottom:15px; font-family:monospace; color:#2ecc71; border: 1px solid #333;">
            Caminho Atual: <span id="gh-current-path" style="color: #fff;">/</span>
        </div>
        
        <div id="gh-file-list" style="background:#111; height:350px; overflow-y:auto; border-radius:5px; padding:10px; border: 1px inset #222;">
            <p style="color:#7f8c8d; text-align:center; margin-top:150px;">Aperte Conectar para listar os arquivos do Repositório.</p>
        </div>
        
        <div style="display:flex; justify-content:flex-end; margin-top:20px; gap: 10px;">
            <span id="gh-loading-status" style="color:#f39c12; align-self:center; font-weight:bold; margin-right:auto;"></span>
            <button class="btn btn-red" style="width:auto; margin:0;" onclick="document.getElementById('github-modal').style.display='none'">Cancelar / Fechar</button>
        </div>
    </div>
</div>

<div class="container">
    <h1>👑 PAINEL DO MESTRE</h1>
    
    <div class="header-controls" style="gap: 10px;">
        <button id="btn-toggle-teste" class="btn btn-blue" onclick="window.toggleModoTeste()">🧪 Modo Teste: Carregando...</button>
        <button class="btn btn-dark" onclick="window.kickarTodos()">🥾 KICK ALL (Derrubar Todos)</button>
    </div>

    <datalist id="lista-animacoes"></datalist>

    <div class="admin-tabs">
        <button class="tab-btn active" onclick="abrirAba('tab-jogadores', this)">🎒 Jogadores</button>
        <button class="tab-btn" onclick="abrirAba('tab-cosmeticos', this)">🎭 Cosméticos & Vestuário</button>
        <button class="tab-btn" onclick="abrirAba('tab-armas', this)">🗡️ Arsenal (Itens)</button>
        <button class="tab-btn" onclick="abrirAba('tab-respawns', this)">🔮 Respawns</button>
        <button class="tab-btn" onclick="abrirAba('tab-npcs', this)">🗣️ NPCs</button>
        <button class="tab-btn" onclick="abrirAba('tab-inimigos', this)">⚔️ Inimigos</button>
    </div>

    <div id="tab-jogadores" class="tab-content active"> <div id="lista-jogadores" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px;"></div> </div>
    <div id="tab-cosmeticos" class="tab-content"> <div id="lista-cosmeticos"></div> </div>
    <div id="tab-armas" class="tab-content"> <div id="lista-armas"></div> </div>
    <div id="tab-respawns" class="tab-content"> <div id="lista-respawns"></div> </div>
    <div id="tab-npcs" class="tab-content"> <div id="lista-npcs"></div> </div>

    <div id="tab-inimigos" class="tab-content">
        <h2 class="section-title">⚔️ QUARTEL GENERAL DOS INIMIGOS</h2>
        <div id="lista-inimigos" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 15px;"></div>
        <div class="painel-spawn ini-spawn" id="form-inimigo">
            <h2>🪄 Invocar ou Editar Inimigo</h2>
            <div class="grid-spawn">
                <div class="input-group"><label>ID Único</label><input type="text" id="novo-id" placeholder="ex: orc_01"></div>
                <div class="input-group grupo-especial"><label style="color:#e74c3c">Comportamento</label>
                    <select id="novo-comportamento">
                        <option value="hostil">Hostil (Ataca ao ver)</option>
                        <option value="pacifico">Pacífico (Só revida)</option>
                    </select>
                </div>
                <div class="input-group grupo-especial"><label style="color:#2ecc71">Movimento Base</label>
                    <select id="novo-movimento">
                        <option value="estatico">Estático (Parado)</option>
                        <option value="livre">Patrulha Livre</option>
                    </select>
                </div>
                
                <div class="input-group"><label>HP Máximo</label><input type="number" id="novo-hp" value="50"></div>
                
                <div class="input-group">
                    <label>Caminho GLB (Inimigo) <span id="status-ini-glb" class="status-extracao"></span></label>
                    <input type="text" id="novo-glb-caminho" value="#modelo-inimigo">
                    <div style="display: flex; gap: 5px; margin-top: 5px;">
                        <input type="file" id="file-ini-glb" accept=".glb,.gltf" style="width: 130px; font-size:0.75rem;">
                        <button class="btn btn-dark" style="margin:0; padding:2px 8px; font-size:0.8rem; flex:1;" onclick="abrirGitHubModal('novo-glb-caminho', 'Inimigos/', 'status-ini-glb')">🐙 GitHub</button>
                    </div>
                </div>

                <div class="input-group"><label style="color: #9b59b6;">Escala (Tamanho)</label><input type="text" id="novo-escala" placeholder="Ex: 1 1 1" value="1 1 1"></div>
                <div class="input-group"><label>Anim. Parado</label><input type="text" id="novo-anim-parado" list="lista-animacoes" value="chr784_armature|chr784_bn01"></div>
                <div class="input-group"><label>Anim. Andando</label><input type="text" id="novo-anim-andando" list="lista-animacoes" value="chr784_armature|chr784_br01"></div>
                <div class="input-group"><label>Anim. Morte</label><input type="text" id="novo-anim-morte" list="lista-animacoes" value="chr784_armature|chr784_bd02"></div>

                <div class="input-group grupo-especial"><label style="color:#3498db">Visão / Radar (m)</label><input type="number" id="novo-aggro-range" value="15"></div>
                <div class="input-group grupo-especial"><label style="color:#3498db">Velocidade Mov.</label><input type="number" step="0.01" id="novo-speed" value="0.08"></div>
                <div class="input-group grupo-especial"><label style="color:#3498db">Freq. Ataque (ms)</label><input type="number" step="100" id="novo-cooldown" value="2000" title="Tempo de espera entre qualquer ataque"></div>
                <div class="input-group grupo-especial"><label style="color:#2ecc71">Respawn (Seg.)</label><input type="number" id="novo-respawn-time" value="60"></div>

                <div class="input-group grupo-destaque"><label style="color:#f1c40f">Pos Inicial X</label><input type="number" step="0.1" id="novo-spawn-x" value="0"></div>
                <div class="input-group grupo-destaque"><label style="color:#f1c40f">Pos Inicial Y</label><input type="number" step="0.1" id="novo-spawn-y" value="0"></div>
                <div class="input-group grupo-destaque"><label style="color:#f1c40f">Pos Inicial Z</label><input type="number" step="0.1" id="novo-spawn-z" value="-5"></div>
            </div>

            <div class="section-title" style="margin-top: 20px;">
                ⚔️ LISTA DE ATAQUES (Combos & Magias)
                <button class="btn btn-blue" style="margin:0; padding:5px 15px;" onclick="adicionarFormAtaque()">➕ Adicionar Ataque</button>
            </div>
            <div id="container-lista-ataques" style="display: flex; flex-direction: column; gap: 15px;"></div>

            <button class="btn btn-green" style="width: 100%; font-size: 1.1rem; margin-top: 25px;" onclick="spawnarNovoInimigo()">⚡ INVOCAR / SALVAR INIMIGO</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
          apiKey: "AIzaSyCdsfW1ALz-8ktkYl_rACiY6tu0M2wqkH0",
          authDomain: "rpg-vr-online.firebaseapp.com",
          databaseURL: "https://rpg-vr-online-default-rtdb.firebaseio.com",
          projectId: "rpg-vr-online",
          storageBucket: "rpg-vr-online.firebasestorage.app",
          messagingSenderId: "676174796336",
          appId: "1:676174796336:web:7a91d19a758d29ef247ff5",
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database(); 
    const firestoreDB = firebase.firestore();

    window.abrirAba = function(abaId, btnSelecionado) {
        let abas = document.getElementsByClassName("tab-content");
        for (let i = 0; i < abas.length; i++) { abas[i].style.display = "none"; }
        let botoes = document.getElementsByClassName("tab-btn");
        for (let i = 0; i < botoes.length; i++) { botoes[i].classList.remove("active"); }
        let abaNova = document.getElementById(abaId);
        if(abaNova) abaNova.style.display = "block";
        if (btnSelecionado) { btnSelecionado.classList.add("active"); } 
    };

    let ghTargetInput = ""; let ghPastaBase = ""; let ghStatusId = ""; let ghSelectCatId = null;
    window.abrirGitHubModal = function(targetInputId, pastaBase, statusId, selectCatId = null) {
        ghTargetInput = targetInputId; ghPastaBase = pastaBase; ghStatusId = statusId; ghSelectCatId = selectCatId;
        document.getElementById('github-modal').style.display = 'flex';
    };

    // === GERENCIAMENTO DE MULTIPLOS ATAQUES NO HTML ===
    let contadorAtaques = 0;

    window.adicionarFormAtaque = function(dados = null) {
        let container = document.getElementById('container-lista-ataques');
        let div = document.createElement('div');
        let index = contadorAtaques++;
        div.className = "bloco-ataque";
        div.id = `atk-bloco-${index}`;
        
        let d = dados || { animacao: '', tipo: 'meelee', alcance: 1.8, dano: 10, tempoHit: 400, duracao: 1000, osso: 'hand_r', glbTiro: '', escalaTiro: '0.5 0.5 0.5', rotTiro: '0 0 0', velTiro: 6.0 };

        div.innerHTML = `
            <button class="btn-rm-atk" onclick="document.getElementById('atk-bloco-${index}').remove()">X</button>
            <div class="grid-spawn">
                <div class="input-group"><label style="color:#e74c3c;">Nome Animação</label><input type="text" class="atk-anim" list="lista-animacoes" value="${d.animacao}"></div>
                <div class="input-group"><label style="color:#e74c3c;">Tipo de Golpe</label>
                    <select class="atk-tipo" onchange="toggleCamposTiro(this, ${index})">
                        <option value="meelee" ${d.tipo === 'meelee' ? 'selected' : ''}>Meelee (Corpo a Corpo)</option>
                        <option value="atirador" ${d.tipo === 'atirador' ? 'selected' : ''}>Longo Alcance (Magia/Tiro)</option>
                    </select>
                </div>
                <div class="input-group"><label style="color:#f1c40f;">Alcance (m)</label><input type="number" step="0.1" class="atk-alcance" value="${d.alcance}" title="1.8 = Espada, 3 = Lança, 15 = Magia"></div>
                <div class="input-group"><label style="color:#e74c3c;">Dano / Força</label><input type="number" class="atk-dano" value="${d.dano}"></div>
                
                <div class="input-group"><label style="color:#3498db;">Momento do Hit (ms)</label><input type="number" class="atk-tempohit" value="${d.tempoHit}" title="Tempo exato para dar dano / atirar o projétil"></div>
                <div class="input-group"><label style="color:#3498db;">Duração Total (ms)</label><input type="number" class="atk-duracao" value="${d.duracao}" title="Espera da animação terminar antes de andar de novo"></div>
                
                <div class="input-group grupo-especial m-campo-${index}" style="display: ${d.tipo === 'meelee' ? 'flex' : 'none'};">
                    <label style="color:#e74c3c;">Osso do Golpe</label>
                    <input type="text" class="atk-osso" value="${d.osso}" placeholder="ex: espada, hand_r">
                </div>

                <div class="input-group grupo-especial r-campo-${index}" style="display: ${d.tipo === 'atirador' ? 'flex' : 'none'}; grid-column: span 2;">
                    <label style="color:#9b59b6;">GLB Magia/Tiro <span id="status-atk-${index}"></span></label>
                    <input type="text" class="atk-glb" id="atk-glb-in-${index}" value="${d.glbTiro}">
                    <div style="display: flex; gap: 5px; margin-top: 5px;">
                        <input type="file" id="atk-file-${index}" accept=".glb,.gltf" style="width: 130px; font-size:0.75rem;" onchange="lerUploadAtk(this, ${index})">
                        <button class="btn btn-dark" style="margin:0; padding:2px 8px; font-size:0.8rem; flex:1;" onclick="abrirGitHubModal('atk-glb-in-${index}', 'Magias/', 'status-atk-${index}')">🐙 GitHub</button>
                    </div>
                </div>
                <div class="input-group grupo-especial r-campo-${index}" style="display: ${d.tipo === 'atirador' ? 'flex' : 'none'};"><label style="color:#9b59b6;">Escala Magia</label><input type="text" class="atk-esc-tiro" value="${d.escalaTiro}"></div>
                <div class="input-group grupo-especial r-campo-${index}" style="display: ${d.tipo === 'atirador' ? 'flex' : 'none'};"><label style="color:#9b59b6;">Rot Magia</label><input type="text" class="atk-rot-tiro" value="${d.rotTiro}"></div>
                <div class="input-group grupo-especial r-campo-${index}" style="display: ${d.tipo === 'atirador' ? 'flex' : 'none'};"><label style="color:#9b59b6;">Vel Magia</label><input type="number" step="0.1" class="atk-vel-tiro" value="${d.velTiro}"></div>
            </div>
        `;
        container.appendChild(div);
    };

    window.toggleCamposTiro = function(selectEl, index) {
        let isAtirador = selectEl.value === 'atirador';
        document.querySelectorAll(`.m-campo-${index}`).forEach(e => e.style.display = isAtirador ? 'none' : 'flex');
        document.querySelectorAll(`.r-campo-${index}`).forEach(e => e.style.display = isAtirador ? 'flex' : 'none');
    };

    window.lerUploadAtk = function(inputEl, index) {
        if (!inputEl.files || !inputEl.files[0]) return;
        document.getElementById(`atk-glb-in-${index}`).value = `Magias/${inputEl.files[0].name}`;
    };

    // === INIMIGOS ===
    const listaInimigosDiv = document.getElementById('lista-inimigos');
    db.ref('cenario_inimigos').on('child_added', (snapshot) => {
        let id = snapshot.key; let ini = snapshot.val();
        let card = document.createElement('div'); card.className = 'card ini-card'; card.id = `card-ini-${id}`;
        let hpAtual = ini.hp !== undefined ? ini.hp : ini.hpMax;
        let pX = ini.pos ? ini.pos.x.toFixed(1) : 0; let pY = ini.pos ? ini.pos.y.toFixed(1) : 0; let pZ = ini.pos ? ini.pos.z.toFixed(1) : 0;
        card.innerHTML = `
            <h3>👾 ${id}</h3>
            <div id="stats-ini-${id}" style="width: 100%; font-size: 0.95rem; margin-bottom: 10px; color: #bdc3c7;">
                ❤️ HP: <b style="color: ${hpAtual > 0 ? '#2ecc71' : '#e74c3c'}">${hpAtual} / ${ini.hpMax}</b> | 📍 Pos Atual: <b>X: ${pX} | Y: ${pY} | Z: ${pZ}</b><br>
                ⚔️ Qtd. Ataques: <b>${ini.ataques ? ini.ataques.length : 1}</b>
            </div>
            <div class="action-buttons" style="width: 100%;">
                <button class="btn btn-edit" onclick="carregarEdicaoInimigo('${id}')">✏️ Editar</button>
                <button class="btn btn-dark" onclick="db.ref('cenario_inimigos/${id}').remove()">🗑️ Excluir</button>
            </div>
        `;
        if(listaInimigosDiv) listaInimigosDiv.appendChild(card);
    });

    db.ref('cenario_inimigos').on('child_changed', (snapshot) => {
        let id = snapshot.key; let ini = snapshot.val(); let statsDiv = document.getElementById(`stats-ini-${id}`);
        if (statsDiv) {
            let hpAtual = ini.hp !== undefined ? ini.hp : ini.hpMax;
            let pX = ini.pos ? ini.pos.x.toFixed(1) : 0; let pY = ini.pos ? ini.pos.y.toFixed(1) : 0; let pZ = ini.pos ? ini.pos.z.toFixed(1) : 0;
            statsDiv.innerHTML = `❤️ HP: <b style="color: ${hpAtual > 0 ? '#2ecc71' : '#e74c3c'}">${hpAtual} / ${ini.hpMax}</b> | 📍 Pos Atual: <b>X: ${pX} | Y: ${pY} | Z: ${pZ}</b><br>⚔️ Qtd. Ataques: <b>${ini.ataques ? ini.ataques.length : 1}</b>`;
        }
    });

    db.ref('cenario_inimigos').on('child_removed', (snapshot) => { let card = document.getElementById(`card-ini-${snapshot.key}`); if(card) card.remove(); });

    window.carregarEdicaoInimigo = function(id) {
        db.ref('cenario_inimigos/' + id).once('value').then(snap => {
            let data = snap.val(); if(!data) return; window.abrirAba('tab-inimigos', null);
            document.getElementById('novo-id').value = id; document.getElementById('novo-comportamento').value = data.comportamento || 'hostil';
            document.getElementById('novo-movimento').value = data.movimento || 'estatico';
            document.getElementById('novo-hp').value = data.hpMax || 50; 
            document.getElementById('novo-glb-caminho').value = data.modeloGlb || ''; document.getElementById('novo-escala').value = data.escala ? `${data.escala.x} ${data.escala.y} ${data.escala.z}` : '1 1 1';
            document.getElementById('novo-anim-parado').value = data.animParado || ''; document.getElementById('novo-anim-andando').value = data.animAndando || ''; 
            document.getElementById('novo-anim-morte').value = data.animMorte || ''; 
            
            document.getElementById('novo-spawn-x').value = data.spawnPos ? data.spawnPos.x : 0; document.getElementById('novo-spawn-y').value = data.spawnPos ? data.spawnPos.y : 0; 
            document.getElementById('novo-spawn-z').value = data.spawnPos ? data.spawnPos.z : 0; document.getElementById('novo-aggro-range').value = data.aggroRange || 15; 
            document.getElementById('novo-speed').value = data.speed || 0.08; 
            document.getElementById('novo-cooldown').value = data.cooldown || 2000; document.getElementById('novo-respawn-time').value = (data.respawnTime / 1000) || 60;
            
            // Limpa lista anterior e carrega os múltiplos ataques
            document.getElementById('container-lista-ataques').innerHTML = '';
            let ataques = data.ataques || [];
            
            // Tratamento retrocompatível para inimigos antigos sem array de ataques
            if(ataques.length === 0 && data.animAtaque) {
                ataques.push({
                    animacao: data.animAtaque, tipo: data.tipo || 'meelee', alcance: data.attackRange || 1.8,
                    dano: data.dano || 10, tempoHit: 400, duracao: 1000, osso: data.ossoAtaque || '',
                    glbTiro: data.modeloTiroGlb || '', escalaTiro: data.escalaTiro || '0.5 0.5 0.5', rotTiro: data.rotacaoTiro || '0 0 0', velTiro: data.velocidadeTiro || 6.0
                });
            }

            ataques.forEach(atk => adicionarFormAtaque(atk));
            if(ataques.length === 0) adicionarFormAtaque(); // Inicia com 1 pelo menos

            let formInimigo = document.getElementById('form-inimigo'); if(formInimigo) formInimigo.scrollIntoView({ behavior: 'smooth' });
        });
    };

    window.spawnarNovoInimigo = function() {
        let id = document.getElementById('novo-id').value; if(!id) return;
        let escIniArr = document.getElementById('novo-escala').value.split(' ');
        let escIniObj = { x: parseFloat(escIniArr[0])||1, y: parseFloat(escIniArr[1])||1, z: parseFloat(escIniArr[2])||1 };
        
        // Extraindo todos os ataques do HTML
        let listaAtksExtraidos = [];
        let blocosAtaque = document.querySelectorAll('.bloco-ataque');
        blocosAtaque.forEach(bloco => {
            listaAtksExtraidos.push({
                animacao: bloco.querySelector('.atk-anim').value,
                tipo: bloco.querySelector('.atk-tipo').value,
                alcance: parseFloat(bloco.querySelector('.atk-alcance').value) || 1.8,
                dano: parseFloat(bloco.querySelector('.atk-dano').value) || 10,
                tempoHit: parseFloat(bloco.querySelector('.atk-tempohit').value) || 400,
                duracao: parseFloat(bloco.querySelector('.atk-duracao').value) || 1000,
                osso: bloco.querySelector('.atk-osso').value.trim(),
                glbTiro: bloco.querySelector('.atk-glb').value,
                escalaTiro: bloco.querySelector('.atk-esc-tiro').value || '0.5 0.5 0.5',
                rotTiro: bloco.querySelector('.atk-rot-tiro').value || '0 0 0',
                velTiro: parseFloat(bloco.querySelector('.atk-vel-tiro').value) || 6.0
            });
        });

        if(listaAtksExtraidos.length === 0) { alert("Adicione pelo menos 1 ataque!"); return; }

        db.ref('cenario_inimigos/' + id).update({
            hpMax: parseFloat(document.getElementById('novo-hp').value) || 50, hp: parseFloat(document.getElementById('novo-hp').value) || 50,
            spawnPos: { x: parseFloat(document.getElementById('novo-spawn-x').value)||0, y: parseFloat(document.getElementById('novo-spawn-y').value)||0, z: parseFloat(document.getElementById('novo-spawn-z').value)||0 },
            pos: { x: parseFloat(document.getElementById('novo-spawn-x').value)||0, y: parseFloat(document.getElementById('novo-spawn-y').value)||0, z: parseFloat(document.getElementById('novo-spawn-z').value)||0 }, 
            comportamento: document.getElementById('novo-comportamento').value, movimento: document.getElementById('novo-movimento').value, escala: escIniObj,
            aggroRange: parseFloat(document.getElementById('novo-aggro-range').value) || 15, 
            speed: parseFloat(document.getElementById('novo-speed').value) || 0.08, cooldown: parseFloat(document.getElementById('novo-cooldown').value) || 2000,
            respawnTime: (parseFloat(document.getElementById('novo-respawn-time').value) || 60) * 1000, 
            modeloGlb: document.getElementById('novo-glb-caminho').value, animParado: document.getElementById('novo-anim-parado').value, animAndando: document.getElementById('novo-anim-andando').value,
            animMorte: document.getElementById('novo-anim-morte').value,
            ataques: listaAtksExtraidos // ARRAY SALVO NO BANCO
        }).then(() => alert(`Monstro ${id} atualizado com ${listaAtksExtraidos.length} ataque(s)!`));
    };

    // Inicialização do Upload de Inimigo padrão
    document.addEventListener('DOMContentLoaded', () => {
        let fIni = document.getElementById('file-ini-glb');
        if(fIni) fIni.addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file) return;
            document.getElementById('novo-glb-caminho').value = `Inimigos/${file.name}`;
            const loader = new THREE.GLTFLoader(); 
            loader.load(URL.createObjectURL(file), function(gltf) {
                const animations = gltf.animations; const datalist = document.getElementById('lista-animacoes'); 
                if (animations && animations.length > 0) {
                    if(datalist) datalist.innerHTML = ''; 
                    animations.forEach(anim => { let option = document.createElement('option'); option.value = anim.name; datalist.appendChild(option); });
                }
            });
        });
        
        // Se a tela for recarregada em branco e a aba for a primeira, criamos 1 formulário vazio pra não ficar sem ataques visíveis
        if (document.getElementById('container-lista-ataques').innerHTML === '') adicionarFormAtaque();
    }); 
</script>
</body>
</html>
