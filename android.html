<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG - Modo Celular (Android/iOS)</title>
    
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
        
        /* INTERFACE MOBILE FLUTUANTE */
        #mobile-ui { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1000; pointer-events: none; }
        
        /* O JOYSTICK */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; border: 2px solid rgba(255,255,255,0.3); }
        #joystick-stick { position: absolute; top: 50px; left: 50px; width: 50px; height: 50px; background: rgba(241, 196, 15, 0.8); border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none; transition: 0.05s ease-out;}
        
        /* BOTÕES DE AÇÃO */
        #action-buttons { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; }
        .hud-btn { width: 60px; height: 60px; border-radius: 50%; background: rgba(44, 62, 80, 0.8); border: 2px solid #bdc3c7; color: white; font-size: 1.5rem; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); font-weight: bold;}
        .hud-btn:active { background: #f1c40f; color: #111; transform: scale(0.95); }
        
        #btn-atacar { width: 80px; height: 80px; background: rgba(192, 57, 43, 0.8); border-color: #e74c3c; font-size: 2rem; margin-top: 10px;}
        
        .menu-top-right { position: absolute; top: 20px; right: 20px; display: flex; gap: 15px; pointer-events: auto;}
    </style>

    <script>
        // RECUPERA O USUÁRIO DO INDEX.HTML
        let uidSalvo = localStorage.getItem('mmo_uid');
        if (!uidSalvo) { window.location.href = 'index.html'; }

        const firebaseConfig = {
             apiKey: "AIzaSyCdsfW1ALz-8ktkYl_rACiY6tu0M2wqkH0",
             authDomain: "rpg-vr-online.firebaseapp.com",
             databaseURL: "https://rpg-vr-online-default-rtdb.firebaseio.com",
             projectId: "rpg-vr-online",
             storageBucket: "rpg-vr-online.firebasestorage.app",
             messagingSenderId: "676174796336",
             appId: "1:676174796336:web:7a91d19a758d29ef247ff5",
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const firestoreDB = firebase.firestore();
        const realtimeDB = firebase.database();

        window.GAME_MODE = 'ANDROID'; 
        window.GAME_STARTED = true; 
        window.currentUser = { uid: uidSalvo }; 
        window.lastActionTime = Date.now();
        
        window.playerState = {
            nivel: 1, xp: 0, xpProxNivel: 50, pontos: 0, ouro: 0, forca: 10, velocidade: 5, defesa: 5,
            hpAtual: 100, hpMax: 100, mpAtual: 100, mpMax: 100, vivo: true,
            armaEquipada: 'Desarmado', escudoEquipado: false, flechas: 10, shurikens: 5, chaves: {},
            invulneravel: false, ultimoRespawn: { id: 'base_inicial', x: 0, y: 0, z: 0 }
        };

        // MÁGICAS ANTI-PISCAR (Mesmas lógicas base do PC)
        AFRAME.registerComponent('anti-piscar', { init: function() { this.el.addEventListener('model-loaded', () => { const obj = this.el.getObject3D('mesh'); if (obj) { obj.traverse((node) => { if (node.isMesh) node.frustumCulled = false; }); } }); } });
        
        window.salvarJogoNuvem = function() { if (!window.currentUser || window.currentUser.uid === 'visitante') return; firestoreDB.collection("jogadores").doc(window.currentUser.uid).set(window.playerState).catch(e => console.error(e)); };
        window.tocarSom = function(idSom, volume = 0.5) { let audio = document.getElementById(idSom); if(audio && audio.src) { audio.volume = volume; audio.currentTime = 0; audio.play().catch(e => {}); } };

        window.bancoDeArmas = {
            'Desarmado': { categoria: 'Luva', danoBonus: 0, defesaBonus: 0, modeloGlb: '', visualDir: '', visualEsq: '' },
            'Espada Reta': { categoria: 'Espada', danoBonus: 5, defesaBonus: 1, modeloGlb: '', visualDir: '<a-cylinder color="#8B4513" radius="0.02" height="0.15" position="0 0 0"></a-cylinder><a-box color="#DAA520" width="0.15" height="0.05" depth="0.05" position="0 0.075 0"></a-box><a-cylinder color="#aaa" radius="0.02" height="0.8" position="0 0.5 0"></a-cylinder>', visualEsq: '' }
            // Copie o restante do bancoDeArmas do seu outro arquivo se quiser todos os modelos aqui!
        };

        // SISTEMA DE JOYSTICK VIRTUAL MOBILE
        let joystickVector = { x: 0, y: 0 };
        
        document.addEventListener('DOMContentLoaded', () => {
            const zone = document.getElementById('joystick-zone');
            const stick = document.getElementById('joystick-stick');
            let isDragging = false;
            let centerX, centerY, maxRadius = 50;

            zone.addEventListener('touchstart', (e) => {
                isDragging = true;
                let rect = zone.getBoundingClientRect();
                centerX = rect.left + rect.width / 2;
                centerY = rect.top + rect.height / 2;
                handleTouch(e);
            });

            zone.addEventListener('touchmove', (e) => { if(isDragging) handleTouch(e); });
            
            const releaseJoystick = () => {
                isDragging = false;
                stick.style.transform = `translate(0px, 0px)`;
                joystickVector = { x: 0, y: 0 };
            };
            
            zone.addEventListener('touchend', releaseJoystick);
            zone.addEventListener('touchcancel', releaseJoystick);

            function handleTouch(e) {
                e.preventDefault();
                let touch = e.targetTouches[0];
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                let distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance > maxRadius) {
                    dx = (dx / distance) * maxRadius;
                    dy = (dy / distance) * maxRadius;
                }
                
                stick.style.transform = `translate(${dx}px, ${dy}px)`;
                // Normaliza de -1 a 1 para o motor de física
                joystickVector.x = dx / maxRadius;
                joystickVector.y = dy / maxRadius;
            }
        });

        // COMPONENTE DE MOVIMENTO PELO JOYSTICK VIRTUAL
        AFRAME.registerComponent('mobile-movement', {
            tick: function(time, timeDelta) {
                if (!window.playerState.vivo || !window.GAME_STARTED) return;
                
                let dt = timeDelta / 1000;
                let speed = (0.1 + (window.playerState.velocidade * 0.01)) * 30; // Ajuste de velocidade
                
                if (Math.abs(joystickVector.x) > 0.1 || Math.abs(joystickVector.y) > 0.1) {
                    let camObj = document.querySelector('[camera]').object3D;
                    let rigObj = this.el.object3D;

                    let rotY = camObj.rotation.y;
                    let dirX = joystickVector.x;
                    let dirZ = joystickVector.y; // Y do joystick = Z no 3D

                    // Calcula vetor de direção baseado pra onde a câmera está olhando
                    let moveX = (dirX * Math.cos(rotY) + dirZ * Math.sin(rotY)) * speed * dt;
                    let moveZ = (-dirX * Math.sin(rotY) + dirZ * Math.cos(rotY)) * speed * dt;

                    rigObj.position.x += moveX;
                    rigObj.position.z += moveZ;
                }
            }
        });

        // O SISTEMA DE BOTÕES DA TELA
        AFRAME.registerComponent('mobile-controles', {
            init: function() {
                let menuAtrib = document.querySelector('#menu-atributos'); 
                let menuInv = document.querySelector('#menu-inventario-novo'); 
                let atribAberto = false; let invAberto = false; let podeAtacarPC = true;

                // ABRIR MENUS
                document.getElementById('btn-inv').addEventListener('touchstart', () => {
                    invAberto = !invAberto; if(menuInv) menuInv.setAttribute('scale', invAberto ? '0.65 0.65 0.65' : '0 0 0');
                    atualizarUI();
                });
                
                document.getElementById('btn-status').addEventListener('touchstart', () => {
                    atribAberto = !atribAberto; if(menuAtrib) menuAtrib.setAttribute('scale', atribAberto ? '0.7 0.7 0.7' : '0 0 0');
                    atualizarUI();
                });

                // ESCUDO
                document.getElementById('btn-escudo').addEventListener('touchstart', () => {
                    window.playerState.escudoEquipado = !window.playerState.escudoEquipado; atualizarUI(); 
                    let msg = window.playerState.escudoEquipado ? 'Escudo Equipado!' : 'Escudo Guardado!'; 
                    let aviso = document.querySelector('#texto-central'); if(aviso) { aviso.setAttribute('value', msg); aviso.setAttribute('color', window.playerState.escudoEquipado ? '#4169E1' : '#FF4500'); aviso.setAttribute('visible', 'true'); setTimeout(() => { if(aviso) aviso.setAttribute('visible', 'false'); }, 1500); }
                });

                // ATACAR
                document.getElementById('btn-atacar').addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if(!window.playerState.vivo || invAberto || atribAberto) return;
                    let armaStats = window.bancoDeArmas[window.playerState.armaEquipada]; if(!armaStats) return;

                    if(armaStats.categoria === 'Espada' || armaStats.categoria === 'Luva') {
                        if (!podeAtacarPC) return; podeAtacarPC = false; setTimeout(() => podeAtacarPC = true, 800);
                        window.tocarSom('snd-sword');
                        
                        let pcWeapon = document.querySelector('#arma-visual-pc'); 
                        if(pcWeapon) { pcWeapon.removeAttribute('animation'); pcWeapon.setAttribute('animation', 'property: rotation; to: -60 45 -45; dur: 150; dir: alternate; loop: 1'); setTimeout(() => { if(pcWeapon) pcWeapon.setAttribute('rotation', '-90 0 0'); }, 300); }
                        
                        let cameraObj = document.querySelector('[camera]'); if(!cameraObj) return;
                        let posCamera = new THREE.Vector3(); let direcao = new THREE.Vector3(0, 0, -1); cameraObj.object3D.getWorldPosition(posCamera); direcao.applyQuaternion(cameraObj.object3D.quaternion);
                        
                        let inimigosEls = document.querySelectorAll('[sistema-inimigo-sync]');
                        inimigosEls.forEach(inimigoEl => { 
                            if(!inimigoEl.object3D) return; 
                            let posInimigo = new THREE.Vector3(); inimigoEl.object3D.getWorldPosition(posInimigo); posInimigo.y += 1.0;
                            if (posCamera.distanceTo(posInimigo) < 4.0 && direcao.dot(new THREE.Vector3().subVectors(posInimigo, posCamera).normalize()) > 0.6) { 
                                let syncComp = inimigoEl.components['sistema-inimigo-sync']; if(syncComp) syncComp.receberDano(Math.floor((window.playerState.forca + armaStats.danoBonus) * 1.5), armaStats.categoria); 
                            } 
                        });
                    }
                });
            }
        });

        // ==========================================
        // DEMAIS FUNÇÕES DE UI E SERVIDOR
        // ==========================================
        window.receberDanoJogador = function(danoBase) { /* Copie a lógica de dano do pc.html aqui */ };
        function atualizarUI() { /* Copie a lógica de atualizarUI do pc.html aqui */ }
        function atualizarArmaVisual() { /* Copie a lógica de atualizarArmaVisual do pc.html aqui */ }
        window.abrirDialogoNPC = function(data) { /* Copie a lógica do pc.html aqui */ };
        window.fecharDialogoNPC = function() { /* Copie a lógica do pc.html aqui */ };
        window.aceitarMissaoNPC = function() { /* Copie a lógica do pc.html aqui */ };
        
        // COPIE AQUI TAMBÉM OS COMPONENTES:
        // firebase-multiplayer, gerenciador-respawns, sistema-inimigo-sync, gerenciador-inimigos, gerenciador-npcs, sistema-npc-interacao, gerador-inventario, etc. (Igual ao pc.html)

    </script>
</head>
<body>

    <div id="mobile-ui">
        <div class="menu-top-right">
            <div class="hud-btn" id="btn-inv">🎒</div>
            <div class="hud-btn" id="btn-status">📈</div>
        </div>

        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>

        <div id="action-buttons">
            <div class="hud-btn" id="btn-escudo">🛡️</div>
            <div class="hud-btn" id="btn-atacar">⚔️</div>
        </div>
    </div>

    <a-scene mobile-controles renderer="colorManagement: true;">
        
        <a-entity environment="preset: forest; groundColor: #445; grid: none"></a-entity>

        <a-box class="interativo" sistema-bau position="-3 0.5 -3" rotation="0 45 0" color="#4CC3D9" shadow>
            <a-text value="Loot" position="-0.3 0.6 0" color="#FFF" scale="0.8 0.8 0.8"></a-text>
        </a-box>

        <a-entity id="rig" mobile-movement position="0 0 0">
            <a-entity camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
                
                <a-entity cursor="fuse: false" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025" material="color: white; shader: flat; opacity: 0.8" raycaster="objects: .interativo; far: 20"></a-entity>
                
                <a-entity id="arma-visual-pc" position="0.3 -0.3 -0.6" rotation="-90 0 0" scale="0.7 0.7 0.7"></a-entity>
                <a-entity id="escudo-visual-pc" position="-0.4 -0.2 -0.5" rotation="180 0 0" scale="0.7 0.7 0.7"></a-entity>

                <a-plane id="dano-tela" position="0 0 -0.5" width="2" height="2" color="#ff0000" opacity="0.3" visible="false"></a-plane>
                <a-text id="texto-central" value="" position="0 -0.3 -1.5" color="#00FF00" visible="false" scale="0.5 0.5 0.5" align="center"></a-text>
                
                <a-entity id="caixa-dialogo" position="0 -0.2 -1.2" visible="false" rotation="-10 0 0">
                    <a-plane color="#1e272e" width="1.8" height="1.0" opacity="0.95"></a-plane>
                    <a-plane color="#2c3e50" width="1.8" height="0.2" position="0 0.4 0.01"></a-plane>
                    <a-text id="npc-nome-ui" value="Nome do NPC" position="-0.85 0.4 0.02" color="#00ffcc" scale="0.45 0.45 0.45"></a-text>
                    <a-text id="npc-texto-ui" value="Texto..." position="-0.85 0.2 0.01" color="#FFF" scale="0.35 0.35 0.35" wrap-count="45" baseline="top"></a-text>
                </a-entity>
                
            </a-entity> 

            <a-entity id="menu-inventario-novo" scale="0 0 0" position="-0.5 1.5 -1.6" rotation="0 15 0">
                 </a-entity>

            <a-entity id="menu-atributos" scale="0 0 0" position="1.3 1.5 -1.2" rotation="0 -30 0">
                 </a-entity>
        </a-entity>
    </a-scene>
</body>
</html>
